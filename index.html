<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4caf50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="お小遣い手帳">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="images/2728.png">
<title>お小遣い手帳 - トップ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
h1 { text-align: center; margin-bottom: 24px; color: #333; }
.children-list { max-width: 480px; margin: 0 auto; width: 100%; }
.child-card {
  display: flex; justify-content: space-between; align-items: center;
  background: #fff; border-radius: 12px; padding: 20px 24px;
  margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
  text-decoration: none; color: inherit;
}
.child-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
.child-name { font-size: 1.3em; font-weight: 600; }
.child-balance { font-size: 1.3em; font-weight: 700; color: #4caf50; }
.child-balance.negative { color: #e53935; }
.loading { text-align: center; color: #999; margin-top: 40px; }

/* モーダル */
.overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.4); z-index: 100; justify-content: center; align-items: center;
}
.overlay.active { display: flex; }
.modal {
  background: #fff; border-radius: 16px; padding: 28px 24px;
  width: 90%; max-width: 360px; box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  text-align: center;
}
.modal h2 { margin-bottom: 16px; font-size: 1.2em; color: #333; }
.modal input {
  width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;
  font-size: 1em; margin-bottom: 12px; text-align: center;
}
.modal .error-msg { color: #e53935; font-size: 0.9em; margin-bottom: 10px; display: none; }
.modal-btns { display: flex; gap: 8px; }
.modal-btns button {
  flex: 1; padding: 12px; border: none; border-radius: 8px;
  font-size: 1em; font-weight: 600; cursor: pointer;
}
.btn-ok { background: #4caf50; color: #fff; }
.btn-cancel { background: #eee; color: #333; }
.btn-ok:hover, .btn-cancel:hover { opacity: 0.9; }

@media (max-width: 520px) {
  body { padding: 12px; }
  h1 { font-size: 1.4em; }
  .child-card { padding: 16px 18px; }
  .child-name, .child-balance { font-size: 1.1em; }
}

/* ぷよ畑（garden.jsと連動） */
.puyo-garden {
  position: fixed; bottom: 0; left: 0; width: 100%; height: 90px;
  z-index: 50; pointer-events: none;
}
.garden-ground {
  position: absolute; bottom: 0; left: 0; width: 100%; height: 35px;
  background: linear-gradient(to bottom, #8B6914, #6B4F12, #5a4210);
  border-top: 3px solid #9acd32;
}
.garden-grass {
  position: absolute; bottom: 33px; left: 0; width: 100%; height: 8px;
  background: repeating-linear-gradient(90deg, transparent, transparent 8px, #6a9f30 8px, #6a9f30 10px);
  opacity: 0.6;
}
.puyo-sprout {
  position: absolute; bottom: 20px; cursor: pointer; pointer-events: auto;
  transition: transform 0.15s;
  display: flex; flex-direction: column; align-items: center;
}
.puyo-sprout:hover { transform: translateY(-3px); }
.puyo-sprout .sprout-leaf {
  font-size: 22px; line-height: 1;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.2));
}
.puyo-sprout.pulled .sprout-leaf {
  transition: transform 0.3s, opacity 0.3s;
  transform: scale(0.3);
  opacity: 0;
}
.puyo-sprout.pulled {
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  transform: translateY(-120px) scale(1.2);
  opacity: 0;
}
.dirt-poof {
  position: absolute; pointer-events: none; font-size: 20px;
  animation: poofUp 0.6s ease-out forwards;
}
@keyframes poofUp {
  0% { opacity: 1; transform: translateY(0) scale(0.5); }
  100% { opacity: 0; transform: translateY(-30px) scale(1.5); }
}
.puyo-fly {
  position: fixed; pointer-events: none; z-index: 200;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
}
.puyo-fly img {
  width: 65px; height: 65px; border-radius: 50%; object-fit: cover;
}
@keyframes puyoJump {
  0% { transform: translateY(0) scale(1); }
  40% { transform: translateY(-80px) scale(1.15); }
  60% { transform: translateY(-80px) scale(1.15); }
  85% { transform: translateY(0) scale(0.95); }
  100% { transform: translateY(0) scale(1); }
}
@keyframes puyoWalk {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-4px) rotate(-8deg); }
  75% { transform: translateY(-4px) rotate(8deg); }
}
</style>
</head>
<body>

<div id="puyoStats" style="text-align:center; margin-bottom:4px; font-size:0.75em; color:#999;"></div>

<!-- 隠しボタン（左上透明） -->
<div id="secretBtn" style="position:fixed; top:0; left:0; width:60px; height:60px; z-index:90; cursor:default;"></div>
<h1><span id="gardenBtn" style="cursor:pointer; font-size:1.2em;">&#x1FAB4;</span> <a href="pages/game.html" style="text-decoration:none; font-size:1.2em;">&#x1F4B4;</a> &#x304A;&#x5C0F;&#x9063;&#x3044;&#x624B;&#x5E33; <span style="cursor:pointer; font-size:0.6em; opacity:0.4;" onclick="goAdmin()">&#x1F527;</span></h1>

<div class="children-list" id="children">
  <div class="loading">読み込み中...</div>
</div>

<!-- お手伝いアイコン -->
<div style="position:fixed; bottom:100px; left:50%; transform:translateX(-50%); z-index:40;">
  <a href="pages/allowance.html" style="text-decoration:none; font-size:2.5em; filter:drop-shadow(0 2px 6px rgba(0,0,0,0.2));">&#x1F9F9;</a>
</div>

<!-- ぷよ畑 -->
<div class="puyo-garden" id="puyoGarden" style="display:none;">
  <div class="garden-grass"></div>
  <div class="garden-ground"></div>
</div>

<!-- 管理者パスワードモーダル -->
<div class="overlay" id="adminOverlay">
  <div class="modal">
    <h2>🔧 管理者パスワード</h2>
    <div class="error-msg" id="adminError">パスワードが違います</div>
    <input type="password" id="adminPwInput" placeholder="パスワード" autocomplete="off">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeAdminModal()">キャンセル</button>
      <button class="btn-ok" onclick="submitAdminPw()">OK</button>
    </div>
  </div>
</div>

<!-- パスワードモーダル -->
<div class="overlay" id="pwOverlay">
  <div class="modal">
    <h2 id="pwTitle">🔒 パスワードを入力</h2>
    <div class="error-msg" id="pwError">パスワードが違います</div>
    <input type="password" id="pwInput" placeholder="パスワード" autocomplete="off">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
      <button class="btn-ok" onclick="submitPassword()">OK</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://ynecezxnltigplrfzzoh.supabase.co";
const SUPABASE_KEY = "sb_publishable_seKZakec1yB046vlgPDAKQ_zd4CKIg4";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DISCORD_WEBHOOK = 'https://discord.com/api/webhooks/1498552364905529355/6I3vultTaQcYNRjPP76ZtyyyGLG1JWdU7eX3IfMtpGCUWR3sdw2Gn3_pNxHgaS-z9iyG';

let allChildren = [];
let pendingChildId = null;
let adminFailCount = 0;

// --- Discord通知 ---
async function notifyDiscordTop(content) {
  try { await fetch(DISCORD_WEBHOOK, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({content}) }); } catch(e) {}
}

// --- アカウント一覧読み込み ---
async function load() {
  const { data, error } = await client.from('children').select('*').order('sort_order', { ascending: true });
  const container = document.getElementById('children');

  if (error || !data) {
    container.innerHTML = '<div class="loading">データの取得に失敗しました</div>';
    return;
  }

  allChildren = data;
  container.innerHTML = '';

  data.forEach(c => {
    const isNeg = c.balance < 0 ? ' negative' : '';
    const hasPassword = c.require_password && c.password;
    const showBalance = !hasPassword && c.show_balance_on_top !== false;
    const balanceText = showBalance ? `${c.balance.toLocaleString()}円` : '****円';
    const lock = hasPassword ? ' 🔒' : '';
    container.innerHTML += `
      <div class="child-card" data-id="${c.id}">
        <span class="child-name">${c.name}${lock}</span>
        <span class="child-balance${isNeg}">${balanceText}</span>
      </div>
    `;
  });

  // カードにクリックイベントを設定
  container.querySelectorAll('.child-card').forEach(card => {
    card.addEventListener('click', () => goToChild(card.dataset.id));
  });
}

// --- パスワード認証（アカウント） ---
function goToChild(id) {
  const child = allChildren.find(c => String(c.id) === String(id));
  if (!child) return;

  if (child.require_password && child.password) {
    // パスワードが必要 → モーダル表示
    pendingChildId = id;
    document.getElementById('pwTitle').textContent = `🔒 ${child.name} のパスワード`;
    document.getElementById('pwError').style.display = 'none';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwOverlay').classList.add('active');
    setTimeout(() => document.getElementById('pwInput').focus(), 100);
  } else {
    window.location.href = `pages/child.html?id=${id}`;
  }
}

function submitPassword() {
  const child = allChildren.find(c => String(c.id) === String(pendingChildId));
  const input = document.getElementById('pwInput').value;

  if (input === child.password) {
    const targetId = pendingChildId;
    closeModal();
    window.location.href = `pages/child.html?id=${targetId}`;
  } else {
    document.getElementById('pwError').style.display = 'block';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
  }
}

function closeModal() {
  document.getElementById('pwOverlay').classList.remove('active');
  pendingChildId = null;
}

// Enterキーでも送信
document.getElementById('pwInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitPassword();
});

// オーバーレイクリックで閉じる
document.getElementById('pwOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

// --- 管理者認証 ---
function goAdmin() {
  document.getElementById('adminError').style.display = 'none';
  document.getElementById('adminPwInput').value = '';
  document.getElementById('adminOverlay').classList.add('active');
  setTimeout(() => document.getElementById('adminPwInput').focus(), 100);
}

function submitAdminPw() {
  const input = document.getElementById('adminPwInput').value;
  if (input === 'mgmlv') {
    adminFailCount = 0;
    document.getElementById('adminOverlay').classList.remove('active');
    notifyDiscordTop('🔧 管理者ページにログインしました');
    window.location.href = 'pages/admin.html';
  } else {
    adminFailCount++;
    document.getElementById('adminError').style.display = 'block';
    document.getElementById('adminPwInput').value = '';
    document.getElementById('adminPwInput').focus();

    if (adminFailCount >= 5) {
      closeAdminModal();
      unleashRoaches();
    }
  }
}

function closeAdminModal() {
  document.getElementById('adminOverlay').classList.remove('active');
}

document.getElementById('adminPwInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitAdminPw();
});

// --- Service Worker ---
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}

// --- キャッシュクリア（将来のUI復活用に残す） ---
async function clearCacheAndReload() {
  if ('caches' in window) {
    const keys = await caches.keys();
    await Promise.all(keys.map(k => caches.delete(k)));
  }
  if ('serviceWorker' in navigator) {
    const regs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map(r => r.unregister()));
  }
  location.reload(true);
}

// --- ぷよ・ゴキブリカウント（Supabase） ---
async function incrementPuyoCount(imgSrc) {
  try {
    const match = imgSrc.match(/puyo_(\d)/);
    if (!match) return;
    const puyoId = parseInt(match[1]);
    const puyoName = 'puyo_' + puyoId;
    // upsertでカウントを増やす（レコードがなくても安全）
    const { data } = await client.from('puyo_counts').select('count').eq('id', puyoId).maybeSingle();
    if (data) {
      await client.from('puyo_counts').update({ count: data.count + 1 }).eq('id', puyoId);
    } else {
      await client.from('puyo_counts').upsert({ id: puyoId, name: puyoName, count: 1 });
    }
    await client.from('activity_log').insert({ type: 'puyo', name: puyoName });
  } catch (e) { console.error('incrementPuyoCount error:', e); }
}

async function incrementRoachCount() {
  try {
    const { data } = await client.from('roach_counts').select('count').eq('id', 1).maybeSingle();
    if (data) {
      await client.from('roach_counts').update({ count: data.count + 1 }).eq('id', 1);
    } else {
      await client.from('roach_counts').upsert({ id: 1, count: 1 });
    }
    await client.from('activity_log').insert({ type: 'roach', name: 'roach' });
  } catch (e) { console.error('incrementRoachCount error:', e); }
}

// --- カウント表示・リアルタイム更新 ---
async function loadPuyoCounts() {
  const { data: puyoData } = await client.from('puyo_counts').select('*').order('id');
  const container = document.getElementById('puyoStats');
  if (!container) return;
  let html = '';
  if (puyoData) {
    html += puyoData.map(p =>
      `<span style="margin:0 3px;"><img src="images/${p.name}.avif" style="width:16px;height:16px;border-radius:50%;vertical-align:middle;object-fit:cover;"><span id="cnt_${p.id}">${p.count}</span></span>`
    ).join('');
  }
  container.innerHTML = html;
}

// リアルタイム更新: ぷよカウントが変わったら即反映
function setupRealtimePuyoCounts() {
  client.channel('puyo_counts_changes')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'puyo_counts' }, payload => {
      const el = document.getElementById('cnt_' + payload.new.id);
      if (el) el.textContent = payload.new.count;
    })
    .subscribe();
}

// --- 隠しボタン（ゴキブリカウント表示） ---
(function setupSecretBtn() {
  const btn = document.getElementById('secretBtn');
  let taps = [];
  btn.addEventListener('click', () => {
    const now = Date.now();
    taps.push(now);
    taps = taps.filter(t => now - t < 2000);
    if (taps.length >= 5) {
      taps = [];
      showRoachCount();
    }
  });
})();

async function showRoachCount() {
  const { data } = await client.from('roach_counts').select('count').eq('id', 1).maybeSingle();
  const count = data ? data.count : 0;
  const container = document.getElementById('puyoStats');
  // 既に表示されていなければ追加
  if (!document.getElementById('roachStatSecret')) {
    const span = document.createElement('span');
    span.id = 'roachStatSecret';
    span.style.cssText = 'margin-left:8px;';
    span.textContent = '\u{1FAB3}' + count;
    container.appendChild(span);
  }
}

load();
loadPuyoCounts();
setupRealtimePuyoCounts();
</script>

<script src="js/roach.js"></script>
<script src="js/garden.js"></script>

<div style="position:fixed; bottom:4px; right:8px; font-size:0.6em; color:#ccc;"><a href="pages/release-notes.html" style="color:#ccc; text-decoration:none;">v1.5.1</a></div>

</body>
</html>
