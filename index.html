<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>お小遣い管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<style>
body { font-family: sans-serif; padding: 20px; }
.card { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; }
</style>
</head>
<body>

<h1>お小遣い管理</h1>

<h2>合計: <span id="total">0</span>円</h2>

<div id="children"></div>

<hr>

<h2>操作</h2>

<select id="childSelect"></select><br><br>

<input type="number" id="amount" placeholder="金額"><br><br>
<input type="text" id="memo" placeholder="メモ"><br><br>

<button onclick="addMoney()">追加</button>
<button onclick="useMoney()">使用</button>

<hr>

<h2>履歴</h2>
<ul id="history"></ul>

<script>
const SUPABASE_URL = "https://YOUR_PROJECT.supabase.co";
const SUPABASE_KEY = "YOUR_ANON_KEY";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let children = [];

async function load() {
  const { data } = await client.from('children').select('*');
  children = data;

  const container = document.getElementById('children');
  const select = document.getElementById('childSelect');
  container.innerHTML = '';
  select.innerHTML = '';

  let total = 0;

  children.forEach(c => {
    total += c.balance;

    container.innerHTML += `
      <div class="card">
        ${c.name}: ${c.balance}円
      </div>
    `;

    select.innerHTML += `<option value="${c.id}">${c.name}</option>`;
  });

  document.getElementById('total').innerText = total;

  loadHistory();
}

async function loadHistory() {
  const { data } = await client
    .from('transactions')
    .select('*')
    .order('created_at', { ascending: false })
    .limit(10);

  const list = document.getElementById('history');
  list.innerHTML = '';

  data.forEach(t => {
    list.innerHTML += `
      <li>${t.type} ${t.amount}円 - ${t.memo}</li>
    `;
  });
}

async function addMoney() {
  const childId = document.getElementById('childSelect').value;
  const amount = parseInt(document.getElementById('amount').value);
  const memo = document.getElementById('memo').value;

  const child = children.find(c => c.id === childId);
  const newBalance = child.balance + amount;

  await client.from('children')
    .update({ balance: newBalance })
    .eq('id', childId);

  await client.from('transactions').insert({
    child_id: childId,
    type: 'add',
    amount,
    memo
  });

  load();
}

async function useMoney() {
  const childId = document.getElementById('childSelect').value;
  const amount = parseInt(document.getElementById('amount').value);
  const memo = document.getElementById('memo').value;

  const child = children.find(c => c.id === childId);
  const newBalance = child.balance - amount;

  await client.from('children')
    .update({ balance: newBalance })
    .eq('id', childId);

  await client.from('transactions').insert({
    child_id: childId,
    type: 'use',
    amount,
    memo
  });

  load();
}

load();
</script>

</body>
</html>
