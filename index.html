<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4caf50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="お小遣い手帳">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="images/2728.png">
<title>お小遣い手帳 - トップ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
h1 { text-align: center; margin-bottom: 24px; color: #333; }
.children-list { max-width: 480px; margin: 0 auto; width: 100%; }
.child-card {
  display: flex; justify-content: space-between; align-items: center;
  background: #fff; border-radius: 12px; padding: 20px 24px;
  margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
  text-decoration: none; color: inherit;
}
.child-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
.child-name { font-size: 1.3em; font-weight: 600; }
.child-balance { font-size: 1.3em; font-weight: 700; color: #4caf50; }
.child-balance.negative { color: #e53935; }
.loading { text-align: center; color: #999; margin-top: 40px; }

/* モーダル */
.overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.4); z-index: 100; justify-content: center; align-items: center;
}
.overlay.active { display: flex; }
.modal {
  background: #fff; border-radius: 16px; padding: 28px 24px;
  width: 90%; max-width: 360px; box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  text-align: center;
}
.modal h2 { margin-bottom: 16px; font-size: 1.2em; color: #333; }
.modal input {
  width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;
  font-size: 1em; margin-bottom: 12px; text-align: center;
}
.modal .error-msg { color: #e53935; font-size: 0.9em; margin-bottom: 10px; display: none; }
.modal-btns { display: flex; gap: 8px; }
.modal-btns button {
  flex: 1; padding: 12px; border: none; border-radius: 8px;
  font-size: 1em; font-weight: 600; cursor: pointer;
}
.btn-ok { background: #4caf50; color: #fff; }
.btn-cancel { background: #eee; color: #333; }
.btn-ok:hover, .btn-cancel:hover { opacity: 0.9; }

@media (max-width: 520px) {
  body { padding: 12px; }
  h1 { font-size: 1.4em; }
  .child-card { padding: 16px 18px; }
  .child-name, .child-balance { font-size: 1.1em; }
}

/* ぷよ畑 */
.puyo-garden {
  position: fixed; bottom: 0; left: 0; width: 100%; height: 90px;
  z-index: 50; pointer-events: none;
}
.garden-ground {
  position: absolute; bottom: 0; left: 0; width: 100%; height: 35px;
  background: linear-gradient(to bottom, #8B6914, #6B4F12, #5a4210);
  border-top: 3px solid #9acd32;
}
.garden-grass {
  position: absolute; bottom: 33px; left: 0; width: 100%; height: 8px;
  background: repeating-linear-gradient(90deg, transparent, transparent 8px, #6a9f30 8px, #6a9f30 10px);
  opacity: 0.6;
}
.puyo-sprout {
  position: absolute; bottom: 20px; cursor: pointer; pointer-events: auto;
  transition: transform 0.15s;
  display: flex; flex-direction: column; align-items: center;
}
.puyo-sprout:hover { transform: translateY(-3px); }
.puyo-sprout .sprout-leaf {
  font-size: 22px; line-height: 1;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.2));
}
.puyo-sprout.pulled .sprout-leaf {
  transition: transform 0.3s, opacity 0.3s;
  transform: scale(0.3);
  opacity: 0;
}
.puyo-sprout.pulled {
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  transform: translateY(-120px) scale(1.2);
  opacity: 0;
}
.dirt-poof {
  position: absolute; pointer-events: none; font-size: 20px;
  animation: poofUp 0.6s ease-out forwards;
}
@keyframes poofUp {
  0% { opacity: 1; transform: translateY(0) scale(0.5); }
  100% { opacity: 0; transform: translateY(-30px) scale(1.5); }
}
.puyo-fly {
  position: fixed; pointer-events: none; z-index: 200;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
}
.puyo-fly img {
  width: 65px; height: 65px; border-radius: 50%; object-fit: cover;
}
@keyframes puyoJump {
  0% { transform: translateY(0) scale(1); }
  40% { transform: translateY(-80px) scale(1.15); }
  60% { transform: translateY(-80px) scale(1.15); }
  85% { transform: translateY(0) scale(0.95); }
  100% { transform: translateY(0) scale(1); }
}
@keyframes puyoWalk {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-4px) rotate(-8deg); }
  75% { transform: translateY(-4px) rotate(8deg); }
}
</style>
</head>

<h1><span style="cursor:pointer;" onclick="clearCacheAndReload()">&#x1F504;</span><span id="gardenBtn" style="cursor:pointer;">&#x1FAB4;</span><a href="pages/game.html" style="text-decoration:none;">&#x1F4B4;</a> &#x304A;&#x5C0F;&#x9063;&#x3044;&#x624B;&#x5E33; <span style="cursor:pointer; font-size:0.6em; opacity:0.4;" onclick="goAdmin()">&#x1F527;</span></h1>

</div>

<!-- パスワードモーダル -->
<div class="overlay" id="pwOverlay">
  <div class="modal">

    <div class="error-msg" id="pwError">パスワードが違います</div>
    <input type="password" id="pwInput" placeholder="パスワード" autocomplete="off">
    <div class="modal-btns">

</div>

<script>
const SUPABASE_URL = "https://ynecezxnltigplrfzzoh.supabase.co";
const SUPABASE_KEY = "sb_publishable_seKZakec1yB046vlgPDAKQ_zd4CKIg4";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DISCORD_WEBHOOK = 'https://discord.com/api/webhooks/1498552364905529355/6I3vultTaQcYNRjPP76ZtyyyGLG1JWdU7eX3IfMtpGCUWR3sdw2Gn3_pNxHgaS-z9iyG';
async function notifyDiscordTop(content) {
  try { await fetch(DISCORD_WEBHOOK, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({content}) }); } catch(e) {}
}

async function load() {
  const { data, error } = await client.from('children').select('*').order('sort_order', { ascending: true });
  const container = document.getElementById('children');

  if (error || !data) {
    container.innerHTML = '<div class="loading">データの取得に失敗しました</div>';
    return;
  }

  allChildren = data;
  container.innerHTML = '';

  data.forEach(c => {
    const isNeg = c.balance < 0 ? ' negative' : '';
    const hasPassword = c.require_password && c.password;
    const showBalance = !hasPassword && c.show_balance_on_top !== false;
    const balanceText = showBalance ? `${c.balance.toLocaleString()}円` : '****円';
    const lock = hasPassword ? ' 🔒' : '';
    container.innerHTML += `
      <div class="child-card" data-id="${c.id}">
        <span class="child-name">${c.name}${lock}</span>
        <span class="child-balance${isNeg}">${balanceText}</span>
      </div>
    `;
  });

  // カードにクリックイベントを設定
  container.querySelectorAll('.child-card').forEach(card => {
    card.addEventListener('click', () => goToChild(card.dataset.id));
  });
}

function goToChild(id) {
  const child = allChildren.find(c => String(c.id) === String(id));
  if (!child) return;

  if (child.require_password && child.password) {
    // パスワードが必要 → モーダル表示
    pendingChildId = id;
    document.getElementById('pwTitle').textContent = `🔒 ${child.name} のパスワード`;
    document.getElementById('pwError').style.display = 'none';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwOverlay').classList.add('active');
    setTimeout(() => document.getElementById('pwInput').focus(), 100);
  } else {
    window.location.href = `pages/child.html?id=${id}`;
  }
}

function submitPassword() {
  const child = allChildren.find(c => String(c.id) === String(pendingChildId));
  const input = document.getElementById('pwInput').value;

  if (input === child.password) {
    const targetId = pendingChildId;
    closeModal();
    window.location.href = `pages/child.html?id=${targetId}`;
  } else {
    document.getElementById('pwError').style.display = 'block';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
  }
}

function closeModal() {
  document.getElementById('pwOverlay').classList.remove('active');
  pendingChildId = null;
}

// Enterキーでも送信
document.getElementById('pwInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitPassword();
});

// オーバーレイクリックで閉じる
document.getElementById('pwOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

function goAdmin() {
  document.getElementById('adminError').style.display = 'none';
  document.getElementById('adminPwInput').value = '';
  document.getElementById('adminOverlay').classList.add('active');
  setTimeout(() => document.getElementById('adminPwInput').focus(), 100);
}

let adminFailCount = 0;
let roachCount = 0;

function submitAdminPw() {
  const input = document.getElementById('adminPwInput').value;
  if (input === 'mgmlv') {
    adminFailCount = 0;
    document.getElementById('adminOverlay').classList.remove('active');
    notifyDiscordTop('🔧 管理者ページにログインしました');
    window.location.href = 'pages/admin.html';
  } else {
    adminFailCount++;
    document.getElementById('adminError').style.display = 'block';
    document.getElementById('adminPwInput').value = '';
    document.getElementById('adminPwInput').focus();

    if (adminFailCount >= 5) {
      closeAdminModal();
      unleashRoaches();
    }
  }
}

function unleashRoaches() {
  const blocker = document.createElement('div');
  blocker.id = 'roachBlocker';
  blocker.style.cssText = `
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:transparent; z-index:9998;
  `;
  document.body.appendChild(blocker);

  roachCount = 15;

  // 1分後にスプレーアイコン表示
  setTimeout(() => {
    if (roachCount > 0) {
      const sprayBtn = document.createElement('div');
      sprayBtn.id = 'sprayBtn';
      sprayBtn.textContent = '🧴';
      sprayBtn.style.cssText = `
        position:fixed; bottom:30px; right:24px;
        font-size:2.5em; z-index:10001; cursor:pointer;
        animation:sprayPulse 1.5s infinite;
        filter:drop-shadow(0 2px 8px rgba(0,0,0,0.3));
      `;
      document.body.appendChild(sprayBtn);

      const style = document.createElement('style');
      style.id = 'sprayStyle';
      style.textContent = `
        @keyframes sprayPulse {
          0%, 100% { transform:scale(1); }
          50% { transform:scale(1.15); }
        }
        @keyframes sprayMist1 {
          0% { opacity:0; transform:scale(0.3); }
          20% { opacity:0.6; }
          100% { opacity:0; transform:scale(5); }
        }
        @keyframes sprayMist2 {
          0% { opacity:0; transform:scale(0.2); }
          30% { opacity:0.4; }
          100% { opacity:0; transform:scale(4); }
        }
        @keyframes sprayHiss {
          0% { opacity:0; }
          10% { opacity:0.15; }
          100% { opacity:0; }
        }
      `;
      document.head.appendChild(style);

      sprayBtn.addEventListener('click', () => {
        sprayBtn.style.pointerEvents = 'none';
        sprayBtn.style.animation = 'none';
        sprayBtn.style.opacity = '0.5';

        // 白い霧（メイン）
        const mist1 = document.createElement('div');
        mist1.style.cssText = `
          position:fixed; top:0; left:0; width:100%; height:100%;
          background:radial-gradient(circle, rgba(255,255,255,0.6) 0%, rgba(200,230,200,0.3) 30%, transparent 60%);
          z-index:10002; pointer-events:none;
          animation:sprayMist1 5s ease-out forwards;
        `;
        document.body.appendChild(mist1);

        // 緑の霧（追従）
        setTimeout(() => {
          const mist2 = document.createElement('div');
          mist2.style.cssText = `
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:radial-gradient(circle, rgba(150,220,150,0.4) 0%, rgba(150,200,150,0.15) 40%, transparent 65%);
            z-index:10002; pointer-events:none;
            animation:sprayMist2 4s ease-out forwards;
          `;
          document.body.appendChild(mist2);
          setTimeout(() => mist2.remove(), 4000);
        }, 500);

        // 画面全体が一瞬白くなる（シュー音のイメージ）
        const flash = document.createElement('div');
        flash.style.cssText = `
          position:fixed; top:0; left:0; width:100%; height:100%;
          background:#fff; z-index:10003; pointer-events:none;
          animation:sprayHiss 1.5s ease-out forwards;
        `;
        document.body.appendChild(flash);
        setTimeout(() => flash.remove(), 1500);
        setTimeout(() => mist1.remove(), 5000);

        // サイズ順にソート（小さい順）して順番に倒す
        const roaches = Array.from(document.querySelectorAll('[data-roach]'));
        roaches.sort((a, b) => parseFloat(a.dataset.size) - parseFloat(b.dataset.size));

        roaches.forEach((r, i) => {
          setTimeout(() => {
            const aid = parseInt(r.dataset.animid);
            if (aid) cancelAnimationFrame(aid);
            r.style.pointerEvents = 'none';
            r.style.transition = 'transform 0.3s';
            r.style.transform += ' rotate(90deg)';
            incrementRoachCount();
            setTimeout(() => {
              r.style.transform += ' rotate(180deg)';
              setTimeout(() => {
                r.textContent = '💀';
                r.style.opacity = '0.5';
                r.style.transform += ' scale(0.6)';
                setTimeout(() => r.remove(), 500);
              }, 300);
            }, 300);
          }, i * 300);
        });

        setTimeout(() => {
          roachCount = 0;
          const blocker = document.getElementById('roachBlocker');
          if (blocker) blocker.remove();
          adminFailCount = 0;
          sprayBtn.remove();
          const s = document.getElementById('sprayStyle');
          if (s) s.remove();
        }, roaches.length * 300 + 1000);
      });
    }
  }, 30000);

  // 通常個体 5匹
  for (let i = 0; i < 5; i++) {
    setTimeout(() => spawnRoach('normal'), i * 400);
  }
  // マウスから逃げる個体 3匹
  for (let i = 0; i < 3; i++) {
    setTimeout(() => spawnRoach('shy'), 2000 + i * 500);
  }
  // 大きい個体 2匹
  for (let i = 0; i < 2; i++) {
    setTimeout(() => spawnRoach('big'), 3500 + i * 600);
  }
  // 巨大個体 2匹
  for (let i = 0; i < 2; i++) {
    setTimeout(() => spawnRoach('huge'), 5000 + i * 800);
  }
  // 高速個体 3匹
  for (let i = 0; i < 3; i++) {
    setTimeout(() => spawnRoach('fast'), 6500 + i * 400);
  }
}

function roachCleared() {
  roachCount--;
  if (roachCount <= 0) {
    const blocker = document.getElementById('roachBlocker');
    if (blocker) blocker.remove();
    adminFailCount = 0;
  }
}

let mouseX = -1000, mouseY = -1000;
document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
document.addEventListener('touchmove', e => {
  const t = e.touches[0];
  if (t) { mouseX = t.clientX; mouseY = t.clientY; }
});

function spawnRoach(type) {
  type = type || 'normal';
  const r = document.createElement('div');
  r.textContent = '🪳';

  let size, baseSpeed, burstSpeed, shyness;
  switch (type) {
    case 'big':
      size = 50 + Math.random() * 15;
      baseSpeed = 2 + Math.random() * 1.5;
      burstSpeed = 5 + Math.random() * 3;
      shyness = 0;
      break;
    case 'huge':
      size = 70 + Math.random() * 20;
      baseSpeed = 1.5 + Math.random() * 1;
      burstSpeed = 3 + Math.random() * 2;
      shyness = 0;
      break;
    case 'fast':
      size = 24 + Math.random() * 10;
      baseSpeed = 5 + Math.random() * 3;
      burstSpeed = 10 + Math.random() * 5;
      shyness = 0;
      break;
    case 'shy':
      size = 30 + Math.random() * 12;
      baseSpeed = 3 + Math.random() * 2;
      burstSpeed = 9 + Math.random() * 4;
      shyness = 150; // 反応距離(px)
      break;
    default:
      size = 28 + Math.random() * 20;
      baseSpeed = 3 + Math.random() * 2;
      burstSpeed = 7 + Math.random() * 5;
      shyness = 0;
  }

  let x = Math.random() * (window.innerWidth - 60);
  let y = Math.random() * (window.innerHeight - 60);
  let angle = Math.random() * 360;
  let speed = 0;
  let targetSpeed = baseSpeed;
  let targetAngle = angle;
  let state = 'run';
  let stateTimer = 30 + Math.random() * 60;
  let wobble = 0;

  r.setAttribute('data-roach', 'true');
  r.setAttribute('data-size', size);
  r.style.cssText = `
    position:fixed; font-size:${size}px; z-index:10000;
    pointer-events:auto; cursor:pointer; user-select:none;
    left:${x}px; top:${y}px;
    transform:rotate(${angle}deg);
    filter:drop-shadow(0 1px 2px rgba(0,0,0,0.3));
    transition:none;
  `;
  document.body.appendChild(r);

  let animId;

  function tick() {
    stateTimer--;

    // マウスから逃げる（shy個体）
    if (shyness > 0) {
      const dx = x - mouseX;
      const dy = y - mouseY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < shyness) {
        // マウスの反対方向に逃げる
        targetAngle = Math.atan2(dy, dx) * 180 / Math.PI;
        targetSpeed = burstSpeed;
        state = 'burst';
        stateTimer = 20;
      }
    }

    // 状態遷移
    if (stateTimer <= 0) {
      const roll = Math.random();
      if (roll < 0.12) {
        state = 'pause';
        stateTimer = 15 + Math.random() * 35;
        targetSpeed = 0;
      } else if (roll < 0.30) {
        state = 'burst';
        stateTimer = 15 + Math.random() * 25;
        targetAngle += (Math.random() - 0.5) * 140;
        targetSpeed = burstSpeed;
      } else if (roll < 0.50) {
        state = 'wander';
        stateTimer = 40 + Math.random() * 80;
        targetSpeed = baseSpeed * 0.4;
      } else {
        state = 'run';
        stateTimer = 30 + Math.random() * 60;
        targetAngle += (Math.random() - 0.5) * 80;
        targetSpeed = baseSpeed;
      }
    }

    if (state === 'wander') {
      targetAngle += (Math.random() - 0.5) * 8;
    } else if (state === 'run') {
      targetAngle += (Math.random() - 0.5) * 4;
    } else if (state === 'burst') {
      targetAngle += (Math.random() - 0.5) * 6;
    }

    speed += (targetSpeed - speed) * 0.1;

    let diff = targetAngle - angle;
    while (diff > 180) diff -= 360;
    while (diff < -180) diff += 360;
    angle += diff * 0.12;

    wobble = Math.sin(Date.now() * 0.03) * (speed > 1 ? 2 : 0);

    const rad = angle * Math.PI / 180;
    x += Math.cos(rad) * speed;
    y += Math.sin(rad) * speed;

    if (x < 5 || x > window.innerWidth - 45) {
      targetAngle = 180 - targetAngle + (Math.random() - 0.5) * 40;
      x = Math.max(5, Math.min(window.innerWidth - 45, x));
      state = 'burst'; stateTimer = 15; targetSpeed = burstSpeed;
    }
    if (y < 5 || y > window.innerHeight - 45) {
      targetAngle = -targetAngle + (Math.random() - 0.5) * 40;
      y = Math.max(5, Math.min(window.innerHeight - 45, y));
      state = 'burst'; stateTimer = 15; targetSpeed = burstSpeed;
    }

    const breathe = 1 + Math.sin(Date.now() * 0.005) * 0.03;

    r.style.left = x + 'px';
    r.style.top = y + 'px';
    r.style.transform = `rotate(${angle + 90 + wobble}deg) scale(${breathe})`;

    animId = requestAnimationFrame(tick);
  }

  animId = requestAnimationFrame(tick);
  r.dataset.animid = animId;

  r.addEventListener('click', () => {
    cancelAnimationFrame(animId);
    r.style.pointerEvents = 'none';
    r.textContent = '💀';
    r.style.transform = `rotate(${angle}deg) scale(1.2)`;
    r.style.filter = 'none';
    r.style.opacity = '0.6';
    setTimeout(() => {
      r.remove();
      incrementRoachCount();
      roachCleared();
      // 全滅したらスプレーボタンも消す
      if (roachCount <= 0) {
        const sb = document.getElementById('sprayBtn');
        const ss = document.getElementById('sprayStyle');
        if (sb) sb.remove();
        if (ss) ss.remove();
      }
    }, 600);
  });
}

function closeAdminModal() {
  document.getElementById('adminOverlay').classList.remove('active');
}

document.getElementById('adminPwInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitAdminPw();
});

// SW登録
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}

async function clearCacheAndReload() {
  if ('caches' in window) {
    const keys = await caches.keys();
    await Promise.all(keys.map(k => caches.delete(k)));
  }
  if ('serviceWorker' in navigator) {
    const regs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map(r => r.unregister()));
  }
  location.reload(true);
}

// --- ぷよ畑 ---
let gardenInitialized = false;
let puyoSprouts = [];
let puyoCount = 0;

// 植木鉢ボタン: クリック=5個追加、長押し=全部引き抜く
(function setupGardenBtn() {
  const btn = document.getElementById('gardenBtn');
  let pressTimer = null;
  let isLongPress = false;

  btn.addEventListener('mousedown', startPress);
  btn.addEventListener('touchstart', e => { e.preventDefault(); startPress(); });
  btn.addEventListener('mouseup', endPress);
  btn.addEventListener('touchend', endPress);
  btn.addEventListener('mouseleave', cancelPress);

  function startPress() {
    isLongPress = false;
    pressTimer = setTimeout(() => {
      isLongPress = true;
      pullAllPuyo();
    }, 600);
  }
  function endPress() {
    clearTimeout(pressTimer);
    if (!isLongPress) addPuyoBatch();
  }
  function cancelPress() {
    clearTimeout(pressTimer);
  }
})();

function addPuyoBatch() {
  const garden = document.getElementById('puyoGarden');
  garden.style.display = 'block';

  if (!gardenInitialized) {
    gardenInitialized = true;
  }

  // 5個追加
  for (let i = 0; i < 5; i++) {
    setTimeout(() => spawnSprout(), i * 150);
  }
}

function spawnSprout() {
  const garden = document.getElementById('puyoGarden');
  const src = PUYO_IMAGES[Math.floor(Math.random() * PUYO_IMAGES.length)];
  const x = Math.random() * (window.innerWidth - 50) + 5;

  const sprout = document.createElement('div');
  sprout.className = 'puyo-sprout';
  sprout.style.left = x + 'px';
  sprout.dataset.img = src;

  const leaf = document.createElement('div');
  leaf.className = 'sprout-leaf';
  leaf.textContent = '🌱';

  sprout.appendChild(leaf);
  garden.appendChild(sprout);

  puyoSprouts.push(sprout);
  puyoCount++;

  // にょきっと生える演出
  sprout.style.opacity = '0';
  sprout.style.transform = 'translateY(20px)';
  setTimeout(() => {
    sprout.style.transition = 'opacity 0.4s, transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
    sprout.style.opacity = '1';
    sprout.style.transform = 'translateY(0)';
  }, 50);

  sprout.addEventListener('click', () => pullSinglePuyo(sprout, src));
}

function pullSinglePuyo(sprout, imgSrc) {
  if (sprout.dataset.pulled) return;
  sprout.dataset.pulled = 'true';
  doPullAnimation(sprout, imgSrc);
  incrementPuyoCount(imgSrc);
  puyoCount--;
  checkGardenClear();
}

function pullAllPuyo() {
  const alive = puyoSprouts.filter(s => !s.dataset.pulled);
  alive.forEach((sprout, i) => {
    setTimeout(() => {
      if (sprout.dataset.pulled) return;
      sprout.dataset.pulled = 'true';
      const imgSrc = sprout.dataset.img || '';
      doPullAnimation(sprout, imgSrc);
      incrementPuyoCount(imgSrc);
      puyoCount--;
      checkGardenClear();
    }, i * 120);
  });
}

function doPullAnimation(sprout, imgSrc) {
  const rect = sprout.getBoundingClientRect();

  sprout.classList.add('pulled');

  for (let i = 0; i < 3; i++) {
    const poof = document.createElement('div');
    poof.className = 'dirt-poof';
    poof.textContent = '\u{1F4A8}';
    poof.style.left = (rect.left + Math.random() * 30 - 10) + 'px';
    poof.style.top = (rect.bottom - 20) + 'px';
    poof.style.position = 'fixed';
    poof.style.zIndex = '201';
    document.body.appendChild(poof);
    setTimeout(() => poof.remove(), 600);
  }

  setTimeout(() => {
    const fly = document.createElement('div');
    fly.className = 'puyo-fly';
    const flyImg = document.createElement('img');
    flyImg.src = imgSrc;
    fly.appendChild(flyImg);

    const startX = rect.left;
    const landY = window.innerHeight - 85;
    fly.style.left = startX + 'px';
    fly.style.top = landY + 'px';
    document.body.appendChild(fly);

    flyImg.style.animation = 'puyoJump 0.6s ease-out';

    setTimeout(() => {
      const goLeft = startX > window.innerWidth / 2;
      const targetX = goLeft ? -80 : window.innerWidth + 20;
      const distance = Math.abs(targetX - startX);
      const duration = distance / 80;

      flyImg.style.animation = 'puyoWalk 0.3s ease-in-out infinite';
      fly.style.transition = 'left ' + duration + 's linear, opacity 0.3s';
      fly.style.left = targetX + 'px';

      setTimeout(() => {
        fly.style.opacity = '0';
        setTimeout(() => fly.remove(), 300);
      }, duration * 1000 - 300);
    }, 650);
  }, 150);

  setTimeout(() => sprout.remove(), 800);
}

function checkGardenClear() {
  if (puyoCount <= 0) {
    puyoCount = 0;
    puyoSprouts = [];
  }
}

const PUYO_IMAGES = [
  'images/puyo_1.avif',
  'images/puyo_2.avif',
  'images/puyo_3.avif',
  'images/puyo_4.avif',
  'images/puyo_5.avif'
];

// ぷよカウント
async function incrementPuyoCount(imgSrc) {
  const match = imgSrc.match(/puyo_(\d)/);
  if (!match) return;
  const puyoId = parseInt(match[1]);
  const puyoName = 'puyo_' + puyoId;
  const { data } = await client.from('puyo_counts').select('count').eq('id', puyoId).single();
  if (data) {
    await client.from('puyo_counts').update({ count: data.count + 1 }).eq('id', puyoId);
  }
  await client.from('activity_log').insert({ type: 'puyo', name: puyoName });
}

async function incrementRoachCount() {
  const { data } = await client.from('roach_counts').select('count').eq('id', 1).single();
  if (data) {
    await client.from('roach_counts').update({ count: data.count + 1 }).eq('id', 1);
  }
  await client.from('activity_log').insert({ type: 'roach', name: 'roach' });
}

async function loadPuyoCounts() {
  const { data: puyoData } = await client.from('puyo_counts').select('*').order('id');
  const { data: roachData } = await client.from('roach_counts').select('count').eq('id', 1).single();
  const container = document.getElementById('puyoStats');
  if (!container) return;
  let html = '';
  if (puyoData) {
    html += puyoData.map(p =>
      `<span style="margin:0 3px;"><img src="images/${p.name}.avif" style="width:16px;height:16px;border-radius:50%;vertical-align:middle;object-fit:cover;">${p.count}</span>`
    ).join('');
  }
  if (roachData) {
    html += `<span style="margin-left:6px;">\u{1FAB3}${roachData.count}</span>`;
  }
  container.innerHTML = html;
}

load();
loadPuyoCounts();
</script>
