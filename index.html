<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="apple-mobile-web-app-capable" content="yes">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
h1 { text-align: center; margin-bottom: 24px; color: #333; }
.children-list { max-width: 480px; margin: 0 auto; width: 100%; }
.child-row-wrap {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 12px;
}
.child-card {
  display: flex; justify-content: space-between; align-items: center;
  background: #fff; border-radius: 12px; padding: 20px 24px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
  text-decoration: none; color: inherit; gap: 10px; flex: 1;
}
.child-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
.child-name { font-size: 1.3em; font-weight: 600; flex: 1; }
.child-balance { font-size: 1.3em; font-weight: 700; color: #4caf50; }
.child-balance.negative { color: #e53935; }
.notify-bell {
  font-size: 1.6em; cursor: pointer; line-height: 1;
  filter: drop-shadow(0 1px 3px rgba(255,152,0,0.4));
}
.notify-bell.ringing {
  animation: bellRing 0.6s ease-in-out;
}
.pending-badge {
  font-size: 1.4em; cursor: pointer; line-height: 1;
  filter: drop-shadow(0 1px 3px rgba(76,175,80,0.4));
}
.sort-item {
  display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  background: #f9f9f9; border-radius: 8px; margin-bottom: 6px;
}
.sort-item .sort-name { flex: 1; font-weight: 600; font-size: 0.95em; }
.sort-btn {
  width: 32px; height: 32px; border: none; border-radius: 6px;
  background: #e0e0e0; font-size: 1em; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.sort-btn:hover { background: #bbb; }
.sort-btn:active { background: #999; }
.acc-arrow-s { display: inline-block; transition: transform 0.2s; font-size: 0.8em; }
.acc-arrow-s.open { transform: rotate(90deg); }
@keyframes pendingPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.15); }
}
@keyframes bellRing {
  0% { transform: rotate(0deg); }
  15% { transform: rotate(18deg); }
  30% { transform: rotate(-16deg); }
  45% { transform: rotate(12deg); }
  60% { transform: rotate(-10deg); }
  75% { transform: rotate(6deg); }
  90% { transform: rotate(-3deg); }
  100% { transform: rotate(0deg); }
}
.loading { text-align: center; color: #999; margin-top: 40px; }

/* モーダル */
.overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.4); z-index: 100; justify-content: center; align-items: center;
}
.overlay.active { display: flex; }
.modal {
  background: #fff; border-radius: 16px; padding: 28px 24px;
  width: 90%; max-width: 360px; box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  text-align: center;
}
.modal h2 { margin-bottom: 16px; font-size: 1.2em; color: #333; }
.modal input {
  width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;
  font-size: 1em; margin-bottom: 12px; text-align: center;
}
.modal .error-msg { color: #e53935; font-size: 0.9em; margin-bottom: 10px; display: none; }
.modal-btns { display: flex; gap: 8px; }
.modal-btns button {
  flex: 1; padding: 12px; border: none; border-radius: 8px;
  font-size: 1em; font-weight: 600; cursor: pointer;
}
.btn-ok { background: #4caf50; color: #fff; }
.btn-cancel { background: #eee; color: #333; }
.btn-ok:hover, .btn-cancel:hover { opacity: 0.9; }

@media (max-width: 520px) {
  body { padding: 12px; }
  h1 { font-size: 1.4em; }
  .child-card { padding: 16px 18px; }
  .child-name, .child-balance { font-size: 1.1em; }
}

/* 承認UI（TOP画面admin用） */
.approval-section {
  max-width: 480px; margin: -4px auto 12px; padding: 0 8px;
}
.approval-item {
  display: flex; align-items: center; justify-content: space-between;
  background: #fff8e1; border-radius: 8px; padding: 8px 12px;
  margin-bottom: 4px; border: 1px solid #ffe082;
}
.approval-info { display: flex; flex-direction: column; gap: 2px; }
.approval-chore { font-size: 0.85em; font-weight: 600; color: #555; }
.approval-date { font-size: 0.75em; color: #aaa; }
.approval-btns { display: flex; gap: 6px; }
.approval-btn {
  padding: 4px 10px; border: none; border-radius: 6px;
  font-size: 0.8em; font-weight: 600; cursor: pointer; color: #fff;
}
.approval-btn.approve { background: #4caf50; }
.approval-btn.reject { background: #e53935; }
.approval-btn:hover { opacity: 0.85; }

/* ぷよ畑（garden.jsと連動） */
.puyo-garden {
  position: fixed; bottom: 0; left: 0; width: 100%; height: 90px;
  z-index: 50; pointer-events: none;
}
.garden-ground {
  position: absolute; bottom: 0; left: 0; width: 100%; height: 35px;
  background: linear-gradient(to bottom, #8B6914, #6B4F12, #5a4210);
  border-top: 3px solid #9acd32;
}
.garden-grass {
  position: absolute; bottom: 33px; left: 0; width: 100%; height: 8px;
  background: repeating-linear-gradient(90deg, transparent, transparent 8px, #6a9f30 8px, #6a9f30 10px);
  opacity: 0.6;
}
.puyo-sprout {
  position: absolute; bottom: 20px; cursor: pointer; pointer-events: auto;
  transition: transform 0.15s;
  display: flex; flex-direction: column; align-items: center;
}
.puyo-sprout:hover { transform: translateY(-3px); }
.puyo-sprout .sprout-leaf {
  font-size: 22px; line-height: 1;
  filter: drop-shadow(0 1px 2px rgba(0,0,0,0.2));
}
.puyo-sprout.pulled .sprout-leaf {
  transition: transform 0.3s, opacity 0.3s;
  transform: scale(0.3);
  opacity: 0;
}
.puyo-sprout.pulled {
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  transform: translateY(-120px) scale(1.2);
  opacity: 0;
}
.dirt-poof {
  position: absolute; pointer-events: none; font-size: 20px;
  animation: poofUp 0.6s ease-out forwards;
}
@keyframes poofUp {
  0% { opacity: 1; transform: translateY(0) scale(0.5); }
  100% { opacity: 0; transform: translateY(-30px) scale(1.5); }
}
.puyo-fly {
  position: fixed; pointer-events: none; z-index: 200;
  filter: drop-shadow(0 4px 12px rgba(0,0,0,0.3));
}
.puyo-fly img {
  width: 65px; height: 65px; border-radius: 50%; object-fit: cover;
}
@keyframes puyoJump {
  0% { transform: translateY(0) scale(1); }
  40% { transform: translateY(-80px) scale(1.15); }
  60% { transform: translateY(-80px) scale(1.15); }
  85% { transform: translateY(0) scale(0.95); }
  100% { transform: translateY(0) scale(1); }
}
@keyframes puyoWalk {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-4px) rotate(-8deg); }
  75% { transform: translateY(-4px) rotate(8deg); }
}
@keyframes puyoFly {
  0%, 100% { transform: translateY(0) rotate(-5deg); }
  50% { transform: translateY(-8px) rotate(5deg); }
}
@keyframes puyoGhost {
  0%, 100% { transform: translateY(0) scale(1); opacity: 0.85; }
  50% { transform: translateY(-12px) scale(1.05); opacity: 0.6; }
}
</style>
</head>

<script>
let allChildren = [];
let pendingChildId = null;
let adminFailCount = 0;
let childPwFailCount = 0;
let allowancePassword = null;
let adminPassword = null;

// --- 設定モーダル内アコーディオン ---
function toggleSettingAcc(bodyId, headerEl) {
  const body = document.getElementById(bodyId);
  const arrow = headerEl.querySelector('.acc-arrow-s');
  if (body.style.display === 'none') {
    body.style.display = 'block';
    if (arrow) arrow.classList.add('open');
  } else {
    body.style.display = 'none';
    if (arrow) arrow.classList.remove('open');
  }
}

// --- 表示順変更モーダル ---
let sortItems = [];

function openSortModal() {
  sortItems = allChildren.slice().sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
  renderSortList();
  document.getElementById('sortOverlay').classList.add('active');
}

function closeSortModal() {
  document.getElementById('sortOverlay').classList.remove('active');
}

document.getElementById('sortOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeSortModal();
});

function renderSortList() {
  const list = document.getElementById('sortList');
  list.innerHTML = '';
  sortItems.forEach((c, idx) => {
    const item = document.createElement('div');
    item.className = 'sort-item';
    item.innerHTML = '<span class="sort-name">' + c.name + '</span>'
      + '<button class="sort-btn" onclick="moveSortItem(' + idx + ',-1)"' + (idx === 0 ? ' disabled style="opacity:0.3"' : '') + '>&#x25B2;</button>'
      + '<button class="sort-btn" onclick="moveSortItem(' + idx + ',1)"' + (idx === sortItems.length - 1 ? ' disabled style="opacity:0.3"' : '') + '>&#x25BC;</button>';
    list.appendChild(item);
  });
}

function moveSortItem(idx, dir) {
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= sortItems.length) return;
  const tmp = sortItems[idx];
  sortItems[idx] = sortItems[newIdx];
  sortItems[newIdx] = tmp;
  renderSortList();
}

async function saveSortOrder() {
  for (let i = 0; i < sortItems.length; i++) {
    await client.from('children').update({ sort_order: i }).eq('id', sortItems[i].id);
  }
  closeSortModal();
  load(); // 一覧を再読み込み
}

// --- パスワード読み込み（Supabase） ---
async function loadPasswords() {
  try {
    const { data } = await client.from('game_settings').select('allowance_password, admin_password').eq('id', 1).maybeSingle();
    allowancePassword = (data && data.allowance_password) || null;
    adminPassword = (data && data.admin_password) || null;
  } catch(e) {}
}

function goAllowance() {
  if (!allowancePassword || localStorage.getItem('deviceRole') === 'admin') {
    window.location.href = 'pages/allowance.html';
    return;
  }
  document.getElementById('allowanceError').style.display = 'none';
  document.getElementById('allowancePwInput').value = '';
  document.getElementById('allowanceOverlay').classList.add('active');
  setTimeout(() => document.getElementById('allowancePwInput').focus(), 100);
}

function submitAllowancePw() {
  const input = document.getElementById('allowancePwInput').value;
  if (input === allowancePassword) {
    closeAllowanceModal();
    window.location.href = 'pages/allowance.html';
  } else {
    document.getElementById('allowanceError').style.display = 'block';
    document.getElementById('allowancePwInput').value = '';
    document.getElementById('allowancePwInput').focus();
  }
}

function closeAllowanceModal() {
  document.getElementById('allowanceOverlay').classList.remove('active');
}

// Enterキー対応
document.getElementById('allowancePwInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitAllowancePw();
});
document.getElementById('allowanceOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeAllowanceModal();
});

// --- ベル揺れ演出 ---
function ringBell(e, el) {
  e.stopPropagation(); // カードのクリックを防止
  el.classList.remove('ringing');
  void el.offsetWidth; // reflow
  el.classList.add('ringing');
}

// --- アカウント一覧読み込み ---
async function load() {
  const { data, error } = await client.from('children').select('*').order('sort_order', { ascending: true });
  const container = document.getElementById('children');

  if (error || !data) {
    container.innerHTML = '<div class="loading">データの取得に失敗しました</div>';
    return;
  }

  allChildren = data;
  container.innerHTML = '';

  // 承認待ちポイントをチェック
  let pendingByChild = {};
  let pendingDetailsByChild = {};
  try {
    const { data: pendingData } = await client.from('chore_points').select('id, child_id, chore_name, points, created_at').eq('status', 'pending').order('created_at', { ascending: true });
    (pendingData || []).forEach(p => {
      pendingByChild[p.child_id] = (pendingByChild[p.child_id] || 0) + p.points;
      if (!pendingDetailsByChild[p.child_id]) pendingDetailsByChild[p.child_id] = [];
      pendingDetailsByChild[p.child_id].push(p);
    });
  } catch(e) {}

  // ポイント情報を取得
  let pointsByChild = {};
  try {
    const { data: ptsData } = await client.from('chore_points').select('child_id, points').eq('status', 'approved');
    (ptsData || []).forEach(p => {
      pointsByChild[p.child_id] = (pointsByChild[p.child_id] || 0) + p.points;
    });
  } catch(e) {}

  // 未読入金演出データを取得（Supabase）
  let depositEffectsByChild = {};
  try {
    const { data: depEffects } = await client.from('pending_effects').select('child_id, data').eq('type', 'deposit');
    (depEffects || []).forEach(e => { depositEffectsByChild[e.child_id] = e.data; });
  } catch(e) {}

  // チケット残数を取得
  let ticketCountByOwner = {};
  try {
    const { data: tktData } = await client.from('tickets').select('owner').eq('status', 'unused');
    (tktData || []).forEach(t => { ticketCountByOwner[t.owner] = (ticketCountByOwner[t.owner] || 0) + 1; });
  } catch(e) {}

  // チケット予約待ち（pending）を取得
  let ticketPendingByOwner = {};
  let ticketApprovedAll = [];
  try {
    const { data: tktPending } = await client.from('tickets').select('*').eq('status', 'pending').order('reserved_at', { ascending: true });
    (tktPending || []).forEach(t => {
      if (!ticketPendingByOwner[t.owner]) ticketPendingByOwner[t.owner] = [];
      ticketPendingByOwner[t.owner].push(t);
    });
    const { data: tktApproved } = await client.from('tickets').select('*').in('status', ['approved']).order('reserved_at', { ascending: true });
    ticketApprovedAll = tktApproved || [];
  } catch(e) {}

  data.forEach(c => {
    const isNeg = c.balance < 0 ? ' negative' : '';
    const hasPassword = c.require_password && c.password;
    const bypassed = localStorage.getItem('deviceRole') === 'admin';
    const showBalance = (!hasPassword || bypassed) && c.show_balance_on_top !== false;

    // 未読入金チェック（Supabase pending_effects）— admin端末では非表示
    const depEffect = depositEffectsByChild[c.id];
    let displayBalance = c.balance;
    let bellHtml = '';
    if (depEffect && showBalance && !bypassed) {
      displayBalance = depEffect.oldBalance;
      bellHtml = '<span class="notify-bell" onclick="ringBell(event, this)">&#x1F514;</span>';
    }

    const displayNeg = displayBalance < 0 ? ' negative' : '';
    const balanceText = showBalance ? `${displayBalance.toLocaleString()}円` : '****円';
    const lock = (hasPassword && !bypassed) ? ' 🔒' : '';
    const pendingBadge = pendingByChild[c.id] ? '<span class="pending-badge" onclick="event.stopPropagation();location.reload();" title="承認待ち ' + pendingByChild[c.id] + 'pt">&#x2705;</span>' : '';

    // ポイント情報（返済用アカウントは除外）
    let ptsHtml = '';
    let starsHtml = '';
    let ticketHtml = '';
    if (!c.name.endsWith('が返すお金')) {
      const totalPts = pointsByChild[c.id] || 0;
      const sheetNum = totalPts > 0 ? Math.floor((totalPts - 1) / 400) + 1 : 1;
      const currentSheetPts = totalPts > 0 ? ((totalPts - 1) % 400) + 1 : 0;
      const displayPts = totalPts === 0 ? 0 : (totalPts % 400 === 0 ? 400 : totalPts % 400);
      let nextInfo = '';
      for (let m = 20; m <= 400; m += 20) {
        if (displayPts < m) {
          const amt = getAllowanceForMilestone(m);
          nextInfo = 'あと' + (m - displayPts) + 'ptで' + amt + '円';
          break;
        }
      }
      if (displayPts >= 400) nextInfo = '🎉コンプリート！';
      const sheetLabel = sheetNum > 1 ? '(' + sheetNum + '枚目)' : '';
      ptsHtml = '<div style="font-size:0.7em;color:#888;margin-top:2px;">⭐' + displayPts + '/400' + sheetLabel + ' ' + nextInfo + '</div>';

      // 完了枚数に応じたアイコン表示（ぷよ5つでオリマー1つに変換）
      const completedSheets = totalPts > 0 ? Math.floor(totalPts / 400) : 0;
      if (completedSheets > 0) {
        const olimars = Math.floor(completedSheets / 5);
        const puyoCount = completedSheets % 5;
        let icons = '';
        for (let i = 0; i < olimars; i++) {
          icons += '<img src="images/olimar.png" style="width:34px;height:34px;vertical-align:-4px;object-fit:contain;">';
        }
        // ぷよは被らないようにシャッフルして選ぶ
        if (puyoCount > 0) {
          const indices = [1,2,3,4,5];
          for (let i = indices.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [indices[i], indices[j]] = [indices[j], indices[i]]; }
          for (let i = 0; i < puyoCount; i++) {
            icons += '<img src="images/puyo_' + indices[i] + '.avif" style="width:30px;height:30px;border-radius:50%;object-fit:cover;vertical-align:-4px;">';
          }
        }
        starsHtml = ' <span style="font-size:0.7em;">' + icons + '</span>';
      }

      // チケット残数 + 予約待ち表示
      const tktCount = ticketCountByOwner[c.name] || 0;
      const tktPendingCount = (ticketPendingByOwner[c.name] || []).length;
      if (tktCount > 0 || tktPendingCount > 0) {
        let tktParts = [];
        if (tktCount > 0) tktParts.push('🎫×' + tktCount);
        if (tktPendingCount > 0) tktParts.push('⏳' + tktPendingCount + '件');
        ticketHtml = '<div style="font-size:0.7em;color:#888;margin-top:2px;">' + tktParts.join(' ') + '</div>';
      }
    }

    container.innerHTML += `
      <div class="child-row-wrap" data-id="${c.id}">
        ${bellHtml}${pendingBadge}
        <div class="child-card">
          <div style="flex:1;">
            <span class="child-name">${c.name}${starsHtml}${lock}</span>
            ${ptsHtml}
            ${ticketHtml}
          </div>
          <span class="child-balance${displayNeg}">${balanceText}</span>
        </div>
      </div>
    `;

    // admin用: 承認待ちUIをカードの下に表示
    if (localStorage.getItem('deviceRole') === 'admin' && pendingDetailsByChild[c.id]) {
      let approvalHtml = '<div class="approval-section" data-child-id="' + c.id + '">';
      pendingDetailsByChild[c.id].forEach(p => {
        const d = new Date(p.created_at);
        const dateStr = (d.getMonth()+1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2,'0');
        approvalHtml += '<div class="approval-item" id="approval-' + p.id + '">'
          + '<div class="approval-info"><span class="approval-chore">' + p.chore_name + ' ' + p.points + 'pt</span><span class="approval-date">' + dateStr + '</span></div>'
          + '<div class="approval-btns">'
          + '<button class="approval-btn approve" onclick="approveFromTop(\'' + p.id + '\',\'' + c.id + '\')">承認</button>'
          + '<button class="approval-btn reject" onclick="rejectFromTop(\'' + p.id + '\',\'' + c.id + '\')">却下</button>'
          + '</div></div>';
      });
      approvalHtml += '</div>';
      container.innerHTML += approvalHtml;
    }

    // admin用: チケット予約承認UI
    if (localStorage.getItem('deviceRole') === 'admin' && ticketPendingByOwner[c.name]) {
      let tktHtml = '<div class="approval-section" data-child-ticket="' + c.name + '">';
      ticketPendingByOwner[c.name].forEach(t => {
        const rd = new Date(t.reserved_at);
        const rdStr = (rd.getMonth()+1) + '/' + rd.getDate() + ' ' + rd.getHours() + ':' + String(rd.getMinutes()).padStart(2,'0');
        tktHtml += '<div class="approval-item" id="tkt-approval-' + t.id + '">'
          + '<div class="approval-info"><span class="approval-chore">🎫 No.' + t.ticket_no + ' ' + t.duration_minutes + '分</span><span class="approval-date">' + rdStr + '〜</span></div>'
          + '<div class="approval-btns">'
          + '<button class="approval-btn approve" onclick="approveTicketFromTop(\'' + t.id + '\')">承認</button>'
          + '<button class="approval-btn reject" onclick="rejectTicketFromTop(\'' + t.id + '\')">却下</button>'
          + '</div></div>';
      });
      tktHtml += '</div>';
      container.innerHTML += tktHtml;
    }

    // 全ユーザー: 承認済み予約チケット表示
    const myApproved = ticketApprovedAll.filter(t => t.owner === c.name);
    if (myApproved.length > 0) {
      let resHtml = '<div style="max-width:480px;margin:-4px auto 12px;padding:0 8px;">';
      myApproved.forEach(t => {
        const rd = new Date(t.reserved_at);
        const rdStr = (rd.getMonth()+1) + '/' + rd.getDate() + ' ' + rd.getHours() + ':' + String(rd.getMinutes()).padStart(2,'0');
        resHtml += '<div style="background:#e8f5e9;border-radius:8px;padding:8px 12px;margin-bottom:4px;font-size:0.85em;color:#2e7d32;">🎫 ' + rdStr + '〜 あそびチケット（' + t.duration_minutes + '分）</div>';
      });
      resHtml += '</div>';
      container.innerHTML += resHtml;
    }
  });

  // カードにクリックイベントを設定
  container.querySelectorAll('.child-row-wrap').forEach(wrap => {
    const card = wrap.querySelector('.child-card');
    card.addEventListener('click', () => goToChild(wrap.dataset.id));
  });
}

function goToChild(id) {
  const child = allChildren.find(c => String(c.id) === String(id));
  if (!child) return;

  if (child.require_password && child.password && localStorage.getItem('deviceRole') !== 'admin') {

    document.getElementById('pwTitle').textContent = `🔒 ${child.name} のパスワード`;

    setTimeout(() => document.getElementById('pwInput').focus(), 100);

  }
}

function submitPassword() {
  const child = allChildren.find(c => String(c.id) === String(pendingChildId));

// --- Service Worker（PWA更新チェック付き） ---
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').then(reg => {
    // 起動時に即座に更新チェック
    reg.update();
    // 新しいSWが待機中なら即アクティベート→リロード
    if (reg.waiting) { reg.waiting.postMessage({type:'SKIP_WAITING'}); }
    reg.addEventListener('updatefound', () => {
      const newSW = reg.installing;
      newSW.addEventListener('statechange', () => {
        if (newSW.state === 'activated') {
          location.reload();
        }
      });
    });
  });
  // controllerchangeでリロード（SW切り替わり時）
  let refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!refreshing) { refreshing = true; location.reload(); }
  });
}

// --- キャッシュクリア（将来のUI復活用に残す） ---
async function clearCacheAndReload() {
  if ('caches' in window) {
    const keys = await caches.keys();
    await Promise.all(keys.map(k => caches.delete(k)));
  }
  if ('serviceWorker' in navigator) {
    const regs = await navigator.serviceWorker.getRegistrations();
    await Promise.all(regs.map(r => r.unregister()));
  }
  location.reload(true);
}

// --- ぷよ・ゴキブリカウント（端末ごと: localStorage + DB合計も更新） ---
function incrementPuyoCount(imgSrc) {
  const match = imgSrc.match(/puyo_(\d)/);
  if (!match) return;
  const puyoId = parseInt(match[1]);
  // ローカルカウント
  const key = 'puyo_local_count_' + puyoId;
  const current = parseInt(localStorage.getItem(key) || '0');
  localStorage.setItem(key, String(current + 1));
  const el = document.getElementById('cnt_' + puyoId);
  if (el) el.textContent = current + 1;
  // DB合計も更新（非同期、エラー無視）
  const puyoName = 'puyo_' + puyoId;
  client.from('puyo_counts').select('count').eq('id', puyoId).maybeSingle().then(({ data }) => {
    if (data) {
      client.from('puyo_counts').update({ count: data.count + 1 }).eq('id', puyoId);
    } else {
      client.from('puyo_counts').upsert({ id: puyoId, name: puyoName, count: 1 });
    }
  }).catch(() => {});
}

function incrementRoachCount() {
  // ローカルカウント
  const current = parseInt(localStorage.getItem('roach_local_count') || '0');
  localStorage.setItem('roach_local_count', String(current + 1));
  // DB合計も更新
  client.from('roach_counts').select('count').eq('id', 1).maybeSingle().then(({ data }) => {
    if (data) {
      client.from('roach_counts').update({ count: data.count + 1 }).eq('id', 1);
    } else {
      client.from('roach_counts').upsert({ id: 1, count: 1 });

  }).catch(() => {});
}

// --- TOP画面からの承認/却下（admin用） ---
async function approveFromTop(pointId, childId) {
  const { data: pt } = await client.from('chore_points').select('child_id, points, chore_name').eq('id', pointId).single();
  if (!pt) return;
  await client.from('chore_points').update({ status: 'approved' }).eq('id', pointId);

  // ポイント演出データをSupabaseに保存（別端末でも演出可能）
  const { data: existing } = await client.from('pending_effects')
    .select('id, data').eq('child_id', pt.child_id).eq('type', 'points');
  if (existing && existing.length > 0) {
    const row = existing[0];
    const updated = { addedPoints: row.data.addedPoints + pt.points, chores: row.data.chores.concat([pt.chore_name]) };
    await client.from('pending_effects').update({ data: updated }).eq('id', row.id);
  } else {
    await client.from('pending_effects').insert({ child_id: pt.child_id, type: 'points', data: { addedPoints: pt.points, chores: [pt.chore_name] } });
  }

  // マイルストーンチェック
  const { data: allPts } = await client.from('chore_points').select('points').eq('child_id', pt.child_id).eq('status', 'approved');
  const totalAfter = (allPts || []).reduce((s, r) => s + r.points, 0);
  const totalBefore = totalAfter - pt.points;
  let totalAllowance = 0;
  for (let p = totalBefore + 1; p <= totalAfter; p++) {
    if (p % 20 === 0) {
      const sheetPt = ((p - 1) % 400) + 1;
      if (sheetPt % 20 === 0) {
        totalAllowance += getAllowanceForMilestone(sheetPt);
      }
    }
  }
  if (totalAllowance > 0) {
    const targetChild = allChildren.find(c => c.id === pt.child_id);
    if (targetChild) await giveAllowanceFromTop(targetChild, totalAllowance);
  }

  // UIから削除
  const el = document.getElementById('approval-' + pointId);
  if (el) el.remove();
  // セクションが空なら削除
  const section = document.querySelector('.approval-section[data-child-id="' + childId + '"]');
  if (section && section.children.length === 0) section.remove();

  // Discord通知
  const child = allChildren.find(c => c.id === pt.child_id);
  let content = '✅ **' + (child ? child.name : '') + '** の「' + pt.chore_name + '」' + pt.points + 'pt を承認';
  if (totalAllowance > 0) content += ' 💰 ' + totalAllowance + '円発生！';
  notifyDiscord(content);

  // ページをリロードして表示を更新
  setTimeout(() => location.reload(), 300);
}

async function rejectFromTop(pointId, childId) {
  if (!confirm('却下しますか？')) return;
  await client.from('chore_points').delete().eq('id', pointId);
  const el = document.getElementById('approval-' + pointId);
  if (el) el.remove();
  const section = document.querySelector('.approval-section[data-child-id="' + childId + '"]');
  if (section && section.children.length === 0) section.remove();
  setTimeout(() => location.reload(), 300);
}

// --- チケット予約承認/却下（TOP画面admin用） ---
async function approveTicketFromTop(ticketId) {
  const { data, error } = await client.from('tickets').update({ status: 'approved' }).eq('id', ticketId).eq('status', 'pending').select();
  if (error || !data || data.length === 0) { alert('承認に失敗しました'); return; }
  const t = data[0];
  try { await notifyDiscord('✅ ' + t.owner + 'のチケットNo.' + t.ticket_no + '予約を承認しました'); } catch(e) {}
  const el = document.getElementById('tkt-approval-' + ticketId);
  if (el) el.remove();
  setTimeout(() => location.reload(), 300);
}

async function rejectTicketFromTop(ticketId) {
  if (!confirm('チケット予約を却下しますか？')) return;
  const { data, error } = await client.from('tickets').update({ status: 'unused', reserved_at: null }).eq('id', ticketId).eq('status', 'pending').select();
  if (error || !data || data.length === 0) { alert('却下に失敗しました'); return; }
  const t = data[0];
  try { await notifyDiscord('❌ ' + t.owner + 'のチケットNo.' + t.ticket_no + '予約を却下しました'); } catch(e) {}
  const el = document.getElementById('tkt-approval-' + ticketId);
  if (el) el.remove();
  setTimeout(() => location.reload(), 300);
}

async function giveAllowanceFromTop(targetChild, amount) {
  const repayChild = allChildren.find(c => c.name === targetChild.name + 'が返すお金');
  const hasRepay = !!repayChild;

  if (hasRepay) {
    const half = Math.floor(amount / 2);
    const remainder = amount - half;
    const { data: d1 } = await client.from('children').select('balance').eq('id', targetChild.id).single();
    const oldBal = d1 ? d1.balance : 0;
    const nb1 = oldBal + remainder;
    await client.from('children').update({ balance: nb1 }).eq('id', targetChild.id);
    await client.from('transactions').insert({ child_id: targetChild.id, type: 'add', amount: remainder, memo: 'ポイント表ご褒美' });
    await savePendingDeposit(targetChild.id, oldBal, nb1, remainder);
    const { data: d2 } = await client.from('children').select('balance').eq('id', repayChild.id).single();
    const nb2 = (d2 ? d2.balance : 0) + half;
    await client.from('children').update({ balance: nb2 }).eq('id', repayChild.id);
    await client.from('transactions').insert({ child_id: repayChild.id, type: 'add', amount: half, memo: 'ポイント表ご褒美（' + targetChild.name + '分）' });
  } else {
    const { data: d } = await client.from('children').select('balance').eq('id', targetChild.id).single();
    const oldBal = d ? d.balance : 0;
    const nb = oldBal + amount;
    await client.from('children').update({ balance: nb }).eq('id', targetChild.id);
    await client.from('transactions').insert({ child_id: targetChild.id, type: 'add', amount, memo: 'ポイント表ご褒美' });
    await savePendingDeposit(targetChild.id, oldBal, nb, amount);
  }
}
