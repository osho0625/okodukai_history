<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4caf50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="お小遣い手帳">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="2728.png">
<title>お小遣い手帳 - トップ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
h1 { text-align: center; margin-bottom: 24px; color: #333; }
.children-list { max-width: 480px; margin: 0 auto; width: 100%; }
.child-card {
  display: flex; justify-content: space-between; align-items: center;
  background: #fff; border-radius: 12px; padding: 20px 24px;
  margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
  text-decoration: none; color: inherit;
}
.child-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
.child-name { font-size: 1.3em; font-weight: 600; }
.child-balance { font-size: 1.3em; font-weight: 700; color: #4caf50; }
.child-balance.negative { color: #e53935; }
.loading { text-align: center; color: #999; margin-top: 40px; }

/* モーダル */
.overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.4); z-index: 100; justify-content: center; align-items: center;
}
.overlay.active { display: flex; }
.modal {
  background: #fff; border-radius: 16px; padding: 28px 24px;
  width: 90%; max-width: 360px; box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  text-align: center;
}
.modal h2 { margin-bottom: 16px; font-size: 1.2em; color: #333; }
.modal input {
  width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;
  font-size: 1em; margin-bottom: 12px; text-align: center;
}
.modal .error-msg { color: #e53935; font-size: 0.9em; margin-bottom: 10px; display: none; }
.modal-btns { display: flex; gap: 8px; }
.modal-btns button {
  flex: 1; padding: 12px; border: none; border-radius: 8px;
  font-size: 1em; font-weight: 600; cursor: pointer;
}
.btn-ok { background: #4caf50; color: #fff; }
.btn-cancel { background: #eee; color: #333; }
.btn-ok:hover, .btn-cancel:hover { opacity: 0.9; }

@media (max-width: 520px) {
  body { padding: 12px; }
  h1 { font-size: 1.4em; }
  .child-card { padding: 16px 18px; }
  .child-name, .child-balance { font-size: 1.1em; }
}
</style>
</head>
<body>

<h1>💴 お小遣い手帳 <span style="cursor:pointer; font-size:0.6em; opacity:0.4;" onclick="goAdmin()">🔧</span></h1>

<div class="children-list" id="children">
  <div class="loading">読み込み中...</div>
</div>

<!-- 管理者パスワードモーダル -->
<div class="overlay" id="adminOverlay">
  <div class="modal">
    <h2>🔧 管理者パスワード</h2>
    <div class="error-msg" id="adminError">パスワードが違います</div>
    <input type="password" id="adminPwInput" placeholder="パスワード" autocomplete="off">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeAdminModal()">キャンセル</button>
      <button class="btn-ok" onclick="submitAdminPw()">OK</button>
    </div>
  </div>
</div>

<!-- パスワードモーダル -->
<div class="overlay" id="pwOverlay">
  <div class="modal">
    <h2 id="pwTitle">🔒 パスワードを入力</h2>
    <div class="error-msg" id="pwError">パスワードが違います</div>
    <input type="password" id="pwInput" placeholder="パスワード" autocomplete="off">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
      <button class="btn-ok" onclick="submitPassword()">OK</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://ynecezxnltigplrfzzoh.supabase.co";
const SUPABASE_KEY = "sb_publishable_seKZakec1yB046vlgPDAKQ_zd4CKIg4";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let allChildren = [];
let pendingChildId = null;

async function load() {
  const { data, error } = await client.from('children').select('*').order('sort_order', { ascending: true });
  const container = document.getElementById('children');

  if (error || !data) {
    container.innerHTML = '<div class="loading">データの取得に失敗しました</div>';
    return;
  }

  allChildren = data;
  container.innerHTML = '';

  data.forEach(c => {
    const isNeg = c.balance < 0 ? ' negative' : '';
    const hasPassword = c.require_password && c.password;
    const showBalance = !hasPassword && c.show_balance_on_top !== false;
    const balanceText = showBalance ? `${c.balance.toLocaleString()}円` : '****円';
    const lock = hasPassword ? ' 🔒' : '';
    container.innerHTML += `
      <div class="child-card" data-id="${c.id}">
        <span class="child-name">${c.name}${lock}</span>
        <span class="child-balance${isNeg}">${balanceText}</span>
      </div>
    `;
  });

  // カードにクリックイベントを設定
  container.querySelectorAll('.child-card').forEach(card => {
    card.addEventListener('click', () => goToChild(card.dataset.id));
  });
}

function goToChild(id) {
  const child = allChildren.find(c => String(c.id) === String(id));
  if (!child) return;

  if (child.require_password && child.password) {
    // パスワードが必要 → モーダル表示
    pendingChildId = id;
    document.getElementById('pwTitle').textContent = `🔒 ${child.name} のパスワード`;
    document.getElementById('pwError').style.display = 'none';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwOverlay').classList.add('active');
    setTimeout(() => document.getElementById('pwInput').focus(), 100);
  } else {
    window.location.href = `child.html?id=${id}`;
  }
}

function submitPassword() {
  const child = allChildren.find(c => String(c.id) === String(pendingChildId));
  const input = document.getElementById('pwInput').value;

  if (input === child.password) {
    const targetId = pendingChildId;
    closeModal();
    window.location.href = `child.html?id=${targetId}`;
  } else {
    document.getElementById('pwError').style.display = 'block';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
  }
}

function closeModal() {
  document.getElementById('pwOverlay').classList.remove('active');
  pendingChildId = null;
}

// Enterキーでも送信
document.getElementById('pwInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitPassword();
});

// オーバーレイクリックで閉じる
document.getElementById('pwOverlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

function goAdmin() {
  document.getElementById('adminError').style.display = 'none';
  document.getElementById('adminPwInput').value = '';
  document.getElementById('adminOverlay').classList.add('active');
  setTimeout(() => document.getElementById('adminPwInput').focus(), 100);
}

let adminFailCount = 0;
let roachCount = 0;

function submitAdminPw() {
  const input = document.getElementById('adminPwInput').value;
  if (input === 'mgmlv') {
    adminFailCount = 0;
    document.getElementById('adminOverlay').classList.remove('active');
    window.location.href = 'admin.html';
  } else {
    adminFailCount++;
    document.getElementById('adminError').style.display = 'block';
    document.getElementById('adminPwInput').value = '';
    document.getElementById('adminPwInput').focus();

    if (adminFailCount >= 5) {
      closeAdminModal();
      unleashRoaches();
    }
  }
}

function unleashRoaches() {
  // 透明なブロック用オーバーレイ（操作だけ防ぐ）
  const blocker = document.createElement('div');
  blocker.id = 'roachBlocker';
  blocker.style.cssText = `
    position:fixed; top:0; left:0; width:100%; height:100%;
    background:transparent; z-index:9998;
  `;
  document.body.appendChild(blocker);

  roachCount = 20;
  let allRoachAnimIds = [];

  // 1分後にスプレーボタン表示
  setTimeout(() => {
    if (roachCount > 0) {
      const sprayBtn = document.createElement('div');
      sprayBtn.id = 'sprayBtn';
      sprayBtn.innerHTML = '🧴 スプレー';
      sprayBtn.style.cssText = `
        position:fixed; bottom:30px; left:50%; transform:translateX(-50%);
        background:#e53935; color:#fff; padding:14px 32px;
        border-radius:30px; font-size:1.2em; font-weight:bold;
        z-index:10001; cursor:pointer; box-shadow:0 4px 16px rgba(0,0,0,0.3);
        animation:sprayPulse 1s infinite;
      `;
      document.body.appendChild(sprayBtn);

      // パルスアニメーション
      const style = document.createElement('style');
      style.id = 'sprayStyle';
      style.textContent = `
        @keyframes sprayPulse {
          0%, 100% { transform: translateX(-50%) scale(1); }
          50% { transform: translateX(-50%) scale(1.08); }
        }
        @keyframes sprayMist {
          0% { opacity:0.7; transform:scale(0.5); }
          100% { opacity:0; transform:scale(3); }
        }
      `;
      document.head.appendChild(style);

      sprayBtn.addEventListener('click', () => {
        // スプレーエフェクト
        const mist = document.createElement('div');
        mist.style.cssText = `
          position:fixed; top:0; left:0; width:100%; height:100%;
          background:radial-gradient(circle, rgba(200,230,200,0.6) 0%, transparent 70%);
          z-index:10002; pointer-events:none;
          animation:sprayMist 1.5s ease-out forwards;
        `;
        document.body.appendChild(mist);
        setTimeout(() => mist.remove(), 1500);

        // 全ゴキブリを倒す
        document.querySelectorAll('[data-roach]').forEach(r => {
          const aid = parseInt(r.dataset.animid);
          if (aid) cancelAnimationFrame(aid);
          r.style.pointerEvents = 'none';
          r.textContent = '💀';
          r.style.filter = 'none';
          r.style.opacity = '0.5';
          r.style.transform += ' scale(0.8)';
        });

        setTimeout(() => {
          document.querySelectorAll('[data-roach]').forEach(r => r.remove());
          roachCount = 0;
          const blocker = document.getElementById('roachBlocker');
          if (blocker) blocker.remove();
          adminFailCount = 0;
          sprayBtn.remove();
          const s = document.getElementById('sprayStyle');
          if (s) s.remove();
        }, 800);
      });
    }
  }, 60000);

  // 通常個体 10匹
  for (let i = 0; i < 10; i++) {
    setTimeout(() => spawnRoach('normal'), i * 400);
  }
  // マウスから逃げる個体 4匹
  for (let i = 0; i < 4; i++) {
    setTimeout(() => spawnRoach('shy'), 4000 + i * 500);
  }
  // 大きい個体 3匹
  for (let i = 0; i < 3; i++) {
    setTimeout(() => spawnRoach('big'), 6000 + i * 600);
  }
  // 高速個体 3匹
  for (let i = 0; i < 3; i++) {
    setTimeout(() => spawnRoach('fast'), 7500 + i * 400);
  }
}

function roachCleared() {
  roachCount--;
  if (roachCount <= 0) {
    const blocker = document.getElementById('roachBlocker');
    if (blocker) blocker.remove();
    adminFailCount = 0;
  }
}

let mouseX = -1000, mouseY = -1000;
document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
document.addEventListener('touchmove', e => {
  const t = e.touches[0];
  if (t) { mouseX = t.clientX; mouseY = t.clientY; }
});

function spawnRoach(type) {
  type = type || 'normal';
  const r = document.createElement('div');
  r.textContent = '🪳';

  let size, baseSpeed, burstSpeed, shyness;
  switch (type) {
    case 'big':
      size = 50 + Math.random() * 15;
      baseSpeed = 2 + Math.random() * 1.5;
      burstSpeed = 5 + Math.random() * 3;
      shyness = 0;
      break;
    case 'fast':
      size = 24 + Math.random() * 10;
      baseSpeed = 5 + Math.random() * 3;
      burstSpeed = 10 + Math.random() * 5;
      shyness = 0;
      break;
    case 'shy':
      size = 30 + Math.random() * 12;
      baseSpeed = 3 + Math.random() * 2;
      burstSpeed = 9 + Math.random() * 4;
      shyness = 150; // 反応距離(px)
      break;
    default:
      size = 28 + Math.random() * 20;
      baseSpeed = 3 + Math.random() * 2;
      burstSpeed = 7 + Math.random() * 5;
      shyness = 0;
  }

  let x = Math.random() * (window.innerWidth - 60);
  let y = Math.random() * (window.innerHeight - 60);
  let angle = Math.random() * 360;
  let speed = 0;
  let targetSpeed = baseSpeed;
  let targetAngle = angle;
  let state = 'run';
  let stateTimer = 30 + Math.random() * 60;
  let wobble = 0;

  r.setAttribute('data-roach', 'true');
  r.style.cssText = `
    position:fixed; font-size:${size}px; z-index:10000;
    pointer-events:auto; cursor:pointer; user-select:none;
    left:${x}px; top:${y}px;
    transform:rotate(${angle}deg);
    filter:drop-shadow(0 1px 2px rgba(0,0,0,0.3));
    transition:none;
  `;
  document.body.appendChild(r);

  let animId;

  function tick() {
    stateTimer--;

    // マウスから逃げる（shy個体）
    if (shyness > 0) {
      const dx = x - mouseX;
      const dy = y - mouseY;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < shyness) {
        // マウスの反対方向に逃げる
        targetAngle = Math.atan2(dy, dx) * 180 / Math.PI;
        targetSpeed = burstSpeed;
        state = 'burst';
        stateTimer = 20;
      }
    }

    // 状態遷移
    if (stateTimer <= 0) {
      const roll = Math.random();
      if (roll < 0.12) {
        state = 'pause';
        stateTimer = 15 + Math.random() * 35;
        targetSpeed = 0;
      } else if (roll < 0.30) {
        state = 'burst';
        stateTimer = 15 + Math.random() * 25;
        targetAngle += (Math.random() - 0.5) * 140;
        targetSpeed = burstSpeed;
      } else if (roll < 0.50) {
        state = 'wander';
        stateTimer = 40 + Math.random() * 80;
        targetSpeed = baseSpeed * 0.4;
      } else {
        state = 'run';
        stateTimer = 30 + Math.random() * 60;
        targetAngle += (Math.random() - 0.5) * 80;
        targetSpeed = baseSpeed;
      }
    }

    if (state === 'wander') {
      targetAngle += (Math.random() - 0.5) * 8;
    } else if (state === 'run') {
      targetAngle += (Math.random() - 0.5) * 4;
    } else if (state === 'burst') {
      targetAngle += (Math.random() - 0.5) * 6;
    }

    speed += (targetSpeed - speed) * 0.1;

    let diff = targetAngle - angle;
    while (diff > 180) diff -= 360;
    while (diff < -180) diff += 360;
    angle += diff * 0.12;

    wobble = Math.sin(Date.now() * 0.03) * (speed > 1 ? 2 : 0);

    const rad = angle * Math.PI / 180;
    x += Math.cos(rad) * speed;
    y += Math.sin(rad) * speed;

    if (x < 5 || x > window.innerWidth - 45) {
      targetAngle = 180 - targetAngle + (Math.random() - 0.5) * 40;
      x = Math.max(5, Math.min(window.innerWidth - 45, x));
      state = 'burst'; stateTimer = 15; targetSpeed = burstSpeed;
    }
    if (y < 5 || y > window.innerHeight - 45) {
      targetAngle = -targetAngle + (Math.random() - 0.5) * 40;
      y = Math.max(5, Math.min(window.innerHeight - 45, y));
      state = 'burst'; stateTimer = 15; targetSpeed = burstSpeed;
    }

    const breathe = 1 + Math.sin(Date.now() * 0.005) * 0.03;

    r.style.left = x + 'px';
    r.style.top = y + 'px';
    r.style.transform = `rotate(${angle + 90 + wobble}deg) scale(${breathe})`;

    animId = requestAnimationFrame(tick);
  }

  animId = requestAnimationFrame(tick);
  r.dataset.animid = animId;

  r.addEventListener('click', () => {
    cancelAnimationFrame(animId);
    r.style.pointerEvents = 'none';
    r.textContent = '💀';
    r.style.transform = `rotate(${angle}deg) scale(1.2)`;
    r.style.filter = 'none';
    r.style.opacity = '0.6';
    setTimeout(() => {
      r.remove();
      roachCleared();
      // 全滅したらスプレーボタンも消す
      if (roachCount <= 0) {
        const sb = document.getElementById('sprayBtn');
        const ss = document.getElementById('sprayStyle');
        if (sb) sb.remove();
        if (ss) ss.remove();
      }
    }, 600);
  });
}

function closeAdminModal() {
  document.getElementById('adminOverlay').classList.remove('active');
}

document.getElementById('adminPwInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitAdminPw();
});

// SW登録
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js');
}

load();
</script>

</body>
</html>
