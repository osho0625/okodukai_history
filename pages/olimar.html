<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0d1b2a">
<title>🚀 オリマーの冒険（仮）</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0d1b2a; color: #e0e0e0; font-family: 'Segoe UI', sans-serif;
  display: flex; flex-direction: column; align-items: center;
  height: 100vh; height: 100dvh; overflow: hidden;
}
.header {
  display: flex; align-items: center; width: 100%; max-width: 420px;
  padding: 8px 10px; gap: 8px;
}
.back { color: #eee; text-decoration: none; font-size: 1.5em; cursor: pointer; }
.header-icons { margin-left: auto; display: flex; gap: 6px; align-items: center; }
.icon-btn {
  width: 34px; height: 34px; border: none; border-radius: 50%;
  background: rgba(255,255,255,0.08); color: #eee; font-size: 1em;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.icon-btn:active { background: rgba(255,255,255,0.2); }
.home-link { color: #eee; text-decoration: none; font-size: 1.3em; }

.game-wrap {
  flex: 1; width: 100%; max-width: 420px;
  display: flex; flex-direction: column; overflow: hidden; padding: 0 10px;
}

/* シーン画像 */
.scene-img {
  width: 100%; height: 160px; border-radius: 10px; margin-bottom: 8px;
  overflow: hidden; position: relative;
}
.scene-img canvas { width: 100%; height: 100%; display: block; }

/* テキストウィンドウ */
.text-window {
  flex: 1; overflow-y: auto; padding: 12px;
  background: rgba(0,0,0,0.4); border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.06);
  margin-bottom: 8px; line-height: 2.1; font-size: 0.9em;
  scroll-behavior: smooth; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.text-window::-webkit-scrollbar { width: 4px; }
.text-window::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 2px; }
.text-p { margin-bottom: 10px; }
.text-p.system { color: #ffd54f; font-size: 0.85em; text-align: center; }
.text-p.chapter { color: #81c784; font-size: 1em; font-weight: 700; text-align: center; margin: 14px 0; }
.tap-indicator {
  text-align: center; font-size: 0.7em; color: #888; padding: 4px;
  animation: blink 1.2s infinite;
}
@keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
ruby { ruby-align: center; }
rt { font-size: 0.55em; color: #aaa; }

/* 選択肢 */
.choices { display: flex; flex-direction: column; gap: 6px; padding-bottom: 10px; }

/* アイテムスロット */
.item-slots {
  display: flex; gap: 6px; padding: 6px 0; align-items: center; flex-wrap: wrap;
}
.item-slot {
  width: 40px; height: 40px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.04); display: flex; align-items: center; justify-content: center;
  font-size: 1.3em; cursor: pointer; transition: border-color 0.15s, background 0.15s;
}
.item-slot:active { background: rgba(255,255,255,0.1); }
.item-slot.held { border-color: #ffd54f; background: rgba(255,215,0,0.12); box-shadow: 0 0 8px rgba(255,215,0,0.3); }
.hand-label { font-size: 0.7em; color: #ffd54f; padding: 2px 6px; }

/* ピクミン選択スロット */
.pikmin-slots {
  display: flex; gap: 6px; padding: 4px 0; align-items: center; flex-wrap: wrap;
}
.pikmin-slot {
  width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.04); cursor: pointer; overflow: hidden;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.pikmin-slot img { width: 100%; height: 100%; object-fit: cover; }
.pikmin-slot:active { opacity: 0.7; }
.pikmin-slot.selected { border-color: #81c784; box-shadow: 0 0 8px rgba(129,199,132,0.4); }
.pikmin-label { font-size: 0.7em; color: #81c784; padding: 2px 6px; }
.choice-btn {
  width: 100%; padding: 11px 14px; border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px; background: rgba(255,255,255,0.04);
  color: #e0e0e0; font-size: 0.88em; text-align: left; cursor: pointer;
  transition: background 0.15s;
}
.choice-btn:active { background: rgba(255,255,255,0.12); }

/* タイトル画面 */
.title-screen {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: #0d1b2a; display: flex; flex-direction: column;
  align-items: center; justify-content: center; z-index: 100; gap: 12px;
}
.title-screen h1 { font-size: 1.5em; letter-spacing: 2px; }
.title-screen p { font-size: 0.8em; color: #78909c; }
.title-btn {
  width: 200px; padding: 13px; border: none; border-radius: 12px;
  color: #fff; font-size: 0.95em; font-weight: 700; cursor: pointer;
}
.title-btn:active { opacity: 0.8; }
.title-btn:disabled { opacity: 0.3; cursor: default; }

/* オーバーレイ */
.overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.88); z-index: 80;
  justify-content: center; align-items: center;
}
.overlay-panel {
  background: #1a1a2e; border-radius: 16px; padding: 20px;
  width: 90%; max-width: 360px; border: 1px solid rgba(255,255,255,0.08);
  max-height: 80vh; overflow-y: auto;
}
.overlay-panel h3 { text-align: center; margin-bottom: 14px; }
.stat-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 0.88em; }
.item-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.04); font-size: 0.88em; }
.achieve-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
.achieve-row .a-icon { font-size: 1.4em; }
.achieve-row .a-info { font-size: 0.85em; }
.achieve-row.locked { opacity: 0.35; }
.close-btn { width: 100%; margin-top: 14px; padding: 11px; border: none; border-radius: 8px; background: #37474f; color: #fff; font-size: 0.9em; cursor: pointer; }
.party-member { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.04); }
.party-member img { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }

/* マップ */
.map-node {
  width: 70px; height: 70px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.12);
  background: rgba(255,255,255,0.05); display: flex; flex-direction: column;
  align-items: center; justify-content: center; cursor: pointer; font-size: 0.7em;
  text-align: center; padding: 4px; transition: background 0.15s, border-color 0.15s;
}
.map-node:active { background: rgba(255,255,255,0.12); }
.map-node.current { border-color: #81c784; background: rgba(129,199,132,0.1); }
.map-node .map-icon { font-size: 1.6em; margin-bottom: 2px; }
</style>
</head>
<body>

<div class="header">
  <a class="back" onclick="olimarNavGuard('前の画面', function(){history.back()})">←</a>
  <div class="header-icons">
    <button class="icon-btn" id="mapBtn" onclick="openMap()" title="マップ" style="display:none;">🗺️</button>
    <button class="icon-btn" onclick="openStatus()" title="ステータス">📊</button>
    <button class="icon-btn" onclick="openItems()" title="アイテム">🎒</button>
    <button class="icon-btn" onclick="openParty()" title="仲間">🌿</button>
    <a class="home-link" onclick="olimarNavGuard('ホーム', function(){location.href='../index.html'})" style="cursor:pointer;" title="ホーム">🏠</a>
  </div>
</div>

<div class="game-wrap">
  <div class="scene-img"><canvas id="sceneCanvas" width="420" height="160"></canvas></div>
  <div class="pikmin-slots" id="pikminSlots"></div>
  <div class="item-slots" id="itemSlots"></div>
  <div class="text-window" id="textWindow"></div>
  <div class="choices" id="choices"></div>
</div>

<!-- タイトル画面 -->
<div class="title-screen" id="titleScreen">
  <div style="font-size:3em;">🚀</div>
  <h1>オリマーの冒険（仮）</h1>
  <p>― 謎の惑星と小さな仲間 ―</p>
  <button class="title-btn" style="background:#2e7d32;" onclick="newGame()">はじめから</button>
  <button class="title-btn" style="background:#1565c0;" id="continueBtn" onclick="continueGame()">続きから</button>
  <button class="title-btn" style="background:#6a1b9a;" onclick="openAchievements()">🏆 実績</button>
  <button class="title-btn" style="background:#37474f;" onclick="history.back()">← もどる</button>
</div>

<!-- マップ -->
<div class="overlay" id="mapOverlay"><div class="overlay-panel" style="max-width:400px;"><h3>🗺️ マップ</h3><div id="mapObjective" style="font-size:0.82em;color:#ffd54f;text-align:center;margin-bottom:10px;padding:6px;background:rgba(255,215,0,0.06);border-radius:8px;"></div><div id="mapContent" style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;"></div><div id="mapHint" style="font-size:0.8em;color:#aaa;text-align:center;margin-top:10px;padding:8px;min-height:40px;"></div><button class="close-btn" onclick="closeOv('mapOverlay')">閉じる</button></div></div>
<!-- ステータス -->
<div class="overlay" id="statusOverlay"><div class="overlay-panel"><h3>📊 ステータス</h3><div id="statusContent"></div><button class="close-btn" onclick="closeOv('statusOverlay')">閉じる</button></div></div>
<!-- アイテム -->
<div class="overlay" id="itemOverlay"><div class="overlay-panel"><h3>🎒 アイテム</h3><div id="itemContent"></div><button class="close-btn" onclick="closeOv('itemOverlay')">閉じる</button></div></div>
<!-- 仲間 -->
<div class="overlay" id="partyOverlay"><div class="overlay-panel"><h3>🌿 仲間</h3><div id="partyContent"></div><button class="close-btn" onclick="closeOv('partyOverlay')">閉じる</button></div></div>
<!-- 実績 -->
<div class="overlay" id="achieveOverlay"><div class="overlay-panel"><h3>🏆 実績</h3><div id="achieveContent"></div><button class="close-btn" onclick="closeOv('achieveOverlay')">閉じる</button></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="../js/common.js"></script>
<script>
// ===== 定数 =====
const PUYO_IMGS = ['../images/puyo_1.avif','../images/puyo_2.avif','../images/puyo_3.avif','../images/puyo_4.avif','../images/puyo_5.avif','../images/puyo_6.avif','../images/puyo_7.avif','../images/puyo_8.avif','../images/puyo_9.avif'];
const PIKMIN_NAMES = ['紫ピクミン','赤ピクミン','青ピクミン','黄ピクミン','白ピクミン','氷ピクミン','岩ピクミン','羽ピクミン','光ピクミン'];
const DEVICE_ID = getDeviceId();
function getDeviceId() {
  let id = localStorage.getItem('olimar_device_id');
  if (!id) { id = crypto.randomUUID(); localStorage.setItem('olimar_device_id', id); }
  return id;
}

// ===== ゲーム状態 =====
let G = {
  node: null,
  player: { hp: 100, maxHp: 100, stamina: 50, maxStamina: 50, atk: 10, def: 5 },
  party: [],
  items: [],
  flags: {},
  heldItem: null, // 手に持っているアイテム名
  selectedPikmin: null, // 選択中のピクミン名
};

// ===== 実績定義 =====
const ACHIEVEMENTS = [
  { id: 'first_step', icon: '👣', name: '最初の一歩', desc: '探索を開始した' },
  { id: 'found_pikmin', icon: '🌱', name: '発見', desc: 'ピクミンの芽を見つけた' },
  { id: 'pull_pikmin', icon: '🌿', name: '仲間', desc: 'ピクミンを引っこ抜いた' },
  { id: 'got_stone', icon: '💎', name: '収集家', desc: '光る石を手に入れた' },
  { id: 'healed', icon: '💧', name: '癒しの泉', desc: '池の水で回復した' },
  { id: 'chapter1', icon: '📖', name: '第1章完了', desc: '不時着編をクリアした' },
];

function getUnlockedAchievements() {
  return JSON.parse(localStorage.getItem('olimar_achievements') || '[]');
}
function unlockAchievement(id) {
  const list = getUnlockedAchievements();
  if (list.includes(id)) return;
  list.push(id);
  localStorage.setItem('olimar_achievements', JSON.stringify(list));
  // 通知
  showAchievementToast(ACHIEVEMENTS.find(a => a.id === id));
}
function showAchievementToast(a) {
  if (!a) return;
  const div = document.createElement('div');
  div.style.cssText = 'position:fixed;top:12px;left:50%;transform:translateX(-50%);background:rgba(106,27,154,0.92);color:#fff;padding:10px 18px;border-radius:10px;font-size:0.85em;z-index:200;animation:fadeIn 0.3s;';
  div.textContent = `🏆 ${a.icon} ${a.name}`;
  document.body.appendChild(div);
  setTimeout(() => div.remove(), 2500);
}

// ===== シーン描画（水彩風Canvas） =====
const sceneCanvas = document.getElementById('sceneCanvas');
const sctx = sceneCanvas.getContext('2d');

function drawScene(sceneId) {
  const w = sceneCanvas.width, h = sceneCanvas.height;
  sctx.clearRect(0, 0, w, h);
  const scenes = {
    crash: () => {
      // 薄紫の空 + 壊れたロケット + 炎
      gradient(0, 0, w, h, '#4a148c', '#1a237e', '#263238');
      softCircle(w*0.7, h*0.3, 60, 'rgba(255,183,77,0.15)');
      ground('#33691e', '#1b5e20', h*0.7);
      // ロケット残骸
      sctx.fillStyle = '#546e7a'; sctx.fillRect(w*0.15, h*0.45, 50, 30);
      sctx.fillStyle = '#37474f'; sctx.fillRect(w*0.18, h*0.4, 15, 35);
      // 炎
      softCircle(w*0.22, h*0.38, 18, 'rgba(255,87,34,0.5)');
      softCircle(w*0.18, h*0.42, 14, 'rgba(255,152,0,0.4)');
      softCircle(w*0.25, h*0.35, 12, 'rgba(255,235,59,0.3)');
      // 煙
      softCircle(w*0.2, h*0.28, 20, 'rgba(200,200,200,0.2)');
      softCircle(w*0.25, h*0.22, 15, 'rgba(200,200,200,0.15)');
      scatter('#2e7d32', '#81c784', 20);
    },
    forest: () => {
      gradient(0, 0, w, h, '#1b5e20', '#2e7d32', '#004d40');
      softCircle(w*0.2, h*0.3, 80, 'rgba(76,175,80,0.2)');
      softCircle(w*0.7, h*0.25, 70, 'rgba(56,142,60,0.2)');
      ground('#33691e', '#1b5e20', h*0.75);
      // 木
      sctx.fillStyle = '#4e342e'; sctx.fillRect(w*0.15, h*0.3, 12, h*0.45);
      softCircle(w*0.2, h*0.25, 35, 'rgba(76,175,80,0.5)');
      sctx.fillStyle = '#3e2723'; sctx.fillRect(w*0.7, h*0.35, 10, h*0.4);
      softCircle(w*0.73, h*0.3, 30, 'rgba(56,142,60,0.5)');
      scatter('#a5d6a7', '#66bb6a', 15);
    },
    sprout: () => {
      gradient(0, 0, w, h, '#1b5e20', '#388e3c', '#2e7d32');
      ground('#33691e', '#1b5e20', h*0.7);
      softCircle(w*0.5, h*0.55, 12, 'rgba(139,195,74,0.7)');
      // 芽
      sctx.strokeStyle = '#7cb342'; sctx.lineWidth = 3;
      sctx.beginPath(); sctx.moveTo(w*0.5, h*0.7); sctx.quadraticCurveTo(w*0.5, h*0.5, w*0.52, h*0.45); sctx.stroke();
      softCircle(w*0.52, h*0.42, 8, 'rgba(139,195,74,0.8)');
      scatter('#a5d6a7', '#c8e6c9', 10);
    },
    pond: () => {
      gradient(0, 0, w, h, '#004d40', '#00695c', '#1b5e20');
      ground('#33691e', '#1b5e20', h*0.75);
      // 池
      sctx.fillStyle = 'rgba(77,208,225,0.3)';
      sctx.beginPath(); sctx.ellipse(w*0.5, h*0.65, 80, 25, 0, 0, Math.PI*2); sctx.fill();
      sctx.fillStyle = 'rgba(77,208,225,0.15)';
      sctx.beginPath(); sctx.ellipse(w*0.5, h*0.65, 60, 18, 0, 0, Math.PI*2); sctx.fill();
      softCircle(w*0.45, h*0.6, 5, 'rgba(255,255,255,0.4)');
      scatter('#80cbc4', '#a5d6a7', 12);
    },
    rock: () => {
      gradient(0, 0, w, h, '#263238', '#37474f', '#1b5e20');
      ground('#33691e', '#1b5e20', h*0.7);
      // 岩
      sctx.fillStyle = '#546e7a';
      sctx.beginPath(); sctx.moveTo(w*0.35, h*0.7); sctx.lineTo(w*0.3, h*0.45); sctx.lineTo(w*0.55, h*0.4); sctx.lineTo(w*0.65, h*0.7); sctx.fill();
      sctx.fillStyle = '#455a64';
      sctx.beginPath(); sctx.moveTo(w*0.38, h*0.65); sctx.lineTo(w*0.4, h*0.5); sctx.lineTo(w*0.52, h*0.48); sctx.lineTo(w*0.55, h*0.65); sctx.fill();
      scatter('#78909c', '#90a4ae', 8);
    },
    cave: () => {
      gradient(0, 0, w, h, '#1a1a2e', '#263238', '#37474f');
      ground('#212121', '#1a1a1a', h*0.65);
      // 洞窟口
      sctx.fillStyle = '#000';
      sctx.beginPath(); sctx.ellipse(w*0.5, h*0.6, 50, 40, 0, 0, Math.PI*2); sctx.fill();
      sctx.fillStyle = '#1a1a1a';
      sctx.beginPath(); sctx.ellipse(w*0.5, h*0.6, 35, 28, 0, 0, Math.PI*2); sctx.fill();
      scatter('#455a64', '#37474f', 6);
    },
    river: () => {
      // 水辺の谷：青い空＋川＋緑の岸
      gradient(0, 0, w, h, '#1565c0', '#0d47a1', '#1b5e20');
      ground('#2e7d32', '#1b5e20', h*0.6);
      // 川
      sctx.fillStyle = 'rgba(33,150,243,0.4)';
      sctx.fillRect(0, h*0.55, w, h*0.2);
      sctx.fillStyle = 'rgba(100,181,246,0.2)';
      sctx.fillRect(0, h*0.6, w, h*0.08);
      // 水面の光
      softCircle(w*0.3, h*0.62, 8, 'rgba(255,255,255,0.3)');
      softCircle(w*0.6, h*0.58, 6, 'rgba(255,255,255,0.25)');
      softCircle(w*0.8, h*0.63, 5, 'rgba(255,255,255,0.2)');
      // 岸の植物
      scatter('#a5d6a7', '#66bb6a', 12);
      scatter('#81d4fa', '#4fc3f7', 5);
    },
    hill: () => {
      gradient(0, 0, w, h, '#f9a825', '#f57f17', '#33691e');
      ground('#33691e', '#1b5e20', h*0.65);
      // 雷の木
      sctx.fillStyle = '#4e342e'; sctx.fillRect(w*0.5, h*0.2, 14, h*0.45);
      softCircle(w*0.55, h*0.15, 30, 'rgba(255,235,59,0.4)');
      // 電気エフェクト
      softCircle(w*0.3, h*0.3, 10, 'rgba(255,235,59,0.3)');
      softCircle(w*0.7, h*0.25, 8, 'rgba(255,235,59,0.25)');
      scatter('#ffee58', '#fdd835', 10);
    },
    swamp: () => {
      gradient(0, 0, w, h, '#4a148c', '#6a1b9a', '#1b5e20');
      ground('#2e7d32', '#1b5e20', h*0.7);
      // 毒霧
      softCircle(w*0.3, h*0.5, 50, 'rgba(156,39,176,0.2)');
      softCircle(w*0.7, h*0.45, 40, 'rgba(186,104,200,0.15)');
      // 沼
      sctx.fillStyle = 'rgba(76,175,80,0.3)';
      sctx.beginPath(); sctx.ellipse(w*0.5, h*0.75, 90, 20, 0, 0, Math.PI*2); sctx.fill();
      scatter('#ce93d8', '#e1bee7', 8);
    },
    ice: () => {
      gradient(0, 0, w, h, '#e3f2fd', '#90caf9', '#42a5f5');
      ground('#bbdefb', '#90caf9', h*0.65);
      // 氷の結晶
      softCircle(w*0.3, h*0.4, 25, 'rgba(255,255,255,0.4)');
      softCircle(w*0.7, h*0.35, 20, 'rgba(255,255,255,0.3)');
      softCircle(w*0.5, h*0.5, 30, 'rgba(227,242,253,0.5)');
      scatter('#e3f2fd', '#ffffff', 15);
    },
    sky: () => {
      gradient(0, 0, w, h, '#e3f2fd', '#bbdefb', '#90caf9');
      // 浮島
      sctx.fillStyle = '#4caf50';
      sctx.beginPath(); sctx.ellipse(w*0.3, h*0.5, 40, 15, 0, 0, Math.PI*2); sctx.fill();
      sctx.fillStyle = '#388e3c';
      sctx.beginPath(); sctx.ellipse(w*0.7, h*0.4, 35, 12, 0, 0, Math.PI*2); sctx.fill();
      // 雲
      softCircle(w*0.2, h*0.2, 30, 'rgba(255,255,255,0.5)');
      softCircle(w*0.8, h*0.15, 25, 'rgba(255,255,255,0.4)');
      softCircle(w*0.5, h*0.1, 20, 'rgba(255,255,255,0.3)');
      // 光の柱
      softCircle(w*0.5, h*0.6, 15, 'rgba(255,235,59,0.4)');
      scatter('#e1f5fe', '#b3e5fc', 10);
    },
  };
  (scenes[sceneId] || scenes.crash)();
}

function gradient(x, y, w, h, c1, c2, c3) {
  const g = sctx.createLinearGradient(x, y, x, h);
  g.addColorStop(0, c1); g.addColorStop(0.5, c2); g.addColorStop(1, c3);
  sctx.fillStyle = g; sctx.fillRect(x, y, w, h);
}
function ground(c1, c2, y) {
  const w = sceneCanvas.width, h = sceneCanvas.height;
  const g = sctx.createLinearGradient(0, y, 0, h);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  sctx.fillStyle = g; sctx.fillRect(0, y, w, h - y);
}
function softCircle(x, y, r, color) {
  const g = sctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, color); g.addColorStop(1, 'transparent');
  sctx.fillStyle = g; sctx.beginPath(); sctx.arc(x, y, r, 0, Math.PI*2); sctx.fill();
}
function scatter(c1, c2, count) {
  const w = sceneCanvas.width, h = sceneCanvas.height;
  for (let i = 0; i < count; i++) {
    const x = Math.random() * w, y = h * 0.5 + Math.random() * h * 0.4;
    softCircle(x, y, 2 + Math.random() * 4, Math.random() > 0.5 ? c1 : c2);
  }
}

// アイテム合成（将来用基盤）
// 使い方: 手に持ったアイテムAで、スロット内のアイテムBをタップ → combineItems(A, B)
function combineItems(heldName, targetName) {
  const RECIPES = {
    // 'ライター+枝': { remove: ['枝'], add: { name: '火の付いた枝', icon: '🔥', desc: '明るく燃えている' }, msg: '🔥 枝に火をともした。' },
  };
  const key = heldName + '+' + targetName;
  const recipe = RECIPES[key];
  if (!recipe) return false;
  recipe.remove.forEach(n => removeItem(n));
  G.items.push(recipe.add);
  G.heldItem = recipe.add.name;
  renderItemSlots();
  addText('system', recipe.msg);
  return true;
}

// 敗北処理
function handleDefeat(returnNode) {
  // キーアイテム以外をランダムロスト
  const KEY_ITEMS = ['光る石', 'ロープ', '耐火服', '探検キット', '防水マント', '絶縁グローブ', '古代の鍵'];
  const lostItems = [];
  G.items = G.items.filter(it => {
    if (KEY_ITEMS.includes(it.name)) return true;
    if (Math.random() < 0.5) { lostItems.push(it.name); return false; }
    return true;
  });
  G.player.hp = Math.max(1, Math.floor(G.player.hp * 0.5));
  G.player.stamina = Math.max(1, Math.floor(G.player.stamina * 0.5));
  G.flags.lastDefeatNode = returnNode;
  if (lostItems.length > 0) G.flags.lostItemNames = lostItems.join('、');
  else G.flags.lostItemNames = '';
}

// ===== テキスト送り制御 =====
let textQueue = [];
let textPage = 0;
let pendingChoices = null;
let pendingOnEnter = null;
const LINES_PER_PAGE = 2;

function goToNode(nodeId) {
  if (nodeId === '_title') { document.getElementById('titleScreen').style.display = 'flex'; return; }
  const node = SCENARIO[nodeId];
  if (!node) return;
  G.node = nodeId;

  // 訪問記録
  recordVisit(nodeId);
  updateMapBtn();

  // シーン描画
  drawScene(node.scene || 'crash');

  // テキスト準備（onEnterより先に評価してフラグ変更前のテキストを取得）
  const textArr = typeof node.text === 'function' ? node.text() : node.text;

  // onEnterは全テキスト表示後に実行するため保存
  pendingOnEnter = node.onEnter || null;

  // テキスト表示（2行ずつページ送り）
  const tw = document.getElementById('textWindow');
  if (tw.innerHTML !== '') {
    const hr = document.createElement('div');
    hr.style.cssText = 'border-top:1px solid rgba(255,255,255,0.06);margin:12px 0;';
    tw.appendChild(hr);
  }
  textQueue = textArr;
  textPage = 0;
  pendingChoices = typeof node.choices === 'function' ? node.choices() : node.choices;

  // 選択肢を隠す
  document.getElementById('choices').innerHTML = '';

  // 最初のページを表示
  showNextPage();

  // 自動セーブ
  autoSave();
}

function showNextPage() {
  const tw = document.getElementById('textWindow');
  const start = textPage * LINES_PER_PAGE;
  const end = Math.min(start + LINES_PER_PAGE, textQueue.length);

  for (let i = start; i < end; i++) {
    const p = document.createElement('div');
    p.className = 'text-p';
    p.innerHTML = textQueue[i];
    tw.appendChild(p);
  }
  setTimeout(() => { tw.scrollTop = tw.scrollHeight; }, 80);

  textPage++;
  if (textPage * LINES_PER_PAGE < textQueue.length) {
    // まだ続きがある → タップ待ちインジケーター
    showTapIndicator();
  } else {
    // 全テキスト表示完了 → onEnter実行 → 選択肢を表示
    removeTapIndicator();
    if (pendingOnEnter) { pendingOnEnter(); pendingOnEnter = null; }
    // onEnterで選択肢が変わる可能性があるので再評価
    const node = SCENARIO[G.node];
    if (node) pendingChoices = typeof node.choices === 'function' ? node.choices() : node.choices;
    renderPikminSlots();
    renderItemSlots();
    showChoices(pendingChoices);
  }
}

function showTapIndicator() {
  removeTapIndicator();
  const tw = document.getElementById('textWindow');
  const ind = document.createElement('div');
  ind.className = 'tap-indicator';
  ind.id = 'tapInd';
  ind.textContent = '▼ タップ';
  tw.appendChild(ind);
  setTimeout(() => { tw.scrollTop = tw.scrollHeight; }, 80);
}

function removeTapIndicator() {
  const ind = document.getElementById('tapInd');
  if (ind) ind.remove();
}

// テキストウィンドウタップで次ページ
document.getElementById('textWindow').addEventListener('click', () => {
  if (textPage * LINES_PER_PAGE >= textQueue.length) return; // 全部表示済み
  removeTapIndicator();
  showNextPage();
});

function addText(cls, msg) {
  const tw = document.getElementById('textWindow');
  const p = document.createElement('div');
  p.className = 'text-p ' + cls;
  p.innerHTML = msg;
  tw.appendChild(p);
}

function showChoices(choices) {
  const el = document.getElementById('choices');
  el.innerHTML = '';
  if (!choices) return;
  choices.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = c.text;
    btn.onclick = () => { el.innerHTML = ''; goToNode(c.next); };
    el.appendChild(btn);
  });
}

  const objEl = document.getElementById('mapObjective');
  el.innerHTML = '';
  hintEl.textContent = 'ノードをタップすると情報が見られます';
  objEl.textContent = getObjectiveText();

  visited.forEach(nodeId => {
    const info = MAP_NODES[nodeId];
    if (!info) return;
    const div = document.createElement('div');
    div.className = 'map-node' + (G.node === nodeId ? ' current' : '');
    div.innerHTML = `<div class="map-icon">${info.icon}</div><div>${info.name}</div>`;
    div.onclick = () => {
      hintEl.textContent = '💡 ' + info.hint;
    };
    el.appendChild(div);
  });

  document.getElementById('mapOverlay').style.display = 'flex';
}

function updateMapBtn() {
  const btn = document.getElementById('mapBtn');
  if (btn) btn.style.display = G.flags.gotExploreKit ? 'flex' : 'none';
}

// 訪問記録
function recordVisit(nodeId) {
  if (!G.flags.visitedNodes) G.flags.visitedNodes = [];
  if (!G.flags.visitedNodes.includes(nodeId)) G.flags.visitedNodes.push(nodeId);
}

function olimarNavGuard(dest, action) {
  const title = document.getElementById('titleScreen');
  if (title && title.style.display !== 'none') { action(); return; }
  if (confirm('現在のゲームを中断して' + dest + 'に移動しますか？\n（自動セーブ済み）')) { action(); }
}
</script>
