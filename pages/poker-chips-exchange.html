<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<title>&#x1F3AA; チップ交換所</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="../js/common.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; padding: 16px; min-height: 100vh; }
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.header a { text-decoration: none; font-size: 1.4em; cursor: pointer; color: #eee; }
h1 { font-size: 1.15em; color: #ffd700; }
.my-chips { text-align: center; background: #16213e; border-radius: 12px; padding: 14px; margin-bottom: 16px; }
.my-chips .label { font-size: 0.85em; color: #aaa; }
.my-chips .value { font-size: 1.5em; font-weight: 700; color: #ffd700; margin-top: 4px; }
.name-select { text-align: center; margin-bottom: 16px; }
.name-select select { background: #0f3460; color: #eee; border: 1px solid #333; border-radius: 8px; padding: 10px 16px; font-size: 1em; }
.prize-card { background: #16213e; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
.prize-info { flex: 1; }
.prize-name { font-weight: 600; font-size: 1em; }
.prize-cost { font-size: 0.85em; color: #ffc107; margin-top: 2px; }
.prize-btn { border: none; border-radius: 8px; padding: 10px 16px; font-size: 0.85em; font-weight: 600; cursor: pointer; background: #4caf50; color: #fff; }
.prize-btn:disabled { background: #555; color: #888; cursor: not-allowed; }
.prize-btn:active:not(:disabled) { transform: scale(0.95); }
.recovery-section { text-align: center; background: #16213e; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.recovery-btn { border: none; border-radius: 8px; padding: 12px 24px; font-size: 1em; font-weight: 600; cursor: pointer; background: #2196f3; color: #fff; }
.recovery-btn:disabled { background: #555; color: #888; cursor: not-allowed; }
.recovery-note { font-size: 0.75em; color: #999; margin-top: 8px; }
.result-msg { text-align: center; margin-top: 12px; font-size: 0.9em; min-height: 1.2em; }
.result-msg.success { color: #4caf50; }
.result-msg.error { color: #ff4444; }
.history-section { margin-top: 20px; }
.history-section h2 { font-size: 0.95em; color: #aaa; margin-bottom: 10px; }
.history-item { font-size: 0.8em; color: #bbb; padding: 6px 0; border-bottom: 1px solid #222; }
</style>
</head>
<body>
<div class="header">
  <a class="back" onclick="history.back()">&#x2190;</a>
  <h1>&#x1F3AA; チップ交換所</h1>
  <a class="home" href="../index.html">&#x1F3E0;</a>
</div>

<div class="name-select">
  <select id="playerSelect" onchange="onPlayerChange()">
    <option value="">なまえを選んでね</option>
  </select>
</div>

<div class="my-chips">
  <div class="label">いまのチップ</div>
  <div class="value" id="myChips">-</div>
</div>

<div class="recovery-section">
  <button class="recovery-btn" id="recoveryBtn" onclick="recoverChips()" disabled>&#x1F504; 500チップに回復する</button>
  <div class="recovery-note">1日1回まで。500チップ以上あるときは使えません。</div>
</div>

<div id="prizeList"></div>
<div class="result-msg" id="resultMsg"></div>

<div class="history-section" id="historySection" style="display:none;">
  <h2>&#x1F4DC; 交換りれき</h2>
  <div id="exchangeHistory"></div>
</div>

<script>
const PLAYERS = ['はるちか', 'いろは', 'かいせい'];
const PRIZES = [
  { name: '&#x1F3AB; あそびチケット 1枚', cost: 3000 },
  { name: '&#x1F36C; おやつ（50円まで）', cost: 2000 },
  { name: '&#x1F36B; おやつ（100円まで）', cost: 3000 },
  { name: '&#x1F370; おやつ（150円まで）', cost: 4000 },
  { name: '&#x1F369; おやつ（200円まで）', cost: 5000 },
  { name: '&#x1F366; おやつ（250円まで）', cost: 6000 },
  { name: '&#x1F382; おやつ（300円まで）', cost: 7000 },
];

let currentPlayer = '';
let currentChips = 0;

function onPlayerChange() {
  currentPlayer = document.getElementById('playerSelect').value;
  if (currentPlayer) {
    loadPlayerData();
  } else {
    document.getElementById('myChips').textContent = '-';
    renderPrizes();
    updateRecoveryBtn();
  }
}

async function loadPlayerData() {
  const { data } = await client.from('poker_chips')
    .select('chips')
    .eq('player_name', currentPlayer)
    .maybeSingle();
  currentChips = data ? data.chips : 500;
  document.getElementById('myChips').textContent = currentChips.toLocaleString();
  renderPrizes();
  updateRecoveryBtn();
  loadHistory();
}

function renderPrizes() {
  const container = document.getElementById('prizeList');
  container.innerHTML = PRIZES.map((p, i) => {
    const canAfford = currentPlayer && currentChips >= p.cost;
    return `<div class="prize-card">
      <div class="prize-info">
        <div class="prize-name">${p.name}</div>
        <div class="prize-cost">${p.cost.toLocaleString()} チップ</div>
      </div>
      <button class="prize-btn" ${canAfford ? '' : 'disabled'} onclick="exchange(${i})">交換</button>
    </div>`;
  }).join('');
}

async function exchange(idx) {
  if (!currentPlayer) return;
  const prize = PRIZES[idx];
  if (currentChips < prize.cost) return;
  if (!confirm(`${prize.name} と交換する？\n（${prize.cost.toLocaleString()} チップ消費）`)) return;

  const newChips = currentChips - prize.cost;
  const { error } = await client.from('poker_chips')
    .update({ chips: newChips, updated_at: new Date().toISOString() })
    .eq('player_name', currentPlayer);
  if (error) { showResult('エラー: ' + error.message, 'error'); return; }

  // 履歴に記録
  await client.from('poker_chips_history').insert({
    player_name: currentPlayer, amount: -prize.cost, chips_after: newChips
  });
  // 交換履歴に記録
  await client.from('poker_chips_exchanges').insert({
    player_name: currentPlayer, prize_name: prize.name, cost: prize.cost
  });

  currentChips = newChips;
  document.getElementById('myChips').textContent = currentChips.toLocaleString();
  renderPrizes();
  updateRecoveryBtn();
  showResult(`${prize.name} と交換したよ！`, 'success');
  loadHistory();
}

async function recoverChips() {
  if (!currentPlayer || currentChips >= 500) return;
  const todayKey = 'chip_recovery_' + currentPlayer;
  const today = new Date().toLocaleDateString('ja-JP', { timeZone: 'Asia/Tokyo' });
  if (localStorage.getItem(todayKey) === today) {
    showResult('今日はもう回復したよ', 'error');
    return;
  }

  const newChips = 500;
  const amount = newChips - currentChips;
  const { error } = await client.from('poker_chips')
    .update({ chips: newChips, updated_at: new Date().toISOString() })
    .eq('player_name', currentPlayer);
  if (error) { showResult('エラー: ' + error.message, 'error'); return; }

  await client.from('poker_chips_history').insert({
    player_name: currentPlayer, amount: amount, chips_after: newChips
  });

  localStorage.setItem(todayKey, today);
  currentChips = newChips;
  document.getElementById('myChips').textContent = currentChips.toLocaleString();
  renderPrizes();
  updateRecoveryBtn();
  showResult('500チップに回復したよ！', 'success');
}

function updateRecoveryBtn() {
  const btn = document.getElementById('recoveryBtn');
  if (!currentPlayer) { btn.disabled = true; return; }
  const todayKey = 'chip_recovery_' + currentPlayer;
  const today = new Date().toLocaleDateString('ja-JP', { timeZone: 'Asia/Tokyo' });
  const usedToday = localStorage.getItem(todayKey) === today;
  btn.disabled = currentChips >= 500 || usedToday;
}

async function loadHistory() {
  const section = document.getElementById('historySection');
  const container = document.getElementById('exchangeHistory');
  const { data } = await client.from('poker_chips_exchanges')
    .select('prize_name, cost, created_at')
    .eq('player_name', currentPlayer)
    .order('created_at', { ascending: false })
    .limit(20);
  if (!data || data.length === 0) {
    section.style.display = 'none';
    return;
  }
  section.style.display = 'block';
  container.innerHTML = data.map(r => {
    const d = new Date(r.created_at);
    const dateStr = `${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
    return `<div class="history-item">${dateStr} — ${r.prize_name}（${r.cost.toLocaleString()}チップ）</div>`;
  }).join('');
}

function showResult(msg, type) {
  const el = document.getElementById('resultMsg');
  el.textContent = msg;
  el.className = 'result-msg ' + type;
  setTimeout(() => { el.textContent = ''; el.className = 'result-msg'; }, 3000);
}

// 初期化
(function() {
  const select = document.getElementById('playerSelect');
  PLAYERS.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p; opt.textContent = p;
    select.appendChild(opt);
  });
})();
</script>
</body>
</html>
