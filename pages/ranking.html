<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<title>ランキング - 💴ぷよ</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; padding: 20px; max-width: 480px; margin: 0 auto; }
.back { display: inline-block; margin-bottom: 16px; color: #eee; text-decoration: none; font-size: 1.6em; padding: 8px 12px; }
.back:hover { opacity: 0.6; }
h1 { text-align: center; margin-bottom: 16px; }
.tabs { display: flex; gap: 6px; justify-content: center; margin-bottom: 16px; }
.tab {
  padding: 8px 16px; border: none; border-radius: 8px;
  background: rgba(255,255,255,0.08); color: #aaa;
  font-size: 0.9em; font-weight: 600; cursor: pointer;
}
.tab.active { color: #fff; }
.tab.active[data-diff="easy"] { background: #43a047; }
.tab.active[data-diff="normal"] { background: #1976d2; }
.tab.active[data-diff="hard"] { background: #e53935; }
.rank-row {
  display: flex; align-items: center; gap: 12px;
  background: rgba(255,255,255,0.05); border-radius: 10px; padding: 14px 16px;
  margin-bottom: 8px;
}
.rank-num { font-size: 1.3em; font-weight: 700; width: 36px; text-align: center; }
.rank-1 { color: #ffd700; }
.rank-2 { color: #c0c0c0; }
.rank-3 { color: #cd7f32; }
.rank-info { flex: 1; }
.rank-name { font-weight: 600; font-size: 1.05em; }
.rank-date { font-size: 0.8em; color: #888; }
.rank-score { font-size: 1.2em; font-weight: 700; color: #ff6; }
.empty { text-align: center; color: #666; margin-top: 40px; }
</style>
</head>
<body>
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
  <a class="back" onclick="history.back()" style="cursor:pointer;">&#x2190;</a>
  <a href="../index.html" style="color:#eee;text-decoration:none;font-size:1.4em;padding:4px 8px;">🏠</a>
</div>
<h1>&#x1F3C6; ランキング TOP10</h1>
<div class="tabs" id="modeTabs" style="margin-bottom:8px;">
  <button class="tab active" data-mode="normal" onclick="switchMode('normal')" style="background:#1976d2;color:#fff;">ノーマル</button>
  <button class="tab" data-mode="custom" onclick="switchMode('custom')" id="customModeTab" style="display:none;">カスタム</button>
</div>
<div class="tabs" id="diffTabs">
  <button class="tab" data-diff="easy" onclick="loadRanking('easy')">🟢 Easy</button>
  <button class="tab active" data-diff="normal" onclick="loadRanking('normal')">🔵 Normal</button>
  <button class="tab" data-diff="hard" onclick="loadRanking('hard')">🔴 Hard</button>
  <button class="tab" data-diff="special" onclick="loadRanking('special')">🌈 Special</button>
</div>
<div id="customPresetTabs" style="display:none;"></div>
<div id="rankList"><div class="empty">読み込み中...</div></div>

<script>
const client = supabase.createClient("https://ynecezxnltigplrfzzoh.supabase.co", "sb_publishable_seKZakec1yB046vlgPDAKQ_zd4CKIg4");

let currentMode = 'normal';

function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll('#modeTabs .tab').forEach(t => {
    t.classList.remove('active');
    t.style.background = '';
    t.style.color = '#aaa';
  });
  const activeTab = document.querySelector('#modeTabs .tab[data-mode="' + mode + '"]');
  activeTab.classList.add('active');
  activeTab.style.background = mode === 'normal' ? '#1976d2' : '#9c27b0';
  activeTab.style.color = '#fff';

  if (mode === 'normal') {
    document.getElementById('diffTabs').style.display = 'flex';
    document.getElementById('customPresetTabs').style.display = 'none';
    loadRanking('normal');
  } else {
    document.getElementById('diffTabs').style.display = 'none';
    document.getElementById('customPresetTabs').style.display = 'block';
    loadCustomPresets();
  }
}

async function loadCustomPresets() {
  const container = document.getElementById('customPresetTabs');
  const list = document.getElementById('rankList');
  container.innerHTML = '<div style="color:#888;text-align:center;padding:8px;">読み込み中...</div>';
  list.innerHTML = '';
  try {
    const { data } = await client.from('custom_presets').select('*').order('created_at', { ascending: false }).limit(20);
    if (!data || data.length === 0) {
      container.innerHTML = '<div style="color:#888;text-align:center;padding:8px;">まだ設定がありません</div>';
      return;
    }
    container.innerHTML = '<div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px;"></div>';
    const wrap = container.firstChild;
    data.forEach((p, i) => {
      const btn = document.createElement('button');
      btn.className = 'tab';
      btn.textContent = p.name;
      btn.style.fontSize = '0.8em';
      btn.addEventListener('click', () => {
        wrap.querySelectorAll('.tab').forEach(t => { t.classList.remove('active'); t.style.background = ''; t.style.color = '#aaa'; });
        btn.classList.add('active');
        btn.style.background = '#9c27b0';
        btn.style.color = '#fff';
        loadCustomRanking(p.id);
      });
      wrap.appendChild(btn);
      if (i === 0) { btn.click(); }
    });
  } catch(e) { container.innerHTML = '<div style="color:#e53935;">読み込み失敗</div>'; }
}

const isAdmin = localStorage.getItem('deviceRole') === 'admin';
let lastLoadedTable = 'game_rankings'; // 'game_rankings' or 'custom_rankings'
let lastLoadedDiff = 'normal';
let lastLoadedPresetId = null;

async function loadCustomRanking(presetId) {
  lastLoadedTable = 'custom_rankings';
  lastLoadedPresetId = presetId;
  const list = document.getElementById('rankList');
  list.innerHTML = '<div class="empty">読み込み中...</div>';
  try {
    const { data } = await client.from('custom_rankings').select('*').eq('preset_id', presetId).order('score', { ascending: false }).limit(10);
    if (!data || data.length === 0) {
      list.innerHTML = '<div class="empty">まだ記録がありません</div>';
      return;
    }
    renderRankList(data);
  } catch(e) { list.innerHTML = '<div class="empty">読み込み失敗</div>'; }
}

async function loadRanking(diff) {
  lastLoadedTable = 'game_rankings';
  lastLoadedDiff = diff;
  document.querySelectorAll('#diffTabs .tab').forEach(t => t.classList.remove('active'));
  document.querySelector('#diffTabs .tab[data-diff="' + diff + '"]').classList.add('active');

  const list = document.getElementById('rankList');
  list.innerHTML = '<div class="empty">読み込み中...</div>';

  let query;
  if (diff === 'normal') {
    query = client.from('game_rankings').select('*').or('difficulty.eq.normal,difficulty.is.null').order('score', { ascending: false }).limit(10);
  } else {
    query = client.from('game_rankings').select('*').eq('difficulty', diff).order('score', { ascending: false }).limit(10);
  }

  const { data } = await query;
  if (!data || data.length === 0) {
    list.innerHTML = '<div class="empty">まだ記録がありません</div>';
    return;
  }
  renderRankList(data);
}

function renderRankList(data) {
  const list = document.getElementById('rankList');
  list.innerHTML = '';
  data.forEach((r, i) => {
    const rank = i + 1;
    const cls = rank <= 3 ? ' rank-' + rank : '';
    const medal = rank === 1 ? '\u{1F947}' : rank === 2 ? '\u{1F948}' : rank === 3 ? '\u{1F949}' : rank;
    const d = new Date(r.created_at);
    const dateStr = d.toLocaleDateString('ja-JP') + ' ' + d.toLocaleTimeString('ja-JP', { hour:'2-digit', minute:'2-digit' });
    const delBtn = isAdmin ? '<button onclick="deleteRankEntry(\'' + r.id + '\')" style="border:none;background:none;color:#e53935;font-size:1em;cursor:pointer;opacity:0.5;padding:4px;">🗑</button>' : '';
    list.innerHTML += '<div class="rank-row"><div class="rank-num' + cls + '">' + medal + '</div><div class="rank-info"><div class="rank-name">' + r.name + '</div><div class="rank-date">' + dateStr + '</div></div><div class="rank-score">' + r.score.toLocaleString() + '</div>' + delBtn + '</div>';
  });
}

async function deleteRankEntry(id) {
  if (!confirm('このランキングデータを削除しますか？')) return;
  try {
    await client.from(lastLoadedTable).delete().eq('id', id);
    // リロード
    if (lastLoadedTable === 'custom_rankings') {
      loadCustomRanking(lastLoadedPresetId);
    } else {
      loadRanking(lastLoadedDiff);
    }
  } catch(e) { alert('削除に失敗しました'); }
}

loadRanking('normal');

// カスタムモード解放済みならタブ表示
if (localStorage.getItem('puyo_custom_unlocked') === 'true') {
  document.getElementById('customModeTab').style.display = '';
}
</script>
</body>
</html>
