<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<title>&#x1F3B0; ポーカーチップ管理</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="../js/common.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; padding: 16px; min-height: 100vh; }
.header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.header a { text-decoration: none; font-size: 1.4em; cursor: pointer; color: #eee; }
h1 { font-size: 1.2em; color: #ffd700; }
.total-info { text-align: center; background: #16213e; border-radius: 12px; padding: 12px; margin-bottom: 16px; }
.total-info span { font-size: 0.9em; color: #aaa; }
.player-card { background: #16213e; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.player-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.player-name { font-size: 1.1em; font-weight: 600; flex: 1; }
.player-chips { font-size: 1.3em; font-weight: 700; color: #ffd700; }
.player-chips.negative { color: #ff4444; }
.player-icons { display: flex; gap: 4px; margin-left: 8px; }
.player-icons button { background: none; border: none; font-size: 1.2em; cursor: pointer; padding: 2px 4px; }
.chip-controls { display: flex; gap: 6px; flex-wrap: wrap; }
.chip-btn { border: none; border-radius: 8px; padding: 8px 12px; font-size: 0.85em; font-weight: 600; cursor: pointer; transition: transform 0.1s; }
.chip-btn:active { transform: scale(0.95); }
.chip-btn.minus { background: #ff4444; color: #fff; }
.chip-btn.plus { background: #4caf50; color: #fff; }
.chip-btn.minus500 { background: #cc0000; color: #fff; }
.chip-btn.custom { background: #2196f3; color: #fff; }
.actions { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
.action-btn { border: none; border-radius: 8px; padding: 10px 16px; font-size: 0.9em; font-weight: 600; cursor: pointer; }
.action-btn.reset { background: #ff9800; color: #fff; }
.overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 100; justify-content: center; align-items: center; }
.overlay.active { display: flex; }
.modal { background: #16213e; border-radius: 16px; padding: 24px; width: 90%; max-width: 340px; }
.modal h2 { margin-bottom: 16px; font-size: 1.1em; color: #ffd700; text-align: center; }
.modal input { width: 100%; padding: 12px; border: 1px solid #333; border-radius: 8px; font-size: 1.1em; text-align: center; background: #0f3460; color: #eee; margin-bottom: 12px; }
.modal-btns { display: flex; gap: 8px; }
.modal-btns button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 1em; font-weight: 600; cursor: pointer; }
.btn-ok { background: #4caf50; color: #fff; }
.btn-cancel { background: #555; color: #eee; }
.btn-danger { background: #ff4444; color: #fff; }
.readonly-notice { text-align: center; background: #333; border-radius: 8px; padding: 10px; margin-bottom: 16px; font-size: 0.85em; color: #ffab40; }
.loading { text-align: center; color: #888; margin-top: 40px; }
.graph-wrap { display: none; margin-top: 10px; background: #0f3460; border-radius: 8px; padding: 10px; }
.graph-wrap.open { display: block; }
.graph-wrap canvas { width: 100%; height: 140px; display: block; }
</style>
</head>
<body>
<div class="header">
  <a class="back" onclick="history.back()">&#x2190;</a>
  <h1>&#x1F3B0; ポーカーチップ</h1>
  <a class="home" href="../index.html">&#x1F3E0;</a>
</div>

<div class="total-info">
  <span>チップ合計: <strong id="totalChips">-</strong> / 開始時: <strong id="startTotal">10,000</strong></span>
</div>

<div id="readonlyNotice" class="readonly-notice" style="display:none;">
  &#x1F512; 閲覧専用（チップ操作はadmin端末から）
</div>

<div id="adminActions" class="actions" style="display:none;">
  <button class="action-btn reset" onclick="resetAll()">全員リセット (2000)</button>
</div>

<div id="players"><div class="loading">読み込み中...</div></div>

<!-- カスタム増減モーダル -->
<div class="overlay" id="customModal">
  <div class="modal">
    <h2 id="customTitle">チップ増減</h2>
    <input type="number" id="customAmount" placeholder="チップ数" inputmode="numeric">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeCustom()">キャンセル</button>
      <button class="btn-danger" onclick="applyCustom(-1)">減らす</button>
      <button class="btn-ok" onclick="applyCustom(1)">増やす</button>
    </div>
  </div>
</div>

<script>
const PLAYERS = ['りょうすけ', 'めぐみ', 'はるちか', 'いろは', 'かいせい'];
const START_CHIPS = 2000;
let chipData = {};
let customTarget = null;

async function init() {
  if (isAdmin) {
    document.getElementById('adminActions').style.display = 'flex';
  } else {
    document.getElementById('readonlyNotice').style.display = 'block';
  }
  await loadChips();
}

async function loadChips() {
  const { data, error } = await client.from('poker_chips')
    .select('player_name, chips')
    .order('id');
  if (error) { console.error(error); return; }
  chipData = {};
  data.forEach(r => chipData[r.player_name] = r.chips);
  render();
}

async function changeChips(name, amount) {
  if (!isAdmin) return;
  const newChips = (chipData[name] || 0) + amount;
  const { error } = await client.from('poker_chips')
    .update({ chips: newChips, updated_at: new Date().toISOString() })
    .eq('player_name', name);
  if (error) { alert('エラー: ' + error.message); return; }
  await client.from('poker_chips_history').insert({
    player_name: name, amount, chips_after: newChips
  });
  chipData[name] = newChips;
  render();
}

async function resetAll() {
  if (!isAdmin) return;
  if (!confirm('全員を2000チップにリセットしますか？')) return;
  for (const name of PLAYERS) {
    await client.from('poker_chips')
      .update({ chips: START_CHIPS, updated_at: new Date().toISOString() })
      .eq('player_name', name);
  }
  await client.from('poker_chips_history').insert({
    player_name: '全員リセット', amount: 0, chips_after: START_CHIPS
  });
  await loadChips();
}

function openCustom(name) {
  if (!isAdmin) return;
  customTarget = name;
  document.getElementById('customTitle').textContent = name + ' のチップ増減';
  document.getElementById('customAmount').value = '';
  document.getElementById('customModal').classList.add('active');
  document.getElementById('customAmount').focus();
}

function closeCustom() {
  document.getElementById('customModal').classList.remove('active');
  customTarget = null;
}

async function applyCustom(sign) {
  const val = parseInt(document.getElementById('customAmount').value);
  if (!val || val <= 0) return;
  await changeChips(customTarget, val * sign);
  closeCustom();
}

function goHistory(name) {
  location.href = 'poker-chips-history.html?player=' + encodeURIComponent(name);
}

function render() {
  const container = document.getElementById('players');
  let total = 0;
  container.innerHTML = PLAYERS.map(name => {
    const chips = chipData[name] ?? START_CHIPS;
    total += chips;
    const negCls = chips < 0 ? ' negative' : '';
    const controls = isAdmin ? `
      <div class="chip-controls">
        <button class="chip-btn minus500" onclick="changeChips('${name}', -500)">-500</button>
        <button class="chip-btn minus" onclick="changeChips('${name}', -100)">-100</button>
        <button class="chip-btn plus" onclick="changeChips('${name}', +100)">+100</button>
        <button class="chip-btn plus" onclick="changeChips('${name}', +500)">+500</button>
        <button class="chip-btn custom" onclick="openCustom('${name}')">自由入力</button>
      </div>` : '';
    return `
      <div class="player-card">
        <div class="player-header">
          <span class="player-name">${name}</span>
          <span class="player-chips${negCls}">${chips.toLocaleString()}</span>
          <div class="player-icons">
            <button onclick="goHistory('${name}')">&#x1F4C8;</button>
          </div>
        </div>
        ${controls}
      </div>`;
  }).join('');
  document.getElementById('totalChips').textContent = total.toLocaleString();
  document.getElementById('startTotal').textContent = (START_CHIPS * PLAYERS.length).toLocaleString();
}

init();
</script>
</body>
</html>
