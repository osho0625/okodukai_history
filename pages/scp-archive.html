<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4caf50">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../images/2728.png">
<title>SCP閲覧記録</title>
<script src="../data/scp-list.js"></script>
<script src="../js/scp-selector.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; max-width: 520px; margin: 0 auto; }
.back { display: inline-block; margin-bottom: 16px; color: #333; text-decoration: none; font-size: 1.6em; line-height: 1; padding: 8px 12px; cursor: pointer; }
.back:hover { opacity: 0.6; }
h1 { text-align: center; margin-bottom: 20px; color: #333; font-size: 1.3em; }
.progress { text-align: center; font-size: 0.85em; color: #888; margin-bottom: 16px; }
.item {
  display: flex; align-items: center; gap: 10px; padding: 12px 14px;
  border-radius: 10px; margin-bottom: 8px;
}
a.item.viewed {
  text-decoration: none; color: inherit;
}
.item.viewed {
  background: #fff; border: 1px solid #eee; cursor: pointer;
  box-shadow: 0 1px 4px rgba(0,0,0,0.04);
}
.item.viewed:hover { border-color: #ccc; }
.item.locked {
  background: #f0f0f0; border: 1px solid #e0e0e0; opacity: 0.7;
}
</style>
</head>
<body>
<a class="back" onclick="history.back()">←</a>
<a href="../index.html" style="color:#333;text-decoration:none;font-size:1.4em;position:absolute;top:20px;right:20px;">🏠</a>
<h1>📋 SCP閲覧記録</h1>
<div class="progress" id="progress"></div>
<div id="archiveList"></div>

<script>
var scpData = window.SCP_DATA || [];
var isAdmin = localStorage.getItem('deviceRole') === 'admin';

function getScpViewed() {
  try { return JSON.parse(localStorage.getItem('scp_viewed') || '[]'); }
  catch(e) { return []; }
}

function render() {
  var list = document.getElementById('archiveList');
  var rawViewed = getScpViewed();

  // Normalize viewed list: only keep IDs that exist in scpData
  var viewed = rawViewed.filter(function(id) {
    return scpData.some(function(s) { return s.id === id; });
  });

  list.innerHTML = '';

  // Display read rate as percentage
  var rate = calcReadRate(scpData, viewed);
  document.getElementById('progress').textContent = Math.round(rate * 100) + '% 読了（' + viewed.length + ' / ' + scpData.length + '）';

  // ソート: 無印SCP(番号順) → JP(番号順) → Tale
  var sorted = scpData.slice().sort(function(a, b) {
    var aIsJp = a.id.indexOf('-jp') !== -1;
    var bIsJp = b.id.indexOf('-jp') !== -1;
    var aIsTale = a.id.indexOf('tale') === 0;
    var bIsTale = b.id.indexOf('tale') === 0;
    // Tale は最後
    if (aIsTale && !bIsTale) return 1;
    if (!aIsTale && bIsTale) return -1;
    if (aIsTale && bIsTale) return 0;
    // JP は無印の後
    if (aIsJp && !bIsJp) return 1;
    if (!aIsJp && bIsJp) return -1;
    // 同カテゴリ内は番号順
    var aNum = parseInt((a.id.match(/\d+/) || ['0'])[0], 10);
    var bNum = parseInt((b.id.match(/\d+/) || ['0'])[0], 10);
    return aNum - bNum;
  });

  sorted.forEach(function(item) {
    var isViewed = viewed.indexOf(item.id) !== -1;

    // admin は全て閲覧可能
    if (isViewed || isAdmin) {
      var a = document.createElement('a');
      a.className = 'item viewed';
      a.href = item.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.setAttribute('data-scp-id', item.id);
      a.onclick = function(e) {
        var id = this.getAttribute('data-scp-id');
        var url = this.href;
        if (id === 'scp-040-jp') {
          e.preventDefault();
          showMemeWarning(url, function() {
            var v = getScpViewed();
            if (v.indexOf(id) === -1) {
              v.push(id);
              localStorage.setItem('scp_viewed', JSON.stringify(v));
            }
          });
          return false;
        }
        var v = getScpViewed();
        if (v.indexOf(id) === -1) {
          v.push(id);
          localStorage.setItem('scp_viewed', JSON.stringify(v));
        }
      };
      var icon = isViewed ? '✅' : '👁️';
      a.innerHTML = '<span style="font-size:1.1em;">' + icon + '</span>'
        + '<span style="flex:1; font-size:0.9em; color:#333;">' + item.number + ' - ' + item.title + '</span>'
        + '<span style="color:#ccc; font-size:1em;">▶</span>';
      list.appendChild(a);
    } else {
      var div = document.createElement('div');
      div.className = 'item locked';
      div.innerHTML = '<span style="font-size:1.1em;">🔒</span>'
        + '<span style="flex:1; font-size:0.9em; color:#aaa;">' + item.number + ' - ？？？</span>';
      list.appendChild(div);
    }
  });
}

render();
</script>
<script src="../js/neko-meme-warning.js"></script>
</body>
</html>
