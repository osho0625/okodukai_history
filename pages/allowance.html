<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4caf50">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../images/2728.png">
<title>お小遣い管理 - お小遣い手帳</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
.back { display: inline-block; margin-bottom: 16px; color: #333; text-decoration: none; font-size: 1.6em; line-height: 1; padding: 8px 12px; }
.back:hover { opacity: 0.6; }
h1 { text-align: center; margin-bottom: 20px; color: #333; }
.section-title { font-weight: 600; color: #555; margin-bottom: 12px; text-align: center; }
.child-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 24px; max-width: 480px; margin-left: auto; margin-right: auto; }
.child-btn {
  padding: 12px 20px; border: 2px solid #ddd; border-radius: 10px;
  background: #fff; font-size: 1.05em; font-weight: 600; cursor: pointer; transition: all 0.15s;
}
.child-btn:hover { border-color: #4caf50; color: #4caf50; }
.child-btn.active { background: #4caf50; color: #fff; border-color: #4caf50; }
.form-section {
  display: none; max-width: 480px; margin: 0 auto;
  background: #fff; border-radius: 12px; padding: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px;
}
.form-section input {
  width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ddd;
  border-radius: 8px; font-size: 1em;
}
.btn-row { display: flex; gap: 8px; }
.btn {
  flex: 1; padding: 12px; border: none; border-radius: 8px;
  font-size: 1em; font-weight: 600; cursor: pointer; color: #fff;
}
.btn-add { background: #4caf50; }
.btn-use { background: #ff9800; }
.btn:hover { opacity: 0.9; }
.result {
  text-align: center; padding: 16px; margin: 0 auto; max-width: 480px;
  background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: none;
}
.result .msg { font-size: 1.1em; font-weight: 600; color: #4caf50; }
.result .balance { font-size: 0.9em; color: #888; margin-top: 4px; }
</style>
</head>
<body>
<a class="back" href="../index.html">&#x2190;</a>
<h1>&#x1F9F9; お小遣い管理</h1>
<div class="section-title">だれに？</div>
<div class="child-btns" id="childBtns"></div>
<div class="form-section" id="formSection">
  <input type="number" id="amount" placeholder="金額" min="0">
  <input type="text" id="memo" placeholder="メモ（例: おやつ代）">
  <div class="btn-row">
    <button class="btn btn-add" onclick="doTransaction('add')">＋ 入金</button>
    <button class="btn btn-use" onclick="doTransaction('use')">－ 出金</button>
  </div>
</div>
<div class="result" id="result">
  <div class="msg" id="resultMsg"></div>
  <div class="balance" id="resultBalance"></div>
</div>

<script>
const SUPABASE_URL = "https://ynecezxnltigplrfzzoh.supabase.co";
const SUPABASE_KEY = "sb_publishable_seKZakec1yB046vlgPDAKQ_zd4CKIg4";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const DISCORD_WEBHOOK = 'https://discord.com/api/webhooks/1498552364905529355/6I3vultTaQcYNRjPP76ZtyyyGLG1JWdU7eX3IfMtpGCUWR3sdw2Gn3_pNxHgaS-z9iyG';

function savePendingDeposit(childId, oldBalance, newBalance, amount) {
  const key = 'pending_deposit_' + childId;
  const existing = localStorage.getItem(key);
  if (existing) {
    const prev = JSON.parse(existing);
    prev.newBalance = newBalance;
    prev.totalAmount += amount;
    localStorage.setItem(key, JSON.stringify(prev));
  } else {
    localStorage.setItem(key, JSON.stringify({ oldBalance, newBalance, totalAmount: amount }));
  }
}

let allChildren = [];
let selectedChildId = null;

// 返済用アカウント判定（「〇〇が返すお金」パターン）
function isRepaymentAccount(name) { return name.endsWith('が返すお金'); }
function findRepaymentFor(name) {
  return allChildren.find(c => c.name === name + 'が返すお金') || null;
}

async function load() {
  const { data } = await client.from('children').select('*').order('sort_order', { ascending: true });
  allChildren = data || [];
  const container = document.getElementById('childBtns');
  container.innerHTML = '';
  data.filter(c => !isRepaymentAccount(c.name)).forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'child-btn';
    btn.textContent = c.name;
    btn.addEventListener('click', () => selectChild(c.id, btn));
    container.appendChild(btn);
  });
}

function selectChild(id, btn) {
  selectedChildId = id;
  document.querySelectorAll('.child-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('formSection').style.display = 'block';
  document.getElementById('result').style.display = 'none';
}

async function doTransaction(type) {
  if (!selectedChildId) return;
  const amount = parseInt(document.getElementById('amount').value);
  const memo = document.getElementById('memo').value;
  if (!amount || amount <= 0) return alert('金額を入力してください');

  const child = allChildren.find(c => c.id === selectedChildId);
  if (!child) return;

  const repaymentChild = findRepaymentFor(child.name);
  const hasRepayment = repaymentChild && type === 'add';

  if (hasRepayment) {
    const half = Math.floor(amount / 2);
    const remainder = amount - half;
    const newBal = child.balance + remainder;
    savePendingDeposit(child.id, child.balance, newBal, remainder);
    await client.from('children').update({ balance: newBal }).eq('id', child.id);
    await client.from('transactions').insert({ child_id: child.id, type: 'add', amount: remainder, memo: memo || '入金' });
    const debtNew = repaymentChild.balance + half;
    savePendingDeposit(repaymentChild.id, repaymentChild.balance, debtNew, half);
    await client.from('children').update({ balance: debtNew }).eq('id', repaymentChild.id);
    await client.from('transactions').insert({ child_id: repaymentChild.id, type: 'add', amount: half, memo: (memo || '入金') + '（' + child.name + '分）' });
    child.balance = newBal; repaymentChild.balance = debtNew;
    try { await fetch(DISCORD_WEBHOOK, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ content: '\u{1F4B0} **' + child.name + '** に ' + amount + '円\n→ ' + child.name + ': ' + remainder + '円 / 返済: ' + half + '円' }) }); } catch(e) {}
    showResult(child.name + ' に ' + amount + '円 入金', child.name + ': ' + newBal.toLocaleString() + '円 / 返済: ' + debtNew.toLocaleString() + '円');
  } else {
    const diff = type === 'add' ? amount : -amount;
    const newBal = child.balance + diff;
    if (type === 'add') savePendingDeposit(child.id, child.balance, newBal, amount);
    await client.from('children').update({ balance: newBal }).eq('id', selectedChildId);
    await client.from('transactions').insert({ child_id: selectedChildId, type, amount, memo: memo || (type === 'add' ? '入金' : '出金') });
    child.balance = newBal;
    const emoji = type === 'add' ? '\u{1F4B0}' : '\u{1F4B8}';
    const action = type === 'add' ? '入金' : '出金';
    try { await fetch(DISCORD_WEBHOOK, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ content: emoji + ' **' + child.name + '** ' + amount + '円 ' + action + '\n残高: ' + newBal.toLocaleString() + '円' }) }); } catch(e) {}
    showResult(child.name + ' に ' + amount + '円 ' + action, '残高: ' + newBal.toLocaleString() + '円');
  }
  document.getElementById('amount').value = '';
  document.getElementById('memo').value = '';
}

function showResult(msg, bal) {
  document.getElementById('resultMsg').textContent = msg;
  document.getElementById('resultBalance').textContent = bal;
  document.getElementById('result').style.display = 'block';
}

load();
</script>
</body>
</html>
