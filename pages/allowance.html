<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4caf50">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../images/2728.png">
<title>お小遣い - お小遣い手帳</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
.back { display: inline-block; margin-bottom: 16px; color: #333; text-decoration: none; font-size: 1.6em; line-height: 1; padding: 8px 12px; }
.back:hover { opacity: 0.6; }
h1 { text-align: center; margin-bottom: 20px; color: #333; }
.section-title { font-weight: 600; color: #555; margin-bottom: 12px; text-align: center; }

.child-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 24px; max-width: 480px; margin-left: auto; margin-right: auto; }
.child-btn {
  padding: 12px 20px; border: 2px solid #ddd; border-radius: 10px;
  background: #fff; font-size: 1.05em; font-weight: 600; cursor: pointer;
  transition: all 0.15s;
}
.child-btn:hover { border-color: #4caf50; color: #4caf50; }
.child-btn.active { background: #4caf50; color: #fff; border-color: #4caf50; }

.amount-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 24px; max-width: 480px; margin-left: auto; margin-right: auto; }
.amount-btn {
  padding: 14px 0; width: calc(50% - 5px); border: none; border-radius: 12px;
  font-size: 1.2em; font-weight: 700; cursor: pointer; color: #fff;
  transition: transform 0.1s, opacity 0.1s;
}
.amount-btn:active { transform: scale(0.95); }
.amount-btn:disabled { opacity: 0.4; cursor: default; }
.amount-btn.a40 { background: #78909c; }
.amount-btn.a100 { background: #42a5f5; }
.amount-btn.a200 { background: #66bb6a; }
.amount-btn.a300 { background: #ffa726; }
.amount-btn.a400 { background: #ef5350; }

.result {
  text-align: center; padding: 16px; margin: 0 auto; max-width: 480px;
  background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  display: none;
}
.result .msg { font-size: 1.1em; font-weight: 600; color: #4caf50; }
.result .balance { font-size: 0.9em; color: #888; margin-top: 4px; }

@media (max-width: 520px) {
  body { padding: 12px; }
  .amount-btn { font-size: 1.1em; padding: 12px 0; }
}
</style>
</head>
<body>

<a class="back" href="../index.html">&#x2190;</a>
<h1>&#x1F9F9; お手伝いポイント</h1>

<div class="section-title">だれに？</div>
<div class="child-btns" id="childBtns"></div>

<div class="section-title">いくら？</div>
<div class="amount-btns" id="amountBtns">
  <button class="amount-btn a40" onclick="addAllowance(40)" disabled>40円</button>
  <button class="amount-btn a100" onclick="addAllowance(100)" disabled>100円</button>
  <button class="amount-btn a200" onclick="addAllowance(200)" disabled>200円</button>
  <button class="amount-btn a300" onclick="addAllowance(300)" disabled>300円</button>
  <button class="amount-btn a400" onclick="addAllowance(400)" disabled>400円</button>
</div>

<div class="result" id="result">
  <div class="msg" id="resultMsg"></div>
  <div class="balance" id="resultBalance"></div>
</div>

<script>
const SUPABASE_URL = "https://ynecezxnltigplrfzzoh.supabase.co";
const SUPABASE_KEY = "sb_publishable_seKZakec1yB046vlgPDAKQ_zd4CKIg4";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DISCORD_WEBHOOK = 'https://discord.com/api/webhooks/1498552364905529355/6I3vultTaQcYNRjPP76ZtyyyGLG1JWdU7eX3IfMtpGCUWR3sdw2Gn3_pNxHgaS-z9iyG';

// 未読入金情報をlocalStorageに保存（複数回入金を累積）
function savePendingDeposit(childId, oldBalance, newBalance, amount) {
  const key = 'pending_deposit_' + childId;
  const existing = localStorage.getItem(key);
  if (existing) {
    // 既に未読がある場合、最初のoldBalanceを維持しつつnewBalanceを更新
    const prev = JSON.parse(existing);
    prev.newBalance = newBalance;
    prev.totalAmount += amount;
    localStorage.setItem(key, JSON.stringify(prev));
  } else {
    localStorage.setItem(key, JSON.stringify({ oldBalance, newBalance, totalAmount: amount }));
  }
}

let allChildren = [];
let selectedChildId = null;
let irohaDebtChild = null; // いろはの借金アカウント

async function load() {
  const { data } = await client.from('children').select('*').order('sort_order', { ascending: true });
  allChildren = data || [];
  const container = document.getElementById('childBtns');
  container.innerHTML = '';

  // 「いろはの借金」を記憶しつつ、ボタンには表示しない
  irohaDebtChild = allChildren.find(c => c.name === 'いろはの借金') || null;

  data.filter(c => c.name !== 'いろはの借金').forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'child-btn';
    btn.textContent = c.name;
    btn.dataset.id = c.id;
    btn.addEventListener('click', () => selectChild(c.id, btn));
    container.appendChild(btn);
  });
}

function selectChild(id, btn) {
  selectedChildId = id;
  document.querySelectorAll('.child-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.amount-btn').forEach(b => b.disabled = false);
  document.getElementById('result').style.display = 'none';
}

async function addAllowance(amount) {
  if (!selectedChildId) return;
  const child = allChildren.find(c => c.id === selectedChildId);
  if (!child) return;

  // ボタンを一時無効化
  document.querySelectorAll('.amount-btn').forEach(b => b.disabled = true);

  // いろは選択時: 借金アカウントがあれば半分ずつ振り分け、なければ全額いろはへ
  const isIroha = child.name === 'いろは' && irohaDebtChild;
  if (isIroha) {
    const half = Math.floor(amount / 2);
    const remainder = amount - half; // 奇数の場合、いろは本体に1円多く

    // いろは本体
    const newBalance = child.balance + remainder;
    // 未読入金情報を保存（演出用）
    savePendingDeposit(child.id, child.balance, newBalance, remainder);
    await client.from('children').update({ balance: newBalance }).eq('id', child.id);
    await client.from('transactions').insert({
      child_id: child.id, type: 'add', amount: remainder, memo: 'お手伝いポイント'
    });

    // いろはの借金
    const debtNewBalance = irohaDebtChild.balance + half;
    savePendingDeposit(irohaDebtChild.id, irohaDebtChild.balance, debtNewBalance, half);
    await client.from('children').update({ balance: debtNewBalance }).eq('id', irohaDebtChild.id);
    await client.from('transactions').insert({
      child_id: irohaDebtChild.id, type: 'add', amount: half, memo: 'お手伝いポイント（いろは分）'
    });

    // Discord通知
    try {
      await fetch(DISCORD_WEBHOOK, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ content: '\u{1F4B0} **いろは** に ' + amount + '円 お小遣い！\n　→ いろは: ' + remainder + '円（残高: ' + newBalance.toLocaleString() + '円）\n　→ いろはの借金: ' + half + '円（残高: ' + debtNewBalance.toLocaleString() + '円）' })
      });
    } catch(e) {}

    // ローカルデータ更新
    child.balance = newBalance;
    irohaDebtChild.balance = debtNewBalance;

    // 結果表示
    const result = document.getElementById('result');
    document.getElementById('resultMsg').textContent = 'いろは に ' + amount + '円 あげた！';
    document.getElementById('resultBalance').textContent = 'いろは: ' + newBalance.toLocaleString() + '円 / 借金返済: ' + debtNewBalance.toLocaleString() + '円';
    result.style.display = 'block';
  } else {
    // 通常処理
    const newBalance = child.balance + amount;
    // 未読入金情報を保存（演出用）
    savePendingDeposit(child.id, child.balance, newBalance, amount);
    await client.from('children').update({ balance: newBalance }).eq('id', selectedChildId);
    await client.from('transactions').insert({
      child_id: selectedChildId, type: 'add', amount, memo: 'お手伝いポイント'
    });

    // Discord通知
    try {
      await fetch(DISCORD_WEBHOOK, {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ content: '\u{1F4B0} **' + child.name + '** に ' + amount + '円 お小遣い！\n\u{1F4B3} 残高: ' + newBalance.toLocaleString() + '円' })
      });
    } catch(e) {}

    // ローカルデータ更新
    child.balance = newBalance;

    // 結果表示
    const result = document.getElementById('result');
    document.getElementById('resultMsg').textContent = child.name + ' に ' + amount + '円 あげた！';
    document.getElementById('resultBalance').textContent = '残高: ' + newBalance.toLocaleString() + '円';
    result.style.display = 'block';
  }

  // ボタン再有効化
  setTimeout(() => {
    document.querySelectorAll('.amount-btn').forEach(b => b.disabled = false);
  }, 500);
}

load();
</script>
</body>
</html>
