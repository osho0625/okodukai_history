<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<meta name="theme-color" content="#111">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>🍉 すいかが食べたい</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: #111; color: #e0e0e0; font-family: 'Segoe UI', sans-serif;
  height: 100%; overflow: hidden;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
}
body {
  display: flex; flex-direction: column; align-items: center;
  height: 100vh; height: 100dvh;
}
.header {
  display: flex; align-items: center; width: 100%; max-width: 420px;
  padding: 6px 10px; gap: 8px; flex-shrink: 0;
}
.back { color: #eee; text-decoration: none; font-size: 1.5em; cursor: pointer; }
.header h1 { font-size: 1em; font-weight: 600; }
.home-link { color: #eee; text-decoration: none; font-size: 1.3em; margin-left: auto; }

.game-wrap {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: flex-start; width: 100%; padding: 4px 10px 0;
  min-height: 0;
}
canvas {
  border: 2px solid #333;
  image-rendering: pixelated;
  max-width: 100%;
  width: 400px;
  height: auto;
  aspect-ratio: 400 / 320;
}
.info {
  margin-top: 4px; font-size: 0.65rem; color: #555; text-align: center;
}

/* On touch devices, shrink canvas to leave room for controls */
@media (pointer: coarse) {
  .game-wrap {
    justify-content: flex-start;
    padding-top: 2px;
  }
  canvas {
    max-height: calc(100dvh - 220px);
    width: auto;
  }
}
</style>
</head>
<body>
<div class="header">
  <a class="back" onclick="history.back()">←</a>
  <h1>🍉 すいかが食べたい</h1>
  <a class="home-link" href="arcade.html">🕹️</a>
</div>

<div class="game-wrap">
  <canvas id="game" width="400" height="320"></canvas>
  <p class="info">矢印:移動 / Enter:決定 / X:キャンセル / Z:メニュー / A/S:カメラ</p>
</div>

<script type="module" src="../suika/web/main.js"></script>
</body>
</html>
