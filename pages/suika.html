<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#111">
<title>🍉 すいかが食べたい</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #111; color: #e0e0e0; font-family: 'Segoe UI', sans-serif;
  display: flex; flex-direction: column; align-items: center;
  height: 100vh; height: 100dvh; overflow: hidden;
}
.header {
  display: flex; align-items: center; width: 100%; max-width: 420px;
  padding: 8px 10px; gap: 8px;
}
.back { color: #eee; text-decoration: none; font-size: 1.5em; cursor: pointer; }
.header h1 { font-size: 1em; font-weight: 600; }
.home-link { color: #eee; text-decoration: none; font-size: 1.3em; margin-left: auto; }

.game-wrap {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; width: 100%; padding: 0 10px;
}
canvas {
  border: 2px solid #333;
  image-rendering: pixelated;
  max-width: 100%;
  max-height: calc(100vh - 100px);
}
.info {
  margin-top: 6px; font-size: 0.7rem; color: #666; text-align: center;
}
</style>
</head>
<body>
<div class="header">
  <a class="back" onclick="history.back()">←</a>
  <h1>🍉 すいかが食べたい</h1>
  <a class="home-link" href="arcade.html">🕹️</a>
</div>

<div class="game-wrap">
  <canvas id="game" width="400" height="320"></canvas>
  <p class="info">矢印キー: 移動 / Enter: 決定 / X: キャンセル / A/S: カメラ / B: 戦闘テスト</p>
</div>

<script type="module" src="../suika/web/main.js"></script>
</body>
</html>
