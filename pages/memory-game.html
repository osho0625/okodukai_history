<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1a2e">
<title>🃏 神経衰弱</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
  min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  color: #eee; padding: 12px; user-select: none;
}
.header {
  display: flex; align-items: center; gap: 12px;
  width: 100%; max-width: 420px; margin-bottom: 12px;
}
.back { color: #eee; text-decoration: none; font-size: 1.6em; cursor: pointer; }
.home { color: #eee; text-decoration: none; font-size: 1.4em; margin-left: auto; }
h1 { font-size: 1.3em; font-weight: 700; }

/* タイトル画面 */
#titleScreen {
  display: flex; flex-direction: column; align-items: center; gap: 20px;
  margin-top: 40px; text-align: center;
}
#titleScreen .title-icon { font-size: 4em; }
#titleScreen h2 { font-size: 1.6em; }
#titleScreen p { color: #aaa; font-size: 0.9em; max-width: 320px; line-height: 1.6; }
.btn {
  padding: 14px 32px; border: none; border-radius: 12px;
  font-size: 1.1em; font-weight: 600; cursor: pointer;
  transition: transform 0.1s, box-shadow 0.1s;
}
.btn:active { transform: scale(0.96); }
.btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; box-shadow: 0 4px 16px rgba(102,126,234,0.3); }
.btn-secondary { background: rgba(255,255,255,0.1); color: #eee; border: 1px solid rgba(255,255,255,0.2); }
.difficulty-btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

/* ゲーム画面 */
#gameScreen { display: none; width: 100%; max-width: 420px; }
.status-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px; padding: 8px 14px;
  background: rgba(255,255,255,0.05); border-radius: 12px;
  font-size: 0.85em;
}
.status-bar .moves { color: #aaa; }
.status-bar .pairs { color: #8be9fd; font-weight: 600; }
.status-bar .timer { color: #f1fa8c; }

/* カードグリッド */
.card-grid {
  display: grid; gap: 8px; justify-content: center;
  margin: 0 auto;
}
.card-grid.grid-4x3 { grid-template-columns: repeat(4, 1fr); max-width: 340px; }
.card-grid.grid-4x4 { grid-template-columns: repeat(4, 1fr); max-width: 340px; }
.card-grid.grid-6x4 { grid-template-columns: repeat(6, 1fr); max-width: 420px; gap: 6px; }

.card {
  aspect-ratio: 1; border-radius: 12px; cursor: pointer;
  position: relative; perspective: 600px;
  transition: transform 0.1s;
}
.card:active:not(.flipped):not(.matched) { transform: scale(0.95); }
.card.matched { pointer-events: none; }
.card.flipped .card-inner { transform: rotateY(180deg); }
.card.matched .card-inner { transform: rotateY(180deg); }
.card.matched .card-front { animation: matchPop 0.3s ease; }

@keyframes matchPop {
  0% { transform: rotateY(180deg) scale(1); }
  50% { transform: rotateY(180deg) scale(1.15); }
  100% { transform: rotateY(180deg) scale(1); }
}

.card-inner {
  width: 100%; height: 100%; position: relative;
  transition: transform 0.4s ease;
  transform-style: preserve-3d;
}
.card-face {
  position: absolute; inset: 0; border-radius: 12px;
  display: flex; align-items: center; justify-content: center;
  backface-visibility: hidden;
}
.card-back {
  background: linear-gradient(135deg, #4a5568, #2d3748);
  border: 2px solid rgba(255,255,255,0.15);
  font-size: 1.6em;
}
.card-back::after {
  content: ''; position: absolute; inset: 6px;
  border: 1px dashed rgba(255,255,255,0.12); border-radius: 8px;
}
.card-front {
  background: rgba(255,255,255,0.1);
  border: 2px solid rgba(139,233,253,0.3);
  transform: rotateY(180deg);
  font-size: 1.8em;
}
.card.matched .card-front {
  background: rgba(80,250,123,0.15);
  border-color: rgba(80,250,123,0.4);
}

/* むずいモードでカードの絵文字を少し小さく */
.grid-6x4 .card-front { font-size: 1.4em; }
.grid-6x4 .card-back { font-size: 1.2em; }

/* ゲーム中ボタン */
.game-actions {
  display: flex; justify-content: center; margin-top: 16px;
}

/* 結果画面 */
#resultScreen {
  display: none; flex-direction: column; align-items: center; gap: 16px;
  margin-top: 40px; text-align: center;
}
#resultScreen .result-icon { font-size: 4em; }
#resultScreen h2 { font-size: 1.5em; }
.result-stats { color: #aaa; font-size: 0.95em; line-height: 1.8; }
.result-stats span { color: #8be9fd; font-weight: 600; }
.result-rank { font-size: 1.3em; margin-top: 4px; }

/* 夜間制限 */
.night-block {
  text-align: center; padding: 60px 20px; margin-top: 40px;
}
.night-block .icon { font-size: 4em; margin-bottom: 16px; }
.night-block h2 { margin-bottom: 8px; }
.night-block p { color: #aaa; }
</style>
</head>
<body>
<div class="header">
  <a class="back" id="backBtn">←</a>
  <h1>🃏 神経衰弱</h1>
  <a class="home" id="homeBtn" href="../index.html">🏠</a>
</div>

<div id="nightBlock" class="night-block" style="display:none;">
  <div class="icon">🌙</div>
  <h2>今日はおしまい！</h2>
  <p>また明日ね</p>
</div>

<div id="titleScreen">
  <div class="title-icon">🃏</div>
  <h2>神経衰弱</h2>
  <p>カードをめくって同じ絵柄のペアを見つけよう！<br>最初に少しだけ見えるから覚えてね！</p>
  <div class="difficulty-btns">
    <button class="btn btn-primary" onclick="startGame('easy')">かんたん<br><small>6ペア</small></button>
    <button class="btn btn-primary" onclick="startGame('normal')">ふつう<br><small>8ペア</small></button>
    <button class="btn btn-primary" onclick="startGame('hard')">むずい<br><small>12ペア</small></button>
  </div>
</div>

<div id="gameScreen">
  <div class="status-bar">
    <div class="pairs">🎴 <span id="pairsFound">0</span>/<span id="pairsTotal">0</span></div>
    <div class="timer">⏱️ <span id="timer">0:00</span></div>
    <div class="moves">手数: <span id="moves">0</span></div>
  </div>
  <div class="card-grid" id="cardGrid"></div>
  <div class="game-actions">
    <button class="btn btn-secondary" onclick="confirmQuit()" style="padding:10px 20px;font-size:0.9em;">タイトルに戻る</button>
  </div>
</div>

<div id="resultScreen">
  <div class="result-icon" id="resultIcon">🎉</div>
  <h2>クリア！</h2>
  <div class="result-rank" id="resultRank"></div>
  <div class="result-stats">
    タイム: <span id="resultTime">0:00</span><br>
    手数: <span id="resultMoves">0</span>回<br>
    難易度: <span id="resultDifficulty">ふつう</span>
  </div>
  <div style="display:flex;gap:12px;margin-top:8px;">
    <button class="btn btn-primary" onclick="replay()">もう一回</button>
    <button class="btn btn-secondary" onclick="backToTitle()">タイトル</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="../js/common.js"></script>
<script>
// ←/🏠のナビゲーション（夜間制限時でも動作するようinit外に配置）
let isPlaying = false;
let timerInterval = null;

document.getElementById('backBtn').addEventListener('click', function(e) {
  e.preventDefault();
  if (isPlaying) {
    confirmLeaveGame(() => isPlaying, null, '前のページ', () => { cleanup(); history.back(); });
  } else {
    history.back();
  }
});
document.getElementById('homeBtn').addEventListener('click', function(e) {
  if (isPlaying) {
    e.preventDefault();
    confirmLeaveGame(() => isPlaying, null, 'ホーム', () => { cleanup(); location.href = '../index.html'; });
  }
  // 非プレイ中はデフォルトのhrefで遷移
});

function cleanup() {
  clearInterval(timerInterval);
  timerInterval = null;
  isPlaying = false;
}

// 夜間制限チェック
if (isNightTime()) {
  document.getElementById('titleScreen').style.display = 'none';
  document.getElementById('nightBlock').style.display = 'block';
} else {
  initGame();
}

function initGame() {
const EMOJIS = ['🐶','🐱','🐼','🦊','🐸','🐵','🦁','🐮','🐷','🐔','🐙','🦋'];

const DIFFICULTY = {
  easy:   { pairs: 6, cols: 4, gridClass: 'grid-4x3' },
  normal: { pairs: 8, cols: 4, gridClass: 'grid-4x4' },
  hard:   { pairs: 12, cols: 6, gridClass: 'grid-6x4' }
};

let currentDifficulty = 'normal';
let cards = [];
let flippedCards = [];
let matchedPairs = 0;
let totalPairs = 0;
let moveCount = 0;
let startTime = 0;
let endTime = 0;
let locked = false;
let mismatchTimer = null;
let peekTimer = null;

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

window.startGame = function(diff) {
  currentDifficulty = diff;
  const cfg = DIFFICULTY[diff];
  totalPairs = cfg.pairs;
  matchedPairs = 0;
  moveCount = 0;
  flippedCards = [];
  locked = false;
  isPlaying = true;
  if (mismatchTimer) { clearTimeout(mismatchTimer); mismatchTimer = null; }

  // カード生成
  const emojis = EMOJIS.slice(0, cfg.pairs);
  cards = shuffle([...emojis, ...emojis]);

  // UI切り替え
  document.getElementById('titleScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'block';
  window.scrollTo(0, 0);

  // ステータス更新
  document.getElementById('pairsFound').textContent = '0';
  document.getElementById('pairsTotal').textContent = totalPairs;
  document.getElementById('moves').textContent = '0';
  document.getElementById('timer').textContent = '0:00';

  // グリッド描画
  const grid = document.getElementById('cardGrid');
  grid.className = 'card-grid ' + cfg.gridClass;
  grid.innerHTML = cards.map((emoji, i) => `
    <div class="card" data-index="${i}" data-emoji="${emoji}" onclick="flipCard(this)">
      <div class="card-inner">
        <div class="card-face card-back">🃏</div>
        <div class="card-face card-front">${emoji}</div>
      </div>
    </div>
  `).join('');

  // 開始時に全カードを一瞬表示して記憶タイム
  locked = true;
  const allCards = grid.querySelectorAll('.card');
  allCards.forEach(c => c.classList.add('flipped'));
  const peekTime = diff === 'easy' ? 2000 : diff === 'normal' ? 1500 : 1200;
  document.getElementById('timer').textContent = '覚えて！';
  peekTimer = setTimeout(() => {
    peekTimer = null;
    allCards.forEach(c => c.classList.remove('flipped'));
    locked = false;
    // タイマーは記憶タイム後に開始
    startTime = Date.now();
    endTime = 0;
    clearInterval(timerInterval);
    timerInterval = setInterval(updateTimer, 1000);
    document.getElementById('timer').textContent = '0:00';
  }, peekTime);
};

function updateTimer() {
  const elapsed = Math.floor((Date.now() - startTime) / 1000);
  const m = Math.floor(elapsed / 60);
  const s = elapsed % 60;
  document.getElementById('timer').textContent = m + ':' + String(s).padStart(2, '0');
}

window.flipCard = function(el) {
  // 不一致待ち中にタップ → 即裏返して次へ進む
  if (locked && mismatchTimer) {
    clearTimeout(mismatchTimer);
    finishMismatch();
  }
  if (locked) return;
  if (el.classList.contains('flipped') || el.classList.contains('matched')) return;
  if (flippedCards.length >= 2) return;

  el.classList.add('flipped');
  flippedCards.push(el);

  if (flippedCards.length === 2) {
    moveCount++;
    document.getElementById('moves').textContent = moveCount;
    checkMatch();
  }
};

function checkMatch() {
  const [a, b] = flippedCards;
  locked = true; // ペア判定中は常にロック

  if (a.dataset.emoji === b.dataset.emoji) {
    // ペア成立 → 少し待ってからmatched付与（演出のため）
    setTimeout(() => {
      a.classList.add('matched');
      b.classList.add('matched');
      flippedCards = [];
      locked = false;
      matchedPairs++;
      document.getElementById('pairsFound').textContent = matchedPairs;
      if (matchedPairs === totalPairs) {
        endTime = Date.now();
        clearInterval(timerInterval);
        isPlaying = false;
        setTimeout(showResult, 400);
      }
    }, 300);
  } else {
    // 不一致 → 900ms待つ or タップで早送り
    mismatchTimer = setTimeout(finishMismatch, 900);
  }
}

function finishMismatch() {
  mismatchTimer = null;
  const [a, b] = flippedCards;
  if (a) a.classList.remove('flipped');
  if (b) b.classList.remove('flipped');
  flippedCards = [];
  locked = false;
}

function showResult() {
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'flex';

  const elapsed = Math.floor((endTime - startTime) / 1000);
  const m = Math.floor(elapsed / 60);
  const s = elapsed % 60;
  document.getElementById('resultTime').textContent = m + ':' + String(s).padStart(2, '0');
  document.getElementById('resultMoves').textContent = moveCount;

  const labels = { easy: 'かんたん', normal: 'ふつう', hard: 'むずい' };
  document.getElementById('resultDifficulty').textContent = labels[currentDifficulty];

  // スコア評価（手数 / ペア数 の比率で判定）
  const ratio = moveCount / totalPairs;
  let rank, icon;
  if (ratio <= 1.2) { rank = '神！完璧！'; icon = '👑'; }
  else if (ratio <= 1.5) { rank = 'すごい！'; icon = '⭐'; }
  else if (ratio <= 2.0) { rank = 'いい感じ！'; icon = '😊'; }
  else if (ratio <= 3.0) { rank = 'まあまあ！'; icon = '🙂'; }
  else { rank = 'がんばろう！'; icon = '💪'; }
  document.getElementById('resultRank').textContent = rank;
  document.getElementById('resultIcon').textContent = icon;
}

window.replay = function() {
  startGame(currentDifficulty);
};

window.backToTitle = function() {
  if (peekTimer) { clearTimeout(peekTimer); peekTimer = null; }
  if (mismatchTimer) { clearTimeout(mismatchTimer); mismatchTimer = null; }
  cleanup();
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'none';
  document.getElementById('titleScreen').style.display = 'flex';
};

window.confirmQuit = function() {
  if (confirm('ゲームを中断してタイトルに戻りますか？')) {
    backToTitle();
  }
};

} // end initGame
</script>
</body>
</html>
