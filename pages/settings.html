<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4caf50">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../images/2728.png">
<title>設定 - お小遣い手帳</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
.back { display: inline-block; margin-bottom: 16px; color: #1976d2; text-decoration: none; }
.back:hover { text-decoration: underline; }
h1 { margin-bottom: 20px; color: #333; }
.setting-card {
  background: #fff; border-radius: 12px; padding: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px;
  width: 100%; max-width: 480px;
}
.setting-item {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 0; cursor: pointer; font-size: 1em;
}
.setting-item + .setting-item { border-top: 1px solid #eee; }
.setting-item input[type="checkbox"] { width: 20px; height: 20px; }
.pw-section { padding-top: 12px; }
.pw-section input {
  width: 100%; padding: 10px; margin-bottom: 10px;
  border: 1px solid #ddd; border-radius: 8px; font-size: 1em;
}
.btn-save {
  width: 100%; padding: 12px; border: none; border-radius: 8px;
  background: #1976d2; color: #fff; font-size: 1em; font-weight: 600; cursor: pointer;
}
.btn-save:hover { opacity: 0.9; }
.msg { color: #4caf50; font-size: 0.9em; margin-top: 8px; display: none; }
@media (max-width: 520px) {
  body { padding: 12px; }
  .setting-card { padding: 16px; }
}
</style>
</head>
<body>

<a class="back" id="backLink" href="../index.html">← 戻る</a>
<h1>⚙️ <span id="childName">-</span> の設定</h1>

<div class="setting-card">
  <label class="setting-item">
    <input type="checkbox" id="showBalanceOnTop">
    <span>トップページに残高を表示する</span>
  </label>
  <div class="setting-item" style="cursor:default;">
    <span>表示順</span>
    <input type="number" id="sortOrder" min="0" style="width:80px; text-align:center;">
  </div>
</div>

<div class="setting-card">
  <label class="setting-item">
    <input type="checkbox" id="requirePassword" onchange="togglePassword()">
    <span>このページにパスワードを設定する</span>
  </label>
  <div class="pw-section" id="pwSection" style="display:none;">
    <input type="password" id="pwInput" placeholder="新しいパスワード">
  </div>
</div>

<div style="max-width:480px; margin-top:8px;">
  <button class="btn-save" onclick="saveAll()">設定を保存</button>
  <div class="msg" id="saveMsg">✓ 保存しました</div>
</div>

<script>
const SUPABASE_URL = "https://ynecezxnltigplrfzzoh.supabase.co";
const SUPABASE_KEY = "sb_publishable_seKZakec1yB046vlgPDAKQ_zd4CKIg4";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const params = new URLSearchParams(window.location.search);
const childId = params.get('id');
let child = null;
</script>

<script>
async function load() {
  const { data } = await client.from('children').select('*').eq('id', childId).single();
  if (!data) { document.getElementById('childName').textContent = '不明'; return; }
  child = data;

  document.getElementById('childName').textContent = child.name;
  document.getElementById('backLink').href = `child.html?id=${childId}`;
  document.getElementById('showBalanceOnTop').checked = child.show_balance_on_top !== false;
  document.getElementById('sortOrder').value = child.sort_order || 0;
  document.getElementById('requirePassword').checked = !!child.require_password;
  if (child.require_password) {
    document.getElementById('pwSection').style.display = 'block';
  }
}

async function saveSetting() {}

function togglePassword() {
  const checked = document.getElementById('requirePassword').checked;
  document.getElementById('pwSection').style.display = checked ? 'block' : 'none';
}

async function saveAll() {
  const showBalance = document.getElementById('showBalanceOnTop').checked;
  const sortOrder = parseInt(document.getElementById('sortOrder').value) || 0;
  const requirePw = document.getElementById('requirePassword').checked;
  const pw = document.getElementById('pwInput').value;

  const update = {
    show_balance_on_top: showBalance,
    sort_order: sortOrder,
    require_password: requirePw,
  };

  if (requirePw && pw) {
    update.password = pw;
  }
  if (!requirePw) {
    update.password = null;
  }

  await client.from('children').update(update).eq('id', childId);
  document.getElementById('pwInput').value = '';
  const msg = document.getElementById('saveMsg');
  msg.style.display = 'block';
  setTimeout(() => msg.style.display = 'none', 2000);
}

async function savePassword() {}

load();
</script>

</body>
</html>
