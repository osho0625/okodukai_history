<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1976d2">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../images/2728.png">
<title>おうちビデオ通話</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="../js/common.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', sans-serif;
  background: #0d1117;
  color: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
}
.header a { color: #fff; text-decoration: none; font-size: 1.5em; padding: 6px 10px; }
.title { font-weight: 700; font-size: 1.1em; }

/* 映像エリア */
.video-stage {
  position: relative;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  overflow: hidden;
}
#vcRemoteVideo {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}
#vcLocalVideo {
  position: absolute;
  bottom: 16px;
  right: 16px;
  width: 120px;
  border-radius: 10px;
  border: 2px solid #fff;
  background: #000;
  z-index: 10;
}
.vc-placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 4em;
  color: #444;
}

/* 操作バー */
.controls {
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.vc-status { font-weight: 600; min-height: 1.4em; text-align: center; }
.vc-status.info { color: #64b5f6; } .vc-status.success { color: #81c784; } .vc-status.error { color: #e57373; }
#vcTimer { font-size: 1.6em; font-weight: 700; }
.vc-btn {
  width: 100%;
  max-width: 340px;
  padding: 18px;
  border: none;
  border-radius: 14px;
  font-size: 1.3em;
  font-weight: 700;
  color: #fff;
  cursor: pointer;
}
@keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.04);} }

/* ラズパイキオスクモード: ヘッダー/操作を隠して映像を全画面に */
body.raspi .header { display: none; }
body.raspi .controls { position: fixed; bottom: 8px; left: 0; right: 0; padding: 4px; background: transparent; }
body.raspi #vcLocalVideo { width: 160px; }
</style>
</head>
<body>

<div class="header">
  <a href="../index.html">&#x1F3E0;</a>
  <span class="title">📹 おうちビデオ通話</span>
  <span style="width:2.2em;"></span>
</div>

<div class="video-stage">
  <div class="vc-placeholder" id="vcPlaceholder">📹</div>
  <video id="vcRemoteVideo" autoplay playsinline style="display:none;"></video>
  <video id="vcLocalVideo" autoplay playsinline muted style="display:none;"></video>
  <audio id="vcRemoteAudio" autoplay></audio>
</div>

<div class="controls">
  <div id="vcStatus" class="vc-status"></div>
  <div id="vcTimer" style="display:none;">0:00</div>
  <button id="vcCallBtn" class="vc-btn" style="background:#4caf50;">📞 でんわする</button>
  <button id="vcEndBtn" class="vc-btn" style="display:none; background:#e53935;">切る</button>
</div>

<script src="../js/broadcast-video.js"></script>
<script>
(function() {
  const params = new URLSearchParams(location.search);
  const isRaspi = params.get('mode') === 'raspi';
  const role = isRaspi ? 'raspi' : 'parent';

  if (isRaspi) document.body.classList.add('raspi');

  // プレースホルダーはリモート映像が出たら隠す
  const remoteVideo = document.getElementById('vcRemoteVideo');
  const placeholder = document.getElementById('vcPlaceholder');
  const obs = new MutationObserver(() => {
    placeholder.style.display = (remoteVideo.style.display === 'block') ? 'none' : 'flex';
  });
  obs.observe(remoteVideo, { attributes: true, attributeFilter: ['style'] });

  document.addEventListener('DOMContentLoaded', async () => {
    await BroadcastVideo.init(role, isRaspi);

    document.getElementById('vcCallBtn').addEventListener('click', () => BroadcastVideo.startCall());
    document.getElementById('vcEndBtn').addEventListener('click', () => BroadcastVideo.endCall());

    if (isRaspi) {
      // ラズパイ待受表示
      const st = document.getElementById('vcStatus');
      if (st) { st.textContent = 'まちうけ中… 親からの着信を待っています'; st.className = 'vc-status info'; }
    }
  });
})();
</script>
</body>
</html>
