<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1976d2">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../images/2728.png">
<title>おうちビデオ通話</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="../js/common.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', sans-serif;
  background: #0d1117;
  color: #fff;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
}
.header a { color: #fff; text-decoration: none; font-size: 1.5em; padding: 6px 10px; }
.title { font-weight: 700; font-size: 1.1em; }

/* 映像エリア */
.video-stage {
  position: relative;
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #000;
  overflow: hidden;
}
#vcRemoteVideo {
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}
#vcLocalVideo {
  position: absolute;
  bottom: 16px;
  right: 16px;
  width: 120px;
  border-radius: 10px;
  border: 2px solid #fff;
  background: #000;
  z-index: 10;
}
.vc-placeholder {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 4em;
  color: #444;
}

/* 操作バー */
.controls {
  padding: 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.vc-status { font-weight: 600; min-height: 1.4em; text-align: center; }
.vc-status.info { color: #64b5f6; } .vc-status.success { color: #81c784; } .vc-status.error { color: #e57373; }
#vcTimer { font-size: 1.6em; font-weight: 700; }
.vc-btn {
  width: 100%;
  max-width: 340px;
  padding: 18px;
  border: none;
  border-radius: 14px;
  font-size: 1.3em;
  font-weight: 700;
  color: #fff;
  cursor: pointer;
}
@keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.04);} }

/* ラズパイキオスクモード: ヘッダー/操作を隠して映像を全画面に */
body.raspi .header { display: none; }
body.raspi .controls { position: fixed; bottom: 8px; left: 0; right: 0; padding: 4px; background: transparent; }
body.raspi #vcLocalVideo { width: 160px; }
</style>
</head>
<body>

<div class="header">
  <a href="../index.html">&#x1F3E0;</a>
  <span class="title">📹 おうちビデオ通話</span>
  <span style="width:2.2em;"></span>
</div>

<div class="video-stage">
  <div class="vc-placeholder" id="vcPlaceholder">📹</div>
  <video id="vcRemoteVideo" autoplay playsinline style="display:none;"></video>
  <video id="vcLocalVideo" autoplay playsinline muted style="display:none;"></video>
  <audio id="vcRemoteAudio" autoplay></audio>
</div>

<div class="controls">
  <div id="vcStatus" class="vc-status"></div>
  <div id="vcTimer" style="display:none;">0:00</div>

  <!-- 合言葉入力（発信側・未設定時のみ表示） -->
  <div id="vcSecretRow" style="display:none; width:100%; max-width:340px; text-align:center;">
    <div style="font-size:0.9em; color:#aab; margin-bottom:6px;">🔑 合言葉を入力してください（初回のみ）</div>
    <input id="vcSecretInput" type="password" placeholder="合言葉" autocomplete="off"
      style="width:100%; padding:14px; border-radius:12px; border:none; font-size:1.1em; text-align:center; margin-bottom:8px;">
    <button id="vcSecretSaveBtn" class="vc-btn" style="background:#1976d2;">🔑 合言葉を保存</button>
  </div>

  <button id="vcCallBtn" class="vc-btn" style="background:#4caf50;">📞 発信</button>
  <button id="vcAcceptBtn" class="vc-btn" style="display:none; background:#4caf50; animation:pulse 1.5s infinite;">📞 応答</button>
  <button id="vcEndBtn" class="vc-btn" style="display:none; background:#e53935;">切断</button>

  <!-- 合言葉の変更（設定済みのとき小さく表示） -->
  <button id="vcSecretChangeBtn" style="display:none; margin-top:4px; background:none; border:none; color:#5a6; font-size:0.8em; cursor:pointer; text-decoration:underline;">合言葉を変更</button>
</div>

<script src="../js/broadcast-video.js"></script>
<script>
(function() {
  const params = new URLSearchParams(location.search);
  const isRaspi = params.get('mode') === 'raspi';
  const role = isRaspi ? 'raspi' : 'parent';

  if (isRaspi) document.body.classList.add('raspi');

  // プレースホルダーはリモート映像が出たら隠す
  const remoteVideo = document.getElementById('vcRemoteVideo');
  const placeholder = document.getElementById('vcPlaceholder');
  const obs = new MutationObserver(() => {
    placeholder.style.display = (remoteVideo.style.display === 'block') ? 'none' : 'flex';
  });
  obs.observe(remoteVideo, { attributes: true, attributeFilter: ['style'] });

  const SECRET_KEY = 'broadcast_call_secret';

  // 合言葉UIの表示制御（発信側のみ）
  function refreshSecretUI() {
    if (isRaspi) return;
    const has = !!localStorage.getItem(SECRET_KEY);
    const row = document.getElementById('vcSecretRow');
    const callBtn = document.getElementById('vcCallBtn');
    const changeBtn = document.getElementById('vcSecretChangeBtn');
    // 未設定なら入力欄を出して発信ボタンを隠す。設定済みなら発信ボタン＋変更リンク
    if (row) row.style.display = has ? 'none' : 'block';
    if (callBtn) callBtn.style.display = has ? 'block' : 'none';
    if (changeBtn) changeBtn.style.display = has ? 'block' : 'none';
  }

  document.addEventListener('DOMContentLoaded', async () => {
    await BroadcastVideo.init(role, isRaspi);

    document.getElementById('vcCallBtn').addEventListener('click', () => BroadcastVideo.startCall());
    document.getElementById('vcAcceptBtn').addEventListener('click', () => BroadcastVideo.acceptCall());
    document.getElementById('vcEndBtn').addEventListener('click', () => BroadcastVideo.endCall());

    if (isRaspi) {
      // ラズパイ待受表示
      const st = document.getElementById('vcStatus');
      if (st) { st.textContent = '待受中… 親からの着信を待っています'; st.className = 'vc-status info'; }
      return;
    }

    // 発信側: 合言葉の入力・保存・変更
    const secretInput = document.getElementById('vcSecretInput');
    const saveBtn = document.getElementById('vcSecretSaveBtn');
    const changeBtn = document.getElementById('vcSecretChangeBtn');
    const st = document.getElementById('vcStatus');

    function saveSecret() {
      const val = (secretInput.value || '').trim();
      if (!val) {
        if (st) { st.textContent = '合言葉を入力してください'; st.className = 'vc-status error'; }
        return;
      }
      localStorage.setItem(SECRET_KEY, val);
      secretInput.value = '';
      if (st) { st.textContent = '合言葉を保存しました📞'; st.className = 'vc-status success'; }
      // 保存した合言葉を即反映するため再初期化
      BroadcastVideo.init(role, isRaspi).then(refreshSecretUI);
    }

    saveBtn.addEventListener('click', saveSecret);
    secretInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') saveSecret(); });
    changeBtn.addEventListener('click', () => {
      localStorage.removeItem(SECRET_KEY);
      refreshSecretUI();
      if (st) { st.textContent = '新しい合言葉を入力してください'; st.className = 'vc-status info'; }
    });

    refreshSecretUI();
  });
})();
</script>
</body>
</html>
