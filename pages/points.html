<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4caf50">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../images/2728.png">
<title>お手伝いポイント表 - お小遣い手帳</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
.back { display: inline-block; margin-bottom: 16px; color: #333; text-decoration: none; font-size: 1.6em; line-height: 1; padding: 8px 12px; }
.back:hover { opacity: 0.6; }
h1 { text-align: center; margin-bottom: 20px; color: #333; }

/* アカウント選択 */
.child-btns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 24px; max-width: 480px; margin-left: auto; margin-right: auto; }
.child-btn {
  padding: 12px 20px; border: 2px solid #ddd; border-radius: 10px;
  background: #fff; font-size: 1.05em; font-weight: 600; cursor: pointer;
  transition: all 0.15s;
}
.child-btn:hover { border-color: #ff9800; color: #ff9800; }
.child-btn.active { background: #ff9800; color: #fff; border-color: #ff9800; }

/* ポイント表 */
.points-section { display: none; max-width: 480px; margin: 0 auto; }
.points-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.points-header .name { font-size: 1.2em; font-weight: 700; }
.points-header .total { font-size: 1.1em; font-weight: 700; color: #ff9800; }
.grid-container {
  background: #fff; border-radius: 12px; padding: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px;
}
.grid {
  display: grid; grid-template-columns: repeat(20, 1fr); gap: 2px;
  max-width: 100%;
}
.grid-cell {
  aspect-ratio: 1; border-radius: 3px; background: #eee;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.55em;
}
.grid-cell.filled { background: #ffcc02; }
.grid-cell.filled::after { content: '⭐'; font-size: 1.2em; }
.grid-cell.milestone { border: 2px solid #ff9800; }
.grid-cell.milestone-big { border: 2px solid #e53935; }

/* 家事選択＋ポイント追加 */
.add-section {
  background: #fff; border-radius: 12px; padding: 20px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}
.add-section h3 { margin-bottom: 12px; color: #555; font-size: 1em; }
.chore-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.chore-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px; border: 2px solid #eee; border-radius: 10px;
  cursor: pointer; transition: all 0.15s;
}
.chore-item:hover { border-color: #ff9800; }
.chore-item.selected { border-color: #ff9800; background: #fff8e1; }
.chore-name { font-weight: 600; font-size: 0.95em; }
.chore-pts { color: #ff9800; font-weight: 700; font-size: 0.95em; }

.adjust-row {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  margin-bottom: 16px;
}
.adjust-btn {
  width: 40px; height: 40px; border: none; border-radius: 50%;
  font-size: 1.3em; font-weight: 700; cursor: pointer; color: #fff;
  display: flex; align-items: center; justify-content: center;
}
.adjust-minus { background: #e53935; }
.adjust-plus { background: #4caf50; }
.adjust-btn:active { opacity: 0.7; }
.adjust-val { font-size: 1.4em; font-weight: 700; color: #333; min-width: 50px; text-align: center; }

.btn-add-pts {
  width: 100%; padding: 14px; border: none; border-radius: 10px;
  background: #ff9800; color: #fff; font-size: 1.1em; font-weight: 700;
  cursor: pointer; transition: opacity 0.15s;
}
.btn-add-pts:disabled { opacity: 0.4; cursor: default; }
.btn-add-pts:hover:not(:disabled) { opacity: 0.9; }

.result-msg {
  text-align: center; margin-top: 12px; color: #4caf50;
  font-weight: 600; display: none;
}

@media (max-width: 520px) {
  body { padding: 12px; }
  .grid-cell { font-size: 0.45em; }
}
</style>
</head>
<body>

<a class="back" href="../index.html">&#x2190;</a>
<h1>&#x2B50; お手伝いポイント表</h1>

<div class="child-btns" id="childBtns"></div>

<div class="points-section" id="pointsSection">
  <div class="points-header">
    <span class="name" id="selectedName">-</span>
    <span class="total"><span id="totalPts">0</span> / 400 ポイント</span>
  </div>
  <div class="grid-container">
    <div class="grid" id="pointsGrid"></div>
  </div>

  <div class="add-section">
    <h3>&#x1F9F9; 家事を選んでポイント追加</h3>
    <div class="chore-list" id="choreList"></div>
    <div class="adjust-row">
      <button class="adjust-btn adjust-minus" onclick="adjustPts(-1)">−</button>
      <div class="adjust-val" id="adjustVal">0</div>
      <button class="adjust-btn adjust-plus" onclick="adjustPts(1)">＋</button>
    </div>
    <button class="btn-add-pts" id="btnAddPts" onclick="addPoints()" disabled>ポイントを追加</button>
    <div class="result-msg" id="resultMsg">✓ 追加しました！</div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://ynecezxnltigplrfzzoh.supabase.co";
const SUPABASE_KEY = "sb_publishable_seKZakec1yB046vlgPDAKQ_zd4CKIg4";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const DISCORD_WEBHOOK = 'https://discord.com/api/webhooks/1498552364905529355/6I3vultTaQcYNRjPP76ZtyyyGLG1JWdU7eX3IfMtpGCUWR3sdw2Gn3_pNxHgaS-z9iyG';

// デフォルト家事リスト（Supabaseにchore_typesテーブルがなくてもフォールバック）
const DEFAULT_CHORES = [
  { name: 'お風呂掃除', default_points: 3 },
  { name: 'トイレ掃除', default_points: 2 },
  { name: '食器洗い', default_points: 2 },
  { name: '洗濯物たたみ', default_points: 2 },
  { name: '掃除機', default_points: 2 },
  { name: 'ゴミ出し', default_points: 1 },
  { name: '料理の手伝い', default_points: 3 },
  { name: '買い物の手伝い', default_points: 2 },
  { name: 'その他', default_points: 1 }
];

let allChildren = [];
let selectedChildId = null;
let chores = [];
let selectedChoreIdx = null;
let currentPts = 0;

async function load() {
  // アカウント読み込み（いろはの借金を除外）
  const { data } = await client.from('children').select('*').order('sort_order', { ascending: true });
  allChildren = (data || []).filter(c => c.name !== 'いろはの借金');

  const container = document.getElementById('childBtns');
  container.innerHTML = '';
  allChildren.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'child-btn';
    btn.textContent = c.name;
    btn.addEventListener('click', () => selectChild(c.id, btn));
    container.appendChild(btn);
  });

  // 家事マスタ読み込み
  try {
    const { data: choreData } = await client.from('chore_types').select('*').order('id');
    chores = (choreData && choreData.length > 0) ? choreData : DEFAULT_CHORES;
  } catch(e) {
    chores = DEFAULT_CHORES;
  }
  renderChores();
}

function selectChild(id, btn) {
  selectedChildId = id;
  document.querySelectorAll('.child-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  const child = allChildren.find(c => c.id === id);
  document.getElementById('selectedName').textContent = child ? child.name : '-';
  document.getElementById('pointsSection').style.display = 'block';

  // 選択リセット
  selectedChoreIdx = null;
  currentPts = 0;
  document.getElementById('adjustVal').textContent = '0';
  document.getElementById('btnAddPts').disabled = true;
  document.querySelectorAll('.chore-item').forEach(el => el.classList.remove('selected'));

  loadPoints();
}

async function loadPoints() {
  if (!selectedChildId) return;

  // ポイント履歴を取得して合計計算
  const { data } = await client.from('chore_points')
    .select('points')
    .eq('child_id', selectedChildId);

  const total = (data || []).reduce((sum, r) => sum + r.points, 0);
  const capped = Math.min(total, 400);
  document.getElementById('totalPts').textContent = capped;

  // グリッド描画
  const grid = document.getElementById('pointsGrid');
  grid.innerHTML = '';
  for (let i = 0; i < 400; i++) {
    const cell = document.createElement('div');
    const ptNum = i + 1;
    let cls = 'grid-cell';
    if (i < capped) cls += ' filled';
    if (ptNum === 200 || ptNum === 400) cls += ' milestone-big';
    else if (ptNum % 60 === 0) cls += ' milestone-big';
    else if (ptNum % 20 === 0) cls += ' milestone';
    cell.className = cls;
    grid.appendChild(cell);
  }
}

function renderChores() {
  const list = document.getElementById('choreList');
  list.innerHTML = '';
  chores.forEach((ch, idx) => {
    const item = document.createElement('div');
    item.className = 'chore-item';
    item.innerHTML = '<span class="chore-name">' + ch.name + '</span><span class="chore-pts">' + ch.default_points + 'pt</span>';
    item.addEventListener('click', () => selectChore(idx, item));
    list.appendChild(item);
  });
}

function selectChore(idx, el) {
  selectedChoreIdx = idx;
  currentPts = chores[idx].default_points;
  document.getElementById('adjustVal').textContent = currentPts;
  document.querySelectorAll('.chore-item').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  document.getElementById('btnAddPts').disabled = false;
}

function adjustPts(delta) {
  if (selectedChoreIdx === null) return;
  currentPts = Math.max(1, currentPts + delta);
  document.getElementById('adjustVal').textContent = currentPts;
}

// 20ポイントごとのお小遣い額を計算
function getAllowanceForMilestone(pts) {
  if (pts === 400) return 400;
  if (pts === 200) return 200;
  if (pts % 60 === 0) return 300;
  if (pts % 20 === 0) return 40;
  return 0;
}

let allChildrenFull = []; // いろはの借金含む全アカウント

async function addPoints() {
  if (!selectedChildId || selectedChoreIdx === null || currentPts <= 0) return;

  const child = allChildren.find(c => c.id === selectedChildId);
  const chore = chores[selectedChoreIdx];

  document.getElementById('btnAddPts').disabled = true;

  // 追加前の合計を取得
  const { data: beforeData } = await client.from('chore_points')
    .select('points').eq('child_id', selectedChildId);
  const beforeTotal = Math.min((beforeData || []).reduce((s, r) => s + r.points, 0), 400);

  // ポイント追加
  await client.from('chore_points').insert({
    child_id: selectedChildId,
    chore_name: chore.name,
    points: currentPts
  });

  const afterTotal = Math.min(beforeTotal + currentPts, 400);

  // 20の倍数を超えたかチェック → お小遣い自動入金
  let totalAllowance = 0;
  const milestones = [];
  for (let m = 20; m <= 400; m += 20) {
    if (beforeTotal < m && afterTotal >= m) {
      const amt = getAllowanceForMilestone(m);
      totalAllowance += amt;
      milestones.push({ pts: m, amt });
    }
  }

  if (totalAllowance > 0 && child) {
    await giveAllowance(child, totalAllowance, milestones);
  }

  // Discord通知（ポイント）
  try {
    let content = '⭐ **' + (child ? child.name : '') + '** が「' + chore.name + '」で ' + currentPts + 'ポイント獲得！（合計: ' + afterTotal + '/400）';
    if (milestones.length > 0) {
      content += '\n💰 お小遣い発生！ ' + milestones.map(m => m.pts + 'pt→' + m.amt + '円').join(', ') + '（計' + totalAllowance + '円）';
    }
    await fetch(DISCORD_WEBHOOK, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ content })
    });
  } catch(e) {}

  // 結果表示
  const msg = document.getElementById('resultMsg');
  let msgText = '✓ ' + chore.name + ' で ' + currentPts + 'pt 追加！';
  if (totalAllowance > 0) {
    msgText += ' 💰 ' + totalAllowance + '円のお小遣い発生！';
  }
  msg.textContent = msgText;
  msg.style.display = 'block';
  setTimeout(() => msg.style.display = 'none', 4000);

  loadPoints();
  setTimeout(() => { document.getElementById('btnAddPts').disabled = false; }, 500);
}

// お小遣い入金（いろはの場合は半分ずつ）
async function giveAllowance(child, amount, milestones) {
  // 全アカウント取得（いろはの借金含む）
  if (allChildrenFull.length === 0) {
    const { data } = await client.from('children').select('*');
    allChildrenFull = data || [];
  }

  const irohaDebt = allChildrenFull.find(c => c.name === 'いろはの借金');
  const isIroha = child.name === 'いろは' && irohaDebt;

  if (isIroha) {
    const half = Math.floor(amount / 2);
    const remainder = amount - half;

    // いろは本体
    const { data: irohaData } = await client.from('children').select('balance').eq('id', child.id).single();
    const irohaNew = (irohaData ? irohaData.balance : 0) + remainder;
    await client.from('children').update({ balance: irohaNew }).eq('id', child.id);
    await client.from('transactions').insert({
      child_id: child.id, type: 'add', amount: remainder, memo: 'ポイント表ご褒美'
    });
    // 未読入金（演出用）
    savePendingDeposit(child.id, irohaData ? irohaData.balance : 0, irohaNew, remainder);

    // いろはの借金
    const { data: debtData } = await client.from('children').select('balance').eq('id', irohaDebt.id).single();
    const debtNew = (debtData ? debtData.balance : 0) + half;
    await client.from('children').update({ balance: debtNew }).eq('id', irohaDebt.id);
    await client.from('transactions').insert({
      child_id: irohaDebt.id, type: 'add', amount: half, memo: 'ポイント表ご褒美（いろは分）'
    });
    savePendingDeposit(irohaDebt.id, debtData ? debtData.balance : 0, debtNew, half);
  } else {
    const { data: cData } = await client.from('children').select('balance').eq('id', child.id).single();
    const newBal = (cData ? cData.balance : 0) + amount;
    await client.from('children').update({ balance: newBal }).eq('id', child.id);
    await client.from('transactions').insert({
      child_id: child.id, type: 'add', amount, memo: 'ポイント表ご褒美'
    });
    savePendingDeposit(child.id, cData ? cData.balance : 0, newBal, amount);
  }
}

// 未読入金情報をlocalStorageに保存（演出用、allowance.htmlと同じ仕組み）
function savePendingDeposit(childId, oldBalance, newBalance, amount) {
  const key = 'pending_deposit_' + childId;
  const existing = localStorage.getItem(key);
  if (existing) {
    const prev = JSON.parse(existing);
    prev.newBalance = newBalance;
    prev.totalAmount += amount;
    localStorage.setItem(key, JSON.stringify(prev));
  } else {
    localStorage.setItem(key, JSON.stringify({ oldBalance, newBalance, totalAmount: amount }));
  }
}

load();
</script>
</body>
</html>
