<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4caf50">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../images/2728.png">
<title>あそびチケット</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/common.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; padding: 20px; }
.back { display: inline-block; margin-bottom: 16px; color: #333; text-decoration: none; font-size: 1.6em; line-height: 1; padding: 8px 12px; cursor: pointer; }
.back:hover { opacity: 0.6; }
h1 { margin-bottom: 16px; color: #333; }

/* タブ */
.tabs { display: flex; gap: 0; margin-bottom: 20px; border-bottom: 2px solid #e0e0e0; }
.tab-btn {
  flex: 1; padding: 12px 16px; border: none; background: none;
  font-size: 1em; font-weight: 600; color: #999; cursor: pointer;
  border-bottom: 3px solid transparent; margin-bottom: -2px; transition: all 0.2s;
}
.tab-btn.active { color: #4caf50; border-bottom-color: #4caf50; }
.tab-btn:hover:not(.active) { color: #666; }

/* チケットカード */
.ticket-card {
  position: relative;
  background: linear-gradient(135deg, #fdf6e3 0%, #f5e6c8 100%);
  border-radius: 12px;
  padding: 20px 24px 20px 20px;
  margin-bottom: 16px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.1);
  border: 1px solid #e8d5a3;
  overflow: hidden;
}
.ticket-card.used { opacity: 0.7; }

.ticket-gold-line {
  position: absolute;
  top: 0; right: 0;
  width: 8px; height: 100%;
  background: linear-gradient(to bottom, #d4a017, #b8860b, #d4a017);
}

.ticket-header { position: relative; }

.ticket-title-en {
  font-size: 1.1em;
  font-weight: 700;
  color: #5a3e1b;
  letter-spacing: 1px;
}

.ticket-title-ja {
  font-size: 1.4em;
  font-weight: 800;
  color: #3d2b0f;
  margin-bottom: 8px;
}

.ticket-no {
  position: absolute;
  top: 0; right: 12px;
  font-size: 0.8em;
  color: #8b7355;
  font-weight: 600;
}

.ticket-desc {
  font-size: 0.85em;
  color: #5a4a2f;
  margin-bottom: 10px;
  line-height: 1.4;
}

.ticket-rules {
  font-size: 0.75em;
  color: #6b5b3f;
  margin-bottom: 12px;
  line-height: 1.6;
}

.ticket-duration {
  font-size: 1.8em;
  font-weight: 800;
  color: #c0392b;
  text-align: center;
  margin: 8px 0;
}

.ticket-meta {
  display: flex;
  justify-content: space-between;
  font-size: 0.75em;
  color: #7a6b4f;
  margin-top: 8px;
}

.ticket-icons {
  text-align: center;
  font-size: 1.4em;
  margin-top: 10px;
  letter-spacing: 8px;
}

/* スタンプ */
.stamp-overlay {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%) rotate(-15deg);
  font-size: 2.2em;
  font-weight: 900;
  color: rgba(220, 50, 50, 0.6);
  border: 4px solid rgba(220, 50, 50, 0.6);
  border-radius: 12px;
  padding: 8px 20px;
  pointer-events: none;
  white-space: nowrap;
}

.stamp-animate {
  animation: stampPress 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
}

@keyframes stampPress {
  0% { transform: translate(-50%, -50%) rotate(-15deg) scale(3); opacity: 0; }
  60% { transform: translate(-50%, -50%) rotate(-15deg) scale(0.9); opacity: 0.8; }
  100% { transform: translate(-50%, -50%) rotate(-15deg) scale(1); opacity: 1; }
}

/* 使用ボタン */
.use-btn {
  display: block;
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  background: #4caf50;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 1.1em;
  font-weight: 700;
  cursor: pointer;
}
.use-btn:disabled {
  background: #ccc;
  cursor: not-allowed;
}
.use-btn:hover:not(:disabled) {
  opacity: 0.9;
}

/* 確認ダイアログ */
.overlay {
  display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.4); z-index: 100; justify-content: center; align-items: center;
}
.overlay.active { display: flex; }
.modal {
  background: #fff; border-radius: 16px; padding: 24px;
  width: 90%; max-width: 360px; box-shadow: 0 8px 32px rgba(0,0,0,0.2);
  text-align: center;
}
.modal h3 { margin-bottom: 16px; font-size: 1.1em; }
.modal-btns { display: flex; gap: 8px; margin-top: 20px; }
.modal-btns button {
  flex: 1; padding: 12px; border: none; border-radius: 8px;
  font-size: 1em; font-weight: 600; cursor: pointer;
}
.confirm-ok-btn { background: #4caf50; color: #fff; }
.confirm-ok-btn:disabled { background: #ccc; cursor: not-allowed; }
.confirm-cancel-btn { background: #eee; color: #333; }

/* チケット残数 */
.ticket-count {
  text-align: center; font-size: 1.1em; color: #555;
  margin-bottom: 16px; padding: 8px; background: #fff;
  border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.05);
}

/* Owner別グループ */
.owner-group { margin-bottom: 24px; }
.owner-group-title {
  font-size: 1em; font-weight: 700; color: #555;
  margin-bottom: 12px; padding-bottom: 8px;
  border-bottom: 1px solid #ddd;
}

/* 履歴 */
.history-item { margin-bottom: 16px; }
.used-date {
  text-align: right; font-size: 0.8em; color: #999;
  margin-top: 4px;
}
.empty-msg {
  text-align: center; color: #999; padding: 40px 20px;
  font-size: 0.95em;
}

/* エラーメッセージ */
.error-msg {
  display: none; background: #ffebee; color: #c62828;
  padding: 10px 16px; border-radius: 8px; margin-bottom: 16px;
  font-size: 0.9em; text-align: center;
}

@media (max-width: 520px) {
  body { padding: 12px; }
  .ticket-card { padding: 16px 20px 16px 16px; }
  .ticket-meta { flex-direction: column; gap: 2px; }
}
</style>
</head>
<body>

<a class="back" onclick="if(history.length>1){history.back()}else{location.href='../index.html'}">←</a>
<a href="../index.html" style="color:#333;text-decoration:none;font-size:1.4em;position:absolute;top:20px;right:20px;">🏠</a>
<h1>🎫 あそびチケット</h1>

<div id="errorMsg" class="error-msg"></div>

<div class="tabs">
  <button class="tab-btn active" data-tab="unused" onclick="switchTab('unused')">未使用</button>
  <button class="tab-btn" data-tab="history" onclick="switchTab('history')">履歴</button>
</div>

<div id="ticketList"></div>

<!-- 確認ダイアログ -->
<div class="overlay" id="confirmOverlay">
  <div class="modal">
    <h3>🎫 このチケットを使いますか？</h3>
    <p style="font-size:0.9em; color:#666;">使うと元に戻せません</p>
    <div class="modal-btns">
      <button class="confirm-cancel-btn" onclick="cancelUse()">キャンセル</button>
      <button class="confirm-ok-btn" onclick="executeUse()">使う</button>
    </div>
  </div>
</div>

<script>
// --- 定数・状態 ---
const VALID_OWNERS = ['かいせい', 'はるちか', 'いろは'];
let currentOwner = null;
let currentTab = 'unused';
let unusedTickets = [];
let usedTickets = [];
let pendingTicketId = null;
let shownLoadError = false;

// --- XSSエスケープ ---
function esc(s) {
  return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
}

// --- エラー表示 ---
function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 5000);
}

// --- Discord通知（タイムアウト付き） ---
function notifyWithTimeout(msg) {
  return Promise.race([
    notifyDiscord(msg),
    new Promise((_, reject) => setTimeout(() => reject('timeout'), 3000))
  ]).catch(() => console.warn('Discord通知失敗/タイムアウト'));
}

// --- 初期化 ---
async function initTicketPage() {
  // オフラインチェック
  if (!navigator.onLine) {
    document.body.classList.add('offline');
    loadCachedTickets();
    renderCurrentTab();
    disableAllTicketActions();
    showError('オフラインです');
    return;
  }

  const valid = resolveOwner();
  if (!isAdmin && !currentOwner) {
    return;
  }
  await loadTickets();
  renderCurrentTab();
}

function resolveOwner() {
  const params = new URLSearchParams(location.search);
  const paramOwner = params.get('owner');
  const storedOwner = localStorage.getItem('selectedChild');

  // Admin以外はURLパラメータとlocalStorageの一致を検証
  if (!isAdmin && paramOwner && paramOwner !== storedOwner) {
    showError('権限がありません');
    return false;
  }
  currentOwner = paramOwner || storedOwner;

  // Owner名バリデーション（URL改ざん対策）
  if (!isAdmin && !VALID_OWNERS.includes(currentOwner)) {
    currentOwner = null;
    showError('所有者が不正です');
    return false;
  }
  return true;
}

// --- チケット取得 ---
async function loadTickets() {
  shownLoadError = false;
  await Promise.all([loadUnusedTickets(), loadUsedTickets()]);
  // オフラインキャッシュ保存（成功時のみ）
  if (unusedTickets.length > 0 || usedTickets.length > 0) {
    localStorage.setItem('ticketCache_unused', JSON.stringify(unusedTickets));
    localStorage.setItem('ticketCache_used', JSON.stringify(usedTickets));
  }
}

async function loadUnusedTickets() {
  let query = client.from('tickets').select('*').eq('status', 'unused');
  if (!isAdmin) {
    query = query.eq('owner', currentOwner).order('ticket_no', { ascending: true });
  } else {
    query = query.order('owner').order('ticket_no', { ascending: true });
  }

  const { data, error } = await query;
  if (error) { showLoadErrorOnce(); return; }
  unusedTickets = data || [];
}

async function loadUsedTickets() {
  let query = client.from('tickets').select('*').eq('status', 'used');
  if (!isAdmin) query = query.eq('owner', currentOwner);
  query = query.order('used_at', { ascending: false });

  const { data, error } = await query;
  if (error) { showLoadErrorOnce(); return; }
  usedTickets = data || [];
}

function showLoadErrorOnce() {
  if (shownLoadError) return;
  shownLoadError = true;
  showError('データの取得に失敗しました');
}

function loadCachedTickets() {
  unusedTickets = JSON.parse(localStorage.getItem('ticketCache_unused') || '[]');
  usedTickets = JSON.parse(localStorage.getItem('ticketCache_used') || '[]');
}

// --- タブ切り替え ---
function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`[data-tab="${tab}"]`).classList.add('active');
  renderCurrentTab();
}

function renderCurrentTab() {
  if (currentTab === 'unused') renderUnusedTickets();
  else renderHistory();
}

// --- 描画: 未使用チケット ---
function renderUnusedTickets() {
  const container = document.getElementById('ticketList');

  if (isAdmin) {
    const grouped = groupByOwner(unusedTickets);
    container.innerHTML = Object.entries(grouped)
      .map(([owner, tix]) => renderOwnerGroup(owner, tix)).join('');
  } else {
    container.innerHTML = `
      <div class="ticket-count">のこり <strong>${unusedTickets.length}</strong> まい</div>
      ${unusedTickets.map(t => renderTicketCard(t)).join('')}
    `;
  }
}

function groupByOwner(tickets) {
  return tickets.reduce((acc, t) => {
    (acc[t.owner] = acc[t.owner] || []).push(t);
    return acc;
  }, {});
}

function renderOwnerGroup(owner, tickets) {
  return `
    <div class="owner-group">
      <h3 class="owner-group-title">${esc(owner)}（${tickets.length}枚）</h3>
      ${tickets.map(t => renderTicketCard(t)).join('')}
    </div>
  `;
}

// --- 描画: チケットカード ---
function renderTicketCard(ticket) {
  const isUsed = ticket.status === 'used';
  return `
    <div class="ticket-card ${isUsed ? 'used' : ''}" data-ticket-id="${ticket.id}">
      <div class="ticket-body">
        <div class="ticket-gold-line"></div>
        <div class="ticket-content">
          <div class="ticket-header">
            <div class="ticket-title-en">PLAY WITH TSUJI !!</div>
            <div class="ticket-title-ja">あそびチケット</div>
            <div class="ticket-no">No.${String(ticket.ticket_no)}</div>
          </div>
          <div class="ticket-desc">このチケットを使うとつじはどんなあそびにも付き合います</div>
          <div class="ticket-rules">
            <div class="rule">・時間中は券を使った人が最優先されます</div>
            <div class="rule">・この券は連続で使用できます</div>
            <div class="rule">・この券は予約性です</div>
            <div class="rule">・予約は先着順です</div>
            <div class="rule">・ご飯の時間になるとつじはご飯をたべます</div>
          </div>
          <div class="ticket-duration">${esc(String(ticket.duration_minutes))}分</div>
          <div class="ticket-meta">
            <span class="ticket-owner">${esc(ticket.owner)}</span>
            <span class="ticket-issuer">発行: TSUJI</span>
            <span class="ticket-expiry">有効期限: ∞</span>
          </div>
          <div class="ticket-icons">📖 ⚽ 🪁 🎮</div>
        </div>
      </div>
      ${isUsed ? '<div class="stamp-overlay">つかったよ</div>' : ''}
      ${!isUsed && !isAdmin ? `<button class="use-btn" ${!navigator.onLine ? 'disabled' : ''} onclick="confirmUse('${ticket.id}')">使う</button>` : ''}
    </div>
  `;
}

// --- 描画: 履歴 ---
function renderHistory() {
  const container = document.getElementById('ticketList');

  if (usedTickets.length === 0) {
    container.innerHTML = '<div class="empty-msg">まだ使ったチケットはありません</div>';
    return;
  }

  container.innerHTML = usedTickets.map(t => {
    const date = new Date(t.used_at);
    const dateStr = `${date.getMonth()+1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2,'0')}`;
    return `
      <div class="history-item">
        ${renderTicketCard(t)}
        <div class="used-date">使用: ${dateStr}</div>
      </div>
    `;
  }).join('');
}

// --- チケット使用: 確認 ---
function confirmUse(ticketId) {
  if (pendingTicketId) return;
  pendingTicketId = ticketId;
  document.getElementById('confirmOverlay').classList.add('active');
}

function cancelUse() {
  pendingTicketId = null;
  document.getElementById('confirmOverlay').classList.remove('active');
}

// --- チケット使用: 実行 ---
async function executeUse() {
  if (!pendingTicketId) return;

  const btn = document.querySelector('.confirm-ok-btn');
  btn.disabled = true;

  try {
    const { data, error } = await client
      .from('tickets')
      .update({ status: 'used', used_at: new Date().toISOString() })
      .eq('id', pendingTicketId)
      .eq('status', 'unused')
      .select();

    if (error || !data || data.length === 0) {
      if (error) {
        showError('チケットの使用に失敗しました');
      } else {
        showError('このチケットは既に使われています');
        await loadTickets();
        renderCurrentTab();
      }
      cancelUse();
      return;
    }

    // pendingTicketIdを退避してからcancelUse
    const ticketId = pendingTicketId;
    cancelUse();

    // スタンプ演出
    showStampAnimation(ticketId);
    await new Promise(r => setTimeout(r, 600));

    // Discord通知（fire-and-forget）
    const ticket = data[0];
    notifyWithTimeout(`🎫 ${ticket.owner}がチケットNo.${String(ticket.ticket_no)}を使いました！（${ticket.duration_minutes}分）`)
      .catch(() => console.warn('Discord通知失敗'));

    // 一覧を再描画
    await loadTickets();
    renderCurrentTab();
  } finally {
    btn.disabled = false;
  }
}

// --- スタンプ演出 ---
function showStampAnimation(ticketId) {
  const card = document.querySelector(`[data-ticket-id="${ticketId}"]`);
  if (!card) return;

  const stamp = document.createElement('div');
  stamp.className = 'stamp-overlay stamp-animate';
  stamp.textContent = 'つかったよ';
  card.appendChild(stamp);
}

// --- オフライン対応 ---
function disableAllTicketActions() {
  document.querySelectorAll('.use-btn, #issueBtn').forEach(b => b.disabled = true);
}

window.addEventListener('online', () => {
  document.body.classList.remove('offline');
  document.querySelectorAll('.use-btn, #issueBtn').forEach(b => b.disabled = false);
  loadTickets().then(renderCurrentTab);
});

window.addEventListener('offline', () => {
  document.body.classList.add('offline');
  cancelUse();
  disableAllTicketActions();
  showError('オフラインです');
});

// --- ページ読み込み ---
document.addEventListener('DOMContentLoaded', initTicketPage);
</script>
</body>
</html>
