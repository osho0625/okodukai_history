<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>洗濯通知</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2196F3">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 20px;
      padding: 40px 30px;
      box-shadow: 0 8px 32px rgba(33, 150, 243, 0.15);
      text-align: center;
      max-width: 360px;
      width: 100%;
    }
    h1 {
      font-size: 1.4rem;
      color: #1565c0;
      margin-bottom: 8px;
    }
    .icon { font-size: 3rem; margin-bottom: 12px; }
    .subtitle {
      font-size: 0.85rem;
      color: #666;
      margin-bottom: 24px;
    }
    .time-picker {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 28px;
    }
    .time-picker input[type="time"] {
      font-size: 1.8rem;
      padding: 10px 16px;
      border: 2px solid #90caf9;
      border-radius: 12px;
      color: #1565c0;
      background: #e3f2fd;
      text-align: center;
    }
    .time-picker input[type="time"]:focus {
      outline: none;
      border-color: #1976d2;
    }
    .notify-btn {
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: bold;
      color: white;
      background: linear-gradient(135deg, #42a5f5, #1976d2);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 12px rgba(25, 118, 210, 0.3);
    }
    .notify-btn:active {
      transform: scale(0.97);
    }
    .notify-btn:disabled {
      background: #bdbdbd;
      box-shadow: none;
      cursor: not-allowed;
    }
    .status {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #666;
      min-height: 20px;
    }
    .status.success { color: #2e7d32; }
    .status.error { color: #c62828; }
    .push-setup {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #e0e0e0;
    }
    .push-setup button {
      font-size: 0.8rem;
      padding: 8px 16px;
      border: 1px solid #90caf9;
      border-radius: 8px;
      background: white;
      color: #1976d2;
      cursor: pointer;
    }
    .push-setup .subscribed {
      color: #2e7d32;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🧺</div>
    <h1>洗濯通知</h1>
    <p class="subtitle">完了予定時刻を選んでボタンを押してね</p>

    <div class="time-picker">
      <input type="time" id="finishTime" value="19:00">
    </div>

    <button class="notify-btn" id="notifyBtn" onclick="scheduleNotification()">
      🔔 洗濯通知をセット
    </button>

    <div id="scheduledInfo" style="margin-top:16px; display:none;">
      <div style="background:#e8f5e9; border-radius:10px; padding:12px; font-size:0.85rem; color:#2e7d32;">
        <div id="scheduledText"></div>
        <button onclick="cancelScheduled()" style="margin-top:8px; font-size:0.75rem; padding:4px 12px; border:1px solid #a5d6a7; border-radius:6px; background:white; color:#c62828; cursor:pointer;">✕ キャンセル</button>
      </div>
    </div>

    <p class="status" id="status"></p>

    <div class="push-setup">
      <div id="pushStatus"></div>
      <button id="pushBtn" onclick="setupPush()">🔔 Push通知を有効にする</button>
    </div>
    <div style="margin-top:12px; font-size:0.65em; color:#bbb;" id="appVersion">laundry-v6</div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
