name: Auto Chore Points

on:
  schedule:
    # 毎時0分に実行し、スクリプト側で設定時刻(game_settings.auto_chore_config.hour)を判定して付与
    - cron: '0 * * * *'
  workflow_dispatch: # 手動実行も可能（手動時は現在時刻に関係なく即実行したい場合は下記 FORCE を使用）
    inputs:
      force:
        description: '設定時刻を無視して即時付与する'
        type: boolean
        default: false

jobs:
  auto-points:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run auto chore points
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FORCE_RUN: ${{ inputs.force }}
        run: node scripts/auto-chore-points.js
