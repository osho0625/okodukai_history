name: Auto Chore Points

on:
  schedule:
    # 毎日AM7:00 JST (UTC 22:00前日)
    - cron: '0 22 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  auto-points:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run auto chore points
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node scripts/auto-chore-points.js
