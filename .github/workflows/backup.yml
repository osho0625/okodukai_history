          # マスクしてからバックアップする（GitHub Push Protection対策）
          curl -s \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/app_config?select=*" \
          | jq 'map(if (.key // "" | test("api_key|key|token|secret|password"; "i"))
                    then .value = "***REDACTED***" else . end)' \
