            -o backups/math_battle_players_$(date +%Y%m%d).json

      - name: Backup math_battle_answers table
        run: |
          curl -s \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/math_battle_answers?select=*" \
            -o backups/math_battle_answers_$(date +%Y%m%d).json

      - name: Backup math_battle_disputes table
        run: |
          curl -s \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/math_battle_disputes?select=*" \
            -o backups/math_battle_disputes_$(date +%Y%m%d).json

      - name: Backup math_battle_dispute_votes table
        run: |
          curl -s \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/math_battle_dispute_votes?select=*" \
            -o backups/math_battle_dispute_votes_$(date +%Y%m%d).json

      - name: Delete backups older than 14 days
        run: |
          find backups/ -name "*.json" -mtime +14 -delete 2>/dev/null || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git diff --cached --quiet || git commit -m "backup: $(date +%Y-%m-%d)"
          git push

      - name: Notify Discord
        if: success()
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\":\"💾 自動バックアップ完了 ($(date +%Y/%m/%d))\"}" \
            "${{ secrets.DISCORD_WEBHOOK }}"
