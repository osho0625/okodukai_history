name: Daily Supabase Backup

on:
  schedule:
    # 毎日AM3:00 JST (UTC 18:00)
    - cron: '0 18 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
