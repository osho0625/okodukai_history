name: Daily Supabase Backup

on:
  schedule:
    # 毎日AM3:00 JST (UTC 18:00)
    - cron: '0 18 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create backup directory
        run: mkdir -p backups

      - name: Backup children table
        run: |
          curl -s \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/children?select=*" \
            -o backups/children_$(date +%Y%m%d).json

      - name: Backup transactions table
        run: |
          curl -s \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/transactions?select=*" \
            -o backups/transactions_$(date +%Y%m%d).json

      - name: Delete backups older than 14 days
        run: |
          find backups/ -name "*.json" -mtime +14 -delete 2>/dev/null || true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          git diff --cached --quiet || git commit -m "backup: $(date +%Y-%m-%d)"
          git push

      - name: Notify Discord
        if: success()
        run: |
          curl -s -H "Content-Type: application/json" \
            -d "{\"content\":\"💾 自動バックアップ完了 ($(date +%Y/%m/%d))\"}" \
            "${{ secrets.DISCORD_WEBHOOK }}"
