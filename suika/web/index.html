<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>すいかが食べたい - HTML5</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: sans-serif;
      color: #ccc;
    }
    h1 { font-size: 1rem; margin-bottom: 4px; }
    canvas {
      border: 2px solid #333;
      image-rendering: pixelated;
    }
    .info { margin-top: 4px; font-size: 0.7rem; color: #666; }
  </style>
</head>
<body>
  <h1>すいかが食べたい (HTML5 Port)</h1>
  <canvas id="game" width="400" height="320"></canvas>
  <p class="info">矢印キー: 移動 / Enter: 決定 / X: キャンセル / Z: メニュー / A/S: カメラ</p>
  <script type="module" src="main.js"></script>
</body>
</html>
